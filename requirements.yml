collections:
  # Dependabot does not update Galaxy collections; bump these by hand.
  # The versions have to work on the ansible-core that the AWX execution
  # environment ships, which dmf-infra pins in
  # k3s-lab-bootstrap/requirements-ansible-core.txt, and ansible.posix and
  # kubernetes.core match the EE's own list
  # (k3s-lab-bootstrap/ee/requirements.yml). ansible.utils is a dependency of
  # ansible.netcommon; it is pinned so the install cannot pick a release that
  # needs a newer core.
  - name: ansible.posix
    version: 1.6.2
  - name: ansible.netcommon
    version: 7.2.0
  - name: kubernetes.core
    version: 5.4.3
  - name: ansible.utils
    version: 5.1.2
