---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "docker"
    directory: "/roles/nmos-cpp/files"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
