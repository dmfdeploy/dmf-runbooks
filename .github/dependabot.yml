---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "no-issue"
    commit-message:
      prefix: "ci(deps)"
    # Major upgrades are done on purpose, as their own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "docker"
    directory: "/roles/nmos-cpp/files"
    schedule:
      interval: "monthly"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
    # Major upgrades are done on purpose, as their own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
