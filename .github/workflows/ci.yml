name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # The ansible package 15 needs Python 3.13 or later; the runner's default is 3.12.
          python-version: "3.13"
      - name: Install ansible tooling
        run: |
          python3 -m pip install --user -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: yamllint
        run: yamllint playbooks/ roles/
      - name: ansible-lint
        run: ansible-lint playbooks/ roles/ -p
      - name: ansible syntax-check
        run: |
          shopt -s nullglob
          for pb in playbooks/*.yml; do
            echo "=== syntax-check: $pb ==="
            ansible-playbook "$pb" --syntax-check
          done
      - name: tag-preservation survival test (ADR-0046)
        run: ansible-playbook tests/tag-preservation.yml

  l3-harness:
    # The suites run on the AWX execution environment's ansible-core and Python
    # (the `ee` leg) and on the newest release (the `latest` leg), because
    # behavior differs between the two (dmfdeploy/dmfdeploy#274 and
    # dmfdeploy/dmfdeploy#975). The legs stay
    # separate when their versions are equal, so the `ee` leg keeps following the
    # EE if `latest` moves on.
    #
    # The job timeout was raised from 30 to 45 minutes, and then to 60. The
    # tests/l3-finalise-purge-execution.yml suite (12 scenarios, ~19 nested
    # ansible-playbook subprocess invocations across its own stub-server
    # lifecycles) pushed this job right to the old 30-minute ceiling — the
    # ee-pinned leg passed at 29m15s, the latest leg was CANCELLED at
    # 30m17s mid-way through that suite's own run, a CI time-budget problem,
    # not a functional regression (the identical suite passes clean, real
    # local runs, well under 5 minutes on this repo's own dev hardware).
    runs-on: ubuntu-24.04
    # The ee leg took 43m05s on its first run, on Python 3.14; the latest leg took 25m51s.
    timeout-minutes: 60
    env:
      # The dmf-infra commit that defines the EE this repository runs on. The `ee`
      # leg reads its ansible-core pin and kubernetes client pin from that commit,
      # not from a moving branch, so a pin change in dmf-infra changes this CI
      # only when the new EE is published and this commit is moved. To move it:
      # publish the new EE image from dmf-infra, then set this to the commit that
      # built it (the image's org.opencontainers.image.revision label).
      EE_INFRA_REF: fc90d2f7e016c2b48919f684955a5473fc6bbf63
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dependabot does not track the pins in this matrix; bump them by hand.
          - name: ee
            # The EE image's Python: Fedora 45 `python3`, which ansible-core 2.22
            # supports (3.13 to 3.15). The step below asserts the minor version.
            python: "3.15"
          - name: latest
            # 3.13 is the lowest Python that ansible-core 2.22 supports, so this
            # leg tests the bottom of the range while the ee leg tests 3.15.
            core: "ansible-core==2.22.0"
            python: "3.13"
            k8s_client: "kubernetes==37.0.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out dmf-infra at the commit that defines the EE
        if: matrix.name == 'ee'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dmfdeploy/dmf-infra
          ref: ${{ env.EE_INFRA_REF }}
          path: .dmf-infra
          sparse-checkout: |
            k3s-lab-bootstrap/requirements-ansible-core.txt
            k3s-lab-bootstrap/ee/requirements.txt
          persist-credentials: false
      - name: Resolve this leg's pins
        env:
          MATRIX_CORE: ${{ matrix.core }}
          MATRIX_K8S: ${{ matrix.k8s_client }}
        run: |
          set -eu
          if [ "${{ matrix.name }}" = ee ]; then
            infra=.dmf-infra/k3s-lab-bootstrap
            core="$(cat "$infra/requirements-ansible-core.txt")"
            k8s="$(grep -E '^kubernetes==' "$infra/ee/requirements.txt")"
          else
            core="$MATRIX_CORE"
            k8s="$MATRIX_K8S"
          fi
          echo "CORE_PIN=$core" >> "$GITHUB_ENV"
          echo "K8S_PIN=$k8s" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "${{ matrix.python }}"
      - name: Install ansible-core (matrix leg)
        run: pip install "$CORE_PIN"
      - name: Install kubernetes python client
        # ansible-galaxy does not install collections' python dependencies;
        # kubernetes.core's k8s/k8s_info modules need this at runtime, or
        # every task using them fails ("Failed to import the required
        # Python library (kubernetes)") on a clean runner (dmfdeploy/dmfdeploy#274).
        run: pip install "$K8S_PIN"
      - name: Assert the interpreter and ansible-core are the leg's pins
        run: python3 tests/scripts/assert_toolchain.py --python "${{ matrix.python }}" --core "$CORE_PIN"
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: l3-budget-logic
        run: ansible-playbook tests/l3-budget-logic.yml
      - name: l3-budget-self-demand
        run: ansible-playbook tests/l3-budget-self-demand.yml
      - name: l3-control-flow
        run: ansible-playbook tests/l3-control-flow.yml
      - name: l3-playbook-structure
        run: ansible-playbook tests/l3-playbook-structure.yml
      - name: l3-playbook-execution
        run: ansible-playbook tests/l3-playbook-execution.yml
      - name: l3-reserved-var-meta-test
        run: ansible-playbook tests/l3-reserved-var-meta-test.yml
      - name: l3-topology-logic
        run: ansible-playbook tests/l3-topology-logic.yml
      - name: l3-topology-execution
        run: ansible-playbook tests/l3-topology-execution.yml
      - name: l3-switch-execution
        run: ansible-playbook tests/l3-switch-execution.yml
      - name: l3-finalise-purge-execution
        run: ansible-playbook tests/l3-finalise-purge-execution.yml
      - name: service-tag-patch-verified
        run: ansible-playbook tests/service-tag-patch-verified.yml
      - name: netbox-service-id-check
        run: ansible-playbook tests/netbox-service-id-check.yml

  review-comments:
    # Comments state why, not which review prompted them
    # (dmfdeploy/dmfdeploy#768). Allowlist: .review-comment-allow.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: No review history in comments
        run: bin/check-review-comments.sh
      - name: Allowlist parser self-test
        run: bin/check-review-comments.sh --self-test

  working-model:
    # Working-model block sync (umbrella issue dmfdeploy/dmfdeploy#32): the
    # agent-context block in CLAUDE.md/AGENTS.md/QWEN.md must stay byte-identical
    # to the umbrella template; --strict fails on a missing or drifted block.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Umbrella: canonical template + checker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dmfdeploy/dmfdeploy
          ref: working-model-v2
          path: .umbrella
          persist-credentials: false
      - name: Working-model block sync (strict)
        run: .umbrella/bin/check-working-model-sync.sh --repo . --strict --template .umbrella/docs/templates/working-model-block.md
