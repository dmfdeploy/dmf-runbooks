---
# umbrella #202 WP3-B stage — NetBox surface rollback (§4.2), revised by
# codex round-1 R2a-5 (by-id classification, exact-name lookup) and R2a-7
# (readback verification, threaded through the per-item task files).
#
# Same snapshot-vs-live diff principle as the helm surface: a CURRENT
# record whose ID was already in the pre-run snapshot pre-existed this run
# — restore it to exactly what the snapshot recorded (tags +
# custom_fields), never re-derive a fresh "bootstrapped" state that might
# not match what was actually there. A record whose ID is NOT in the
# snapshot was created by this run's own provision stage — finalise it
# (same PATCH shape a normal teardown sends) THEN delete it entirely, so a
# rolled-back run leaves no orphan catalog entry behind. R2a-5: this
# compares by ID, never by name alone (a delete-then-recreate under the
# same name is a NEW record, not "unchanged") — see l3_budget.py's
# l3_netbox_records_to_restore_or_delete docstring.
#
# R2a-5: looked up by EXACT NAME (l3_catalog_key — the same identity the
# provision stage's own lookup uses, see snapshot.yml's header comment),
# NOT by tag — a tag-based lookup would miss a record that hasn't (yet)
# been tagged app:<key>.
#
# merge_owned_tags is MANDATORY for every tags write here (ADR-0046
# decision 4) — loaded via a bare include_role (no tasks_from — same
# pattern tests/tag-preservation.yml itself uses), which pulls in both the
# merge_owned_tags FILTER (called directly via Jinja in the per-item task
# files, not through the merge_owned_tags.yml task-file wrapper — that
# wrapper is a convenience layer over the same filter, not required) and
# _netbox_owned_namespace.

- name: "L3 rollback: load netbox_catalog_common (merge_owned_tags filter + _netbox_owned_namespace)"
  ansible.builtin.include_role:
    name: netbox_catalog_common

- name: "L3 rollback: look up CURRENT NetBox service by EXACT NAME (R2a-5 — same identity the provision stage uses)"
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/ipam/services/?name={{ l3_catalog_key | urlencode }}"
    method: GET
    headers:
      Authorization: "Token {{ netbox_api_token }}"
    validate_certs: false
    return_content: true
  no_log: true
  register: _l3_current_netbox_lookup

- name: "L3 rollback: assert at most one record for this exact name (structural — NetBox name uniqueness)"
  ansible.builtin.assert:
    that:
      - (_l3_current_netbox_lookup.json.results | default([])) | length <= 1
    fail_msg: >-
      L3 rollback: NetBox returned
      {{ (_l3_current_netbox_lookup.json.results | default([])) | length }}
      records for the exact name '{{ l3_catalog_key }}' — service names
      must be unique; this is a structural NetBox data-integrity problem,
      not a per-run decision.

- name: "L3 rollback: extract current NetBox surface WITH id (pure — l3_netbox_surface_with_id)"
  ansible.builtin.set_fact:
    _l3_current_netbox_records: "{{ _l3_current_netbox_lookup.json.results | default([]) | l3_netbox_surface_with_id }}"
  no_log: true

- name: "L3 rollback: classify restore vs delete vs missing (pure — l3_netbox_records_to_restore_or_delete, R3a-7 iterates the SNAPSHOT's own ids)"
  ansible.builtin.set_fact:
    _l3_netbox_classification: >-
      {{ _l3_snapshot_netbox_surface | l3_netbox_records_to_restore_or_delete(_l3_current_netbox_records) }}
  no_log: true

- name: "L3 rollback: report NetBox classification"
  ansible.builtin.debug:
    msg: >-
      L3 rollback: {{ _l3_netbox_classification.restore | length }} record(s)
      to restore (pre-existed), {{ _l3_netbox_classification.delete | length }}
      record(s) to finalise+delete (run-created),
      {{ _l3_netbox_classification.missing | length }} snapshot record(s)
      UNRESTORABLE (absent from current entirely) for run_id={{ l3_run_id }}.

- name: "L3 rollback: initialize dirty accumulator"
  ansible.builtin.set_fact:
    _l3_netbox_dirty_accum: []

- name: "L3 rollback: restore pre-existing NetBox records"
  ansible.builtin.include_tasks: _rollback_netbox_restore_one.yml
  loop: "{{ _l3_netbox_classification.restore }}"
  loop_control:
    label: "{{ item.current.name }}"

- name: "L3 rollback: finalise + delete run-created NetBox records"
  ansible.builtin.include_tasks: _rollback_netbox_delete_one.yml
  loop: "{{ _l3_netbox_classification.delete }}"
  loop_control:
    label: "{{ item.name }}"

- name: "L3 rollback: report every UNRESTORABLE snapshot record (R3a-7 —
    codex round-2 P1-7: a snapshotted id absent from current entirely has
    NO PATCH target; the old classifier only ever iterated CURRENT
    records, so this was invisible to it and silently reported clean —
    e.g. probe snapshot=[{id:1,name:x}], current=[] -> restore=[],
    delete=[], dirty never set. Also naturally covers same-name-different-
    id: the OLD id's absence lands here as dirty EVEN AS the NEW id gets
    finalised+deleted below via the delete list, from the SAME by-id
    comparison.)"
  ansible.builtin.debug:
    msg: >-
      L3 rollback: snapshot record id={{ item.id }} name={{ item.name }}
      is UNRESTORABLE — absent from current NetBox entirely (deleted by
      something else during the run, with nothing reusing its identity).
      Marking the netbox surface dirty.
  loop: "{{ _l3_netbox_classification.missing }}"
  loop_control:
    label: "{{ item.name }}"

- name: "L3 rollback: fold missing (unrestorable) records into the dirty accumulator (R3a-7)"
  ansible.builtin.set_fact:
    _l3_netbox_dirty_accum: "{{ (_l3_netbox_dirty_accum | default([])) + [true] }}"
  when: (_l3_netbox_classification.missing | length) > 0

- name: "L3 rollback: determine netbox surface dirty state"
  ansible.builtin.set_fact:
    _l3_netbox_dirty: "{{ (_l3_netbox_dirty_accum | select | list | length) > 0 }}"
