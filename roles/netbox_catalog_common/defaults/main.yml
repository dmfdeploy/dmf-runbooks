# ADR-0046 decision 4 — the bounded tag namespace that catalog launchers own.
# Any tag NOT matching these prefixes/exact names is preserved verbatim
# across every lifecycle-stage PATCH (provision / configure / finalise).
_netbox_owned_namespace:
  - "dmf-catalog"
  - "app:"
  - "exposure:"
  - "lifecycle:"
  - "monitoring:"
