---
# MXL role defaults — NetBox catalog lifecycle for the MXL demo functions
# (mxl-videotestsrc, mxl-videotest-view). Provision + Configure +
# Finalise stages, mirroring roles/nmos-cpp (ADR-0012, ADR-0025, ADR-0037 D3,
# ADR-0038 Amendment A). One role, parameterized per catalog entry via
# mxl_function_key / mxl_release / mxl_monitoring_enabled.
mxl_namespace: mxl

# NetBox integration — identical posture to roles/nmos-cpp: cluster-internal
# service DNS (the launcher runs in an in-cluster AWX EE pod, ADR-0025 Lane B),
# single scoped catalog-writer token (ADR-0032) for reads and writes.
netbox_api_url: "http://netbox.netbox.svc.cluster.local"
# umbrella #202 WP3 R3a-9 (codex round-2 P1-9): NO fallback to
# vault_netbox_api_token (the admin token) — a missing scoped
# catalog-writer token must FAIL (via the ensuing NetBox 401/403 on any
# call using it), never silently upgrade to the admin token (ADR-0032).
netbox_api_token: "{{ vault_netbox_catalog_token | default('') }}"

# Which catalog entry this run manages: service name + app:<key> tag.
mxl_function_key: mxl-videotestsrc
# Helm release name — also the per-release status Service name the chart
# renders, which is exactly what ADR-0038 Amendment A stamps as cluster_service.
mxl_release: "{{ mxl_function_key }}"
mxl_service_description: "DMF catalog: MXL demo function {{ mxl_function_key }}"
# The status sidecar port — the probe + console live-view surface.
mxl_service_ports: [9000]
mxl_cluster_port: 9000
mxl_probe_path: "/status"
mxl_monitoring_enabled: true

# Parent for the ipam.Service generic relation — the LB device, following the
# dmf-born-inventory / nmos-cpp convention for catalog app services.
netbox_service_parent_device: dmf-traefik

# umbrella #202 WP3 R6b (codex round-6, umbrella #267): true single-source
# for mxl's NetBox identity, mirroring R6a's helm-axis fix. roles/l3_run_guard/
# tasks/snapshot.yml's own pre-run NetBox lookup (and capacity.yml's gate)
# use l3_catalog_key/l3_release/l3_target_namespace — the SAME play-scope
# vars launch-mxl-fabrics-demo.yml defines once and the l3_run_guard gate
# consumes via ambient scope (R6a). Below, netbox_service_name/the app:<>
# tag/the monitoring cluster_service+cluster_namespace now read those SAME
# l3_* names FIRST (when the L3 gate is in play, they're always defined —
# R6a's own play vars), falling back to mxl_function_key/mxl_release/
# mxl_namespace only for a standalone, non-L3-gated use of this role (no
# l3_catalog_key/l3_release/l3_target_namespace defined at all). This closes
# the exact divergence codex round-6 found: a caller-supplied
# mxl_function_key extra_var used to retarget THIS role's own NetBox
# mutation independently of what the gate's snapshot looked up by — now
# mxl_function_key has no effect at all on the NetBox identity while the L3
# gate is in play, since these read l3_catalog_key directly, not the
# playbook's own mxl_function_key alias.
#
# umbrella #201 WP3 fix-round (finding 7's own coverage caught this LIVE):
# mxl_group_item_identity is the ONLY way a caller can retarget this role's
# NetBox identity to something OTHER than l3_catalog_key/l3_release for a
# single include_role call — setting l3_catalog_key/l3_release themselves
# via that call's own `vars:` does NOT work, because Ansible's variable
# precedence has extra_vars outrank BOTH task vars AND include_role params
# identically; l3_catalog_key/l3_release are themselves ALWAYS extra-var-
# supplied (the view JT's own prebound identity) for the whole play's
# duration, so a per-iteration `vars: {l3_catalog_key: ...}` on a looped
# include_role is silently a no-op — confirmed by an execution-harness
# scenario that expected N NetBox records and got exactly 1. Empty by
# default (a no-op — every existing caller keeps reading l3_catalog_key/
# l3_release exactly as before); launch-mxl-fabrics-demo.yml's own
# topology release-group loop is the only caller that sets it (to each
# item's own release/netbox_service_name — identical values for a group
# item, so one override var covers both netbox_service_name and
# cluster_service below).
mxl_group_item_identity: ""
netbox_service_name: >-
  {{
    mxl_group_item_identity
    if (mxl_group_item_identity | default('') | trim) != ''
    else (l3_catalog_key | default(mxl_function_key, true))
  }}
netbox_service_tags:
  - name: "dmf-catalog"
  - name: "app:{{ netbox_service_name }}"
  - name: "exposure:private"
  - name: "lifecycle:bootstrapped"
netbox_service_active_tags:
  - name: "dmf-catalog"
  - name: "app:{{ netbox_service_name }}"
  - name: "exposure:private"
  - name: "lifecycle:active"
netbox_service_monitoring_tags: >-
  {{ [{'name': 'monitoring:probe'}] if mxl_monitoring_enabled else [] }}
# ADR-0038 Amendment A cluster coords + Amendment B probe_path: dmf-promsd
# probes http://<cluster_service>.<cluster_namespace>:<cluster_port><probe_path>
# — the chart's per-release status Service serving /status (JSON 200).
# R6b: cluster_service reads netbox_service_name (itself
# mxl_group_item_identity-first, l3_release-second — same override as
# above; a group item's own release name IS its cluster_service, since the
# chart's per-release status Service is named after the Helm release).
# cluster_namespace reads l3_target_namespace/mxl_namespace unchanged — the
# topology group shares ONE namespace with the scalar viewer, never
# overridden per item.
netbox_service_monitoring_custom_fields: >-
  {{
    {
      'probe_module': 'http_2xx',
      'probe_path': mxl_probe_path,
      'cluster_service': (
        mxl_group_item_identity
        if (mxl_group_item_identity | default('') | trim) != ''
        else (l3_release | default(mxl_release, true))
      ),
      'cluster_namespace': l3_target_namespace | default(mxl_namespace, true),
      'cluster_port': mxl_cluster_port,
    } if mxl_monitoring_enabled else {}
  }}
netbox_service_monitoring_custom_fields_clear:
  probe_module: null
  probe_path: null
  cluster_service: null
  cluster_namespace: null
  cluster_port: null
