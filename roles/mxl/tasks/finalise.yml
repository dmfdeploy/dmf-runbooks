---
# MXL - Finalise stage (ADR-0012, ADR-0025)
# Helm uninstall owns workload removal. This stage only resets NetBox state:
# lifecycle back to bootstrapped, cluster_*/probe_* stamps cleared so the
# dynamic probe lane drops the target (ADR-0038).

- name: "Look up {{ mxl_function_key }} service in NetBox"
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/ipam/services/?name={{ netbox_service_name | urlencode }}"
    method: GET
    headers:
      Authorization: "Token {{ netbox_api_token }}"
    validate_certs: false
    return_content: true
  no_log: true
  register: _mxl_service_lookup

- name: "Set {{ mxl_function_key }} service id fact"
  ansible.builtin.set_fact:
    mxl_netbox_service_id: "{{ (_mxl_service_lookup.json.results | first | default({})).id | default(0) }}"
  no_log: true

- name: Assert NetBox service exists
  ansible.builtin.assert:
    that:
      - mxl_netbox_service_id | int > 0
    fail_msg: "NetBox service '{{ netbox_service_name }}' not found. Did the Provision stage create this service?"
  no_log: true

- name: Flip NetBox tag to lifecycle:bootstrapped and clear monitoring stamps
  ansible.builtin.uri:
    url: "{{ netbox_api_url }}/api/ipam/services/{{ mxl_netbox_service_id }}/"
    method: PATCH
    headers:
      Authorization: "Token {{ netbox_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      tags: "{{ netbox_service_tags }}"
      custom_fields: "{{ netbox_service_monitoring_custom_fields_clear }}"
    validate_certs: false
    status_code: [200]
  no_log: true

- name: Report teardown complete
  ansible.builtin.debug:
    msg: >-
      MXL Helm release {{ mxl_release }} removed by the launcher.
      NetBox tag reset to lifecycle:bootstrapped; monitoring stamps cleared.
