              - name: l3-stub
                user:
                  token: fake-test-token

        # Same reason as scenarios (8)/(9)/(10): this run reaches PAST the
        # gate (snapshot.yml's own `helm list` baseline capture,
        # capacity.yml's `helm pull`+`helm template` render), so the
        # `helm` PATH shim is required even though this scenario's own
