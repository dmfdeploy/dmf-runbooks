    # Scenario 8 (R6a-2a, codex round-5): launch-nmos-cpp.yml SUCCESS-PATH
    # gate-return probe. Every scenario above injects its fault at
    # post-lock — INSIDE the gate role's own main.yml, before the role's
    # `include_role` task in the CALLING PLAYBOOK ever completes and
    # returns control to the playbook's own subsequent tasks. That is
    # exactly why R5a-2's broken post-hoc "single-source identity check"
    # assert (which referenced the include_role task's own vars:-scoped
    # l3_release/l3_catalog_key/l3_chart_* names — undefined the instant
    # that task finishes) shipped for a full round undetected: nothing
    # ever exercised the return boundary.
    #
    # This scenario deliberately crosses it: NO l3_* identity extra-vars
    # (a genuine caller, not a forger), l3_override=true (required — the
    # harness's stub_helm.sh `template` case always echoes an empty
    # manifest, see tests/harness/README.md's "Known gaps", so
    # capacity.yml's own missing-budget refusal would otherwise refuse
    # before the gate ever returns; the override is a legitimate,
    # supported bypass of THAT specific refusal, unrelated to the
    # single-source property under test here), and the fault is injected
    # at post-mutation-start — the FIRST boundary reachable strictly AFTER
    # the gate include has already returned and the playbook's own "mark
    # mutation as STARTED" task has already run.
    #
    # Discriminator: gate_rescue.yml classifies purely on whether
    # l3_mutation_started was ever set (R4a Backbone) — marker token
    # preflight-error (pre-mutation) vs post-mutation-failed (post-
    # mutation; gate_rescue.yml:123). Against the OLD broken assert, the
    # "mark mutation as STARTED" set_fact task is UNREACHABLE (the assert
    # immediately before it fails first) — the run fails with an
    # "l3_release is undefined" error and a PRE-mutation preflight-error
    # marker. Against the FIXED code (no assert, single play-scope
    # source), the run reaches "mark mutation as STARTED" cleanly, so the
    # SAME fault instead produces a POST-mutation post-mutation-failed
    # marker — a different, cleanly assertable token, not just "did it
    # fail". See this round's report for the actual discrimination proof
    # (temporarily reverting to the old broken assert and re-running this
    # exact scenario).
    # ════════════════════════════════════════════════════════════════════
    - name: "(8) launch-nmos-cpp.yml SUCCESS-PATH gate-return probe (R6a-2a) — start fresh stubs, run the REAL playbook as a nested ansible-playbook"
