              netbox stub was never queried by name (the run never even
              reached snapshot.yml's own lookup). stdout={{ _pe11_run.stdout }}

        - name: "(11) read the netbox invocation log"
          ansible.builtin.slurp:
            src: /tmp/l3-pe-11-netbox.log
