---
# umbrella #202 WP3 R5a-6 (codex round-4 P2-3) — REAL-playbook stubbed
# execution tests. tests/l3-control-flow.yml (R4a-R5a) proves the
# task-file/control-flow layer against a FIXTURE that REPLICATES the real
# playbooks' block/rescue/always shape — it never runs, or even looks at,
# the actual 7 playbooks under playbooks/. This suite closes exactly that
# gap (codex round-4's P2-3 finding): it runs each REAL, unmodified
# playbooks/*.yml file, as a real `ansible-playbook` subprocess, against
# the test harness stubs, with a fault injected at the shared `post-lock`
# boundary (roles/l3_run_guard/tasks/lock.yml's own fault_inject.yml
# include — the ONLY fault-injection boundary reachable from OUTSIDE the
# gate role's own stages 4-5, see this file's own rollback scenario
# comment for why that matters) — so every scenario fails BEFORE reaching
# any step that would need a real/successful Helm install or a real K8s
# workload-readiness wait (see tests/harness/README.md's "Known gaps" —
# helm template/pull stubbing here is minimal by design).
#
# WHY THIS MATTERS (the exact regression class this closes): two real
# bugs shipped this round undetected by ANY test, because the fixture the
# old suite runs never had the defect shape to begin with:
#   1. launch-nmos-crosspoint.yml's own credential assert used to sit
#      BEFORE the outer block (fixed R5a-3) — a missing secret produced a
#      raw task-zero failure with no gate cleanup and no DMF_L3_OUTCOME
#      marker at all.
#   2. several lock-lifecycle checkpoints were missing before terminal
#      ConfigMap patches (fixed R5a-4).
# tests/l3-playbook-structure.yml (this task's other half) proves the
# STATIC shape that prevents bug class 1 from recurring; THIS file proves
# the real playbooks' DYNAMIC failure-path behavior — that a fault this
# early genuinely propagates, unconditionally releases the facility lock,
# and (launch/teardown) emits exactly the one honest pre-mutation marker
# dmf-cms needs to classify the outcome.
#
# Run:  ansible-playbook tests/l3-playbook-execution.yml
#
# Each scenario starts a FRESH stub-server process (fresh OS process =
# fresh STATE, see tests/harness/README.md) so scenarios never leak state
# into each other, then runs ONE real playbooks/*.yml file as a nested
# `ansible-playbook` subprocess (mirrors how AWX job events / dmf-cms
# parse real stdout — same idiom as tests/l3-control-flow.yml's own
# fixture invocations) and asserts:
#   1. the run FAILED (rc != 0) — the injected fault propagated.
#   2. exactly the EXPECTED number of DMF_L3_OUTCOME marker lines, with
#      the expected token, appear in stdout.
#   3. via REAL HTTP against the stub K8s API, the facility lock
#      ConfigMap is gone (404) afterward — proving unconditional release.
#
# WHY `post-lock`, not `post-first-mutation` (the OTHER boundary
# tests/l3-control-flow.yml's own fixture exercises): `post-lock` is
# wired ONCE, inside roles/l3_run_guard/tasks/lock.yml itself, which
# EVERY entry path (launch's main.yml stage 3, teardown's lock_only.yml,
# rollback's own stage 2) runs through — so a single boundary name
# reaches all 7 real playbooks with zero playbook-specific
# fault-boundary wiring. `post-first-mutation`, by contrast, is only
# wired at explicit include points INSIDE each launch-*.yml/
# teardown-*.yml playbook's own tasks — reaching it on the real playbooks
# would additionally require a real (or much more thoroughly stubbed)
# first mutation (nmos-cpp/nmos-crosspoint/mxl role provision stage) to
# complete first, which is explicitly out of scope here (see this file's
# own header above + tests/harness/README.md's "Known gaps"). `post-lock`
# alone is sufficient to prove the property this task cares about: a
# fault firing genuinely early, on the REAL playbook files, unconditionally
# releases the lock and (launch/teardown) emits one honest marker.
#
# KUBECONFIG, not module_defaults: this suite cannot add
# `module_defaults: group/kubernetes.core.k8s: {...}` to the invocation
# the way tests/harness/fixtures/*.yml do (those ARE the test-owned
# fixture files; playbooks/*.yml are the REAL, unmodified production
# files this task must not touch) — kubernetes.core.k8s_info/k8s calls
# inside the role (the lock's own cluster-truth readback, R5a/P1-1) don't
# read l3_kube_api_url/l3_kube_api_token at all, only the official
# `kubernetes` Python client's own connection resolution does. Per
# tests/harness/README.md's own documented alternative ("or globally via
# the module defaults group / a generated kubeconfig file (KUBECONFIG env
# var) if a test playbook needs to exercise the role's unmodified tasks
# without adding per-task connection params"), each scenario below
# writes a minimal kubeconfig (fake bearer token,
# insecure-skip-tls-verify: true, pointed at that scenario's own stub)
# and sets KUBECONFIG in the nested ansible-playbook subprocess's own
# environment. This was found the hard way while building this suite: an
# early draft that supplied only l3_kube_api_url/l3_kube_api_token (no
# KUBECONFIG) got a DIFFERENT, unrelated failure — "facility-busy
# (lock-verify-failed)" — because the readback's k8s_info call fell
# through to whatever a bare/absent kubeconfig resolves to on the
# operator's machine, not the stub.
#
# R5a-6 FINDING, FIXED same round: this suite's own construction
# surfaced that rollback.yml's stages 1-2 (identity, facility lock) used
# to run OUTSIDE rollback.yml's own inner block/rescue — the exact same
# "early stages ran unenclosed" bug R4a/P1-3 fixed for launch/teardown,
# never carried over to rollback. An UNEXPECTED failure during those two
# stages (like the shared `post-lock` fault used below) propagated with
# the facility lock still correctly released (rollback-run.yml's own
# outer always: release.yml backstop covered that), but ZERO
# DMF_L3_OUTCOME marker was ever emitted — unlike every equivalent early
# failure on launch/teardown, which always gets exactly one honest
# pre-mutation marker via gate_rescue.yml. Fixed in roles/l3_run_guard/
# tasks/rollback.yml by moving stages 1-2 INSIDE the existing block, so
# its own rescue (already covering stages 3-6) now covers the whole
# flow — matching launch/teardown's Backbone shape exactly. Scenario 7
# below now asserts the FIXED behavior: exactly one marker
# (rollback_incomplete, rollback's own generic "unexpected pre-terminal
# failure" token — see rollback.yml's own rescue), same as every other
# entry playbook's post-lock fault scenario.

- name: "Umbrella #202 WP3 R5a-6 — L3 real-playbook stubbed execution tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    l3_harness_dir: "{{ playbook_dir }}/harness"

  tasks:
    # ════════════════════════════════════════════════════════════════════
    # Scenario 1: launch-nmos-cpp.yml, fault at post-lock
    # ════════════════════════════════════════════════════════════════════
    - name: "(1) launch-nmos-cpp.yml @ post-lock — start fresh stubs, run the REAL playbook as a nested ansible-playbook"
      vars:
        _pe1_run_id: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      block:
        - name: "(1) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-pe-1.json]
          changed_when: false
          failed_when: false

        - name: "(1) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-pe-1.json]
          register: _pe1_start
          changed_when: false

        - name: "(1) parse stub URLs"
          ansible.builtin.set_fact:
            _pe1_k8s_url: "{{ _pe1_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _pe1_netbox_url: "{{ _pe1_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(1) write a minimal kubeconfig pointed at this scenario's own K8s stub (see this file's own header — module_defaults can't be added to a REAL playbook invocation)"
          ansible.builtin.copy:
            dest: /tmp/l3-pe-1-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _pe1_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(1) run the REAL playbooks/launch-nmos-cpp.yml as a nested ansible-playbook, fault injected at post-lock"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-nmos-cpp.yml"
              - -e
              - "l3_kube_api_url={{ _pe1_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _pe1_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - l3_fault_inject=post-lock
              - -e
              - "l3_request_id={{ _pe1_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-pe-1-kubeconfig.yaml
          register: _pe1_run
          changed_when: false
          failed_when: false

        - name: "(1) ASSERT: the REAL playbook run FAILED (the injected fault propagated)"
          ansible.builtin.assert:
            that:
              - _pe1_run.rc != 0
            fail_msg: "(1) FAIL — launch-nmos-cpp.yml (post-lock) exited 0; the injected fault did not propagate. stdout={{ _pe1_run.stdout }}"

        - name: "(1) ASSERT: exactly ONE DMF_L3_OUTCOME marker, token preflight-error (pre-mutation — nothing was mutated yet)"
          ansible.builtin.set_fact:
            _pe1_markers: "{{ (_pe1_run.stdout_lines | select('match', '.*DMF_L3_OUTCOME:.*') | list) }}"

        - name: "(1) assert marker-count + token"
          ansible.builtin.assert:
            that:
              - _pe1_markers | length == 1
              - "'preflight-error' in _pe1_markers[0]"
            fail_msg: "(1) FAIL — expected exactly one preflight-error marker, got: {{ _pe1_markers }}"

        - name: "(1) ASSERT (via real HTTP against the stub): the facility lock was released"
          ansible.builtin.uri:
            url: "{{ _pe1_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(1) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-pe-1.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 2: launch-nmos-crosspoint.yml, fault at post-lock (a real,
    # non-empty admin password is supplied so the R5a-3 in-block
    # credential assert would pass IF it were ever reached — it isn't,
    # since post-lock fires earlier, inside the gate's own main.yml, but
    # supplying a real password keeps this scenario honest about not
    # relying on THAT assert to produce the failure under test)
    # ════════════════════════════════════════════════════════════════════
    - name: "(2) launch-nmos-crosspoint.yml @ post-lock — start fresh stubs, run the REAL playbook as a nested ansible-playbook"
      vars:
        _pe2_run_id: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      block:
        - name: "(2) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-pe-2.json]
          changed_when: false
          failed_when: false

        - name: "(2) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-pe-2.json]
          register: _pe2_start
          changed_when: false

        - name: "(2) parse stub URLs"
          ansible.builtin.set_fact:
            _pe2_k8s_url: "{{ _pe2_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _pe2_netbox_url: "{{ _pe2_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(2) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-pe-2-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _pe2_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(2) run the REAL playbooks/launch-nmos-crosspoint.yml as a nested ansible-playbook, fault injected at post-lock"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-nmos-crosspoint.yml"
              - -e
              - "l3_kube_api_url={{ _pe2_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _pe2_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - l3_fault_inject=post-lock
              - -e
              - "l3_request_id={{ _pe2_run_id }}"
              - -e
              - vault_nmos_crosspoint_admin_password=fake-admin-password
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-pe-2-kubeconfig.yaml
          register: _pe2_run
          changed_when: false
          failed_when: false

        - name: "(2) ASSERT: the REAL playbook run FAILED (the injected fault propagated)"
          ansible.builtin.assert:
            that:
              - _pe2_run.rc != 0
            fail_msg: "(2) FAIL — launch-nmos-crosspoint.yml (post-lock) exited 0; the injected fault did not propagate. stdout={{ _pe2_run.stdout }}"

        - name: "(2) ASSERT: exactly ONE DMF_L3_OUTCOME marker, token preflight-error"
          ansible.builtin.set_fact:
            _pe2_markers: "{{ (_pe2_run.stdout_lines | select('match', '.*DMF_L3_OUTCOME:.*') | list) }}"

        - name: "(2) assert marker-count + token"
          ansible.builtin.assert:
            that:
              - _pe2_markers | length == 1
              - "'preflight-error' in _pe2_markers[0]"
            fail_msg: "(2) FAIL — expected exactly one preflight-error marker, got: {{ _pe2_markers }}"

        - name: "(2) ASSERT (via real HTTP against the stub): the facility lock was released"
          ansible.builtin.uri:
            url: "{{ _pe2_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(2) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-pe-2.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 3: launch-mxl-fabrics-demo.yml, fault at post-lock
    # ════════════════════════════════════════════════════════════════════
    - name: "(3) launch-mxl-fabrics-demo.yml @ post-lock — start fresh stubs, run the REAL playbook as a nested ansible-playbook"
      vars:
        _pe3_run_id: "cccccccccccccccccccccccccccccccc"
      block:
        - name: "(3) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-pe-3.json]
          changed_when: false
          failed_when: false

        - name: "(3) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-pe-3.json]
          register: _pe3_start
          changed_when: false

        - name: "(3) parse stub URLs"
          ansible.builtin.set_fact:
            _pe3_k8s_url: "{{ _pe3_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _pe3_netbox_url: "{{ _pe3_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(3) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-pe-3-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _pe3_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(3) run the REAL playbooks/launch-mxl-fabrics-demo.yml as a nested ansible-playbook, fault injected at post-lock"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _pe3_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _pe3_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - l3_fault_inject=post-lock
              - -e
              - "l3_request_id={{ _pe3_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-pe-3-kubeconfig.yaml
          register: _pe3_run
          changed_when: false
          failed_when: false

        - name: "(3) ASSERT: the REAL playbook run FAILED (the injected fault propagated)"
          ansible.builtin.assert:
            that:
              - _pe3_run.rc != 0
            fail_msg: "(3) FAIL — launch-mxl-fabrics-demo.yml (post-lock) exited 0; the injected fault did not propagate. stdout={{ _pe3_run.stdout }}"

        - name: "(3) ASSERT: exactly ONE DMF_L3_OUTCOME marker, token preflight-error"
          ansible.builtin.set_fact:
            _pe3_markers: "{{ (_pe3_run.stdout_lines | select('match', '.*DMF_L3_OUTCOME:.*') | list) }}"

        - name: "(3) assert marker-count + token"
          ansible.builtin.assert:
            that:
              - _pe3_markers | length == 1
              - "'preflight-error' in _pe3_markers[0]"
            fail_msg: "(3) FAIL — expected exactly one preflight-error marker, got: {{ _pe3_markers }}"

        - name: "(3) ASSERT (via real HTTP against the stub): the facility lock was released"
          ansible.builtin.uri:
            url: "{{ _pe3_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(3) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-pe-3.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 4: teardown-nmos-cpp.yml, fault at post-lock
    # ════════════════════════════════════════════════════════════════════
    - name: "(4) teardown-nmos-cpp.yml @ post-lock — start fresh stubs, run the REAL playbook as a nested ansible-playbook"
      vars:
        _pe4_run_id: "dddddddddddddddddddddddddddddddd"
      block:
        - name: "(4) stop any stale stub servers"
