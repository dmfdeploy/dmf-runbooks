    # ════════════════════════════════════════════════════════════════════
    # Scenario 10: launch-mxl-fabrics-demo.yml — forged l3_chart_set_values
    # no-divergence probe. R6a's single-source fix (see launch-mxl-
    # fabrics-demo.yml's own header comment) made l3_chart_set_values ONE
    # play-scoped variable consumed identically by capacity.yml's own
    # `helm template` render (via l3_set_flag_argv) AND this playbook's
    # own `helm upgrade --install` step (also via l3_set_flag_argv, for
    # mxl specifically — the raw-command launch play). Scenarios 1-9 all
    # prove CONTROL-FLOW properties (fault propagation, lock release,
    # marker tokens); none of them ever inspects the actual --set VALUES
    # either call receives. This scenario closes that gap: it forges
    # l3_chart_set_values via extra_vars (a caller supplying the exact
    # same name a legitimate playbook var also uses) and proves, via
    # stub_helm.sh's new unconditional L3_STUB_HELM_LOG, that the SAME
    # concrete --set argument set reaches BOTH the render and the real
    # install call — not merely that both reference the same variable
    # NAME, but that the same forged VALUE flows through to both.
    #
    # mxl is the target (not nmos-cpp/nmos-crosspoint) because its install
    # step is already a raw `ansible.builtin.command: argv: [helm,
    # upgrade, --install, ...]` built via l3_set_flag_argv(
    # l3_chart_set_values) directly — the same filter+source pair
    # capacity.yml's own render uses — so there's no
    # kubernetes.core.helm module indirection to account for; the
    # L3_STUB_HELM_LOG argv capture is the single, uniform observation
    # mechanism for both calls. l3_override=true is required for the same
    # reason scenarios 8-9 need it: stub_helm.sh's `template` case always
    # echoes an empty manifest, so capacity.yml's own missing-budget
    # refusal would otherwise fire before either call under test can be
    # compared.
    #
    # A forged l3_chart_set_values is passed as a single JSON-object `-e`
    # argument (`{"l3_chart_set_values": ["forged.key=forged-value"]}`),
    # not the `-e l3_chart_set_values=[...]` k=v form the plan sketch
    # suggested — verified empirically (ansible-core 2.20.5) that the k=v
    # form leaves the value as the literal STRING
    # '["forged.key=forged-value"]' (parse_kv never JSON-decodes an
    # individual value), which l3_set_flag_argv would then iterate
    # CHARACTER BY CHARACTER (Python iterates a string by char), silently
    # producing a "pass" that isn't actually exercising a real forged
    # list. A single `-e` argument whose FIRST character is `{` is instead
    # parsed as a JSON/YAML document by ansible-core's own extra_vars
    # loader (see `ansible/cli/__init__.py:load_extra_vars`), which is
    # what actually round-trips l3_chart_set_values as a real Python list.
    # ════════════════════════════════════════════════════════════════════
    - name: "(10) launch-mxl-fabrics-demo.yml forged l3_chart_set_values — prove the render (helm template) and the install (helm upgrade --install) consume the IDENTICAL concrete --set values"
      vars:
        _pe10_run_id: "1010101010101010101010101010101a"
        _pe10_forged_value: "forged.key=forged-value"
      block:
        - name: "(10) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-pe-10.json]
          changed_when: false
          failed_when: false

        - name: "(10) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-pe-10.json]
          register: _pe10_start
          changed_when: false

        - name: "(10) parse stub URLs"
          ansible.builtin.set_fact:
            _pe10_k8s_url: "{{ _pe10_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _pe10_netbox_url: "{{ _pe10_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(10) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-pe-10-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _pe10_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        # Same reason as scenarios (8)/(9): this run reaches PAST the gate
        # (snapshot.yml's own `helm list` baseline capture, capacity.yml's
        # `helm pull`+`helm template` render) and then the playbook's own
        # `helm pull`+`helm upgrade --install`, so the `helm` PATH shim is
        # required.
        - name: "(10) create the helm PATH shim dir"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin
            state: directory

        - name: "(10) symlink helm -> stub_helm.sh"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin/helm
            src: "{{ l3_harness_dir }}/stub_helm.sh"
            state: link
            force: true

        - name: "(10) remove any stale helm invocation log from a prior run"
          ansible.builtin.file:
            path: /tmp/l3-pe-10-helm.log
            state: absent

        - name: "(10) run the REAL playbooks/launch-mxl-fabrics-demo.yml as a nested ansible-playbook — l3_chart_set_values forged via a single JSON -e argument, l3_override for the stub's empty-render"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _pe10_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _pe10_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - l3_override=true
              - -e
              - l3_override_reason=(10) no-divergence probe - stub helm template always renders empty, expected
              - -e
              - "l3_request_id={{ _pe10_run_id }}"
              - -e
              - '{"l3_chart_set_values": ["{{ _pe10_forged_value }}"]}'
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-pe-10-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-pe-10-helm.log
          register: _pe10_run
          changed_when: false
          failed_when: false

        - name: "(10) stat the helm invocation log"
          ansible.builtin.stat:
            path: /tmp/l3-pe-10-helm.log
          register: _pe10_helm_log_stat

        - name: "(10) ASSERT: the helm invocation log exists (both the template render and the upgrade/install call must have reached stub_helm.sh)"
          ansible.builtin.assert:
            that:
              - _pe10_helm_log_stat.stat.exists
            fail_msg: >-
              (10) FAIL — /tmp/l3-pe-10-helm.log does not exist; stub_helm.sh
              was never invoked (PATH shim broken, or the run never even
              reached the gate's own render call). stdout={{ _pe10_run.stdout }}

        - name: "(10) read the helm invocation log"
          ansible.builtin.slurp:
            src: /tmp/l3-pe-10-helm.log
          register: _pe10_helm_log_raw

        - name: "(10) parse helm invocation log lines, isolate the template (render) and upgrade (install) invocations"
          ansible.builtin.set_fact:
            _pe10_helm_log_lines: "{{ (_pe10_helm_log_raw.content | b64decode).splitlines() }}"

        - name: "(10) isolate the template and upgrade invocation lines"
          ansible.builtin.set_fact:
            _pe10_template_lines: "{{ _pe10_helm_log_lines | select('match', '^template ') | list }}"
            _pe10_upgrade_lines: "{{ _pe10_helm_log_lines | select('match', '^upgrade ') | list }}"

        - name: "(10) ASSERT: both the render call (helm template, from capacity.yml) and the install call (helm upgrade --install, from this playbook's own Deploy step) were logged — proves the run got PAST both calls under test"
          ansible.builtin.assert:
            that:
              - _pe10_template_lines | length >= 1
              - _pe10_upgrade_lines | length >= 1
            fail_msg: >-
              (10) FAIL — expected at least one 'template' and one
              'upgrade' helm invocation logged, got
              template={{ _pe10_template_lines | length }}
              upgrade={{ _pe10_upgrade_lines | length }}. Full log:
              {{ _pe10_helm_log_lines }}. stdout={{ _pe10_run.stdout }}

        - name: "(10) extract the --set arguments each call actually received (sorted — order may legitimately differ)"
          ansible.builtin.set_fact:
            _pe10_template_set_values: "{{ _pe10_template_lines[-1] | regex_findall('--set\\s+(\\S+)') | sort }}"
            _pe10_upgrade_set_values: "{{ _pe10_upgrade_lines[-1] | regex_findall('--set\\s+(\\S+)') | sort }}"

        - name: "(10) ASSERT: the CONCRETE --set value sets from the render and the install are equal, and BOTH contain the forged value — the render and the real install consumed the identical concrete rendered-demand inputs for a forged extra_var, not just the same variable NAME"
          ansible.builtin.assert:
            that:
              - _pe10_template_set_values == _pe10_upgrade_set_values
              - _pe10_forged_value in _pe10_template_set_values
              - _pe10_forged_value in _pe10_upgrade_set_values
            fail_msg: >-
              (10) FAIL — the render's (helm template) --set values and the
              install's (helm upgrade --install) --set values diverged for
              a forged l3_chart_set_values extra_var.
              template={{ _pe10_template_set_values }}
              upgrade={{ _pe10_upgrade_set_values }}
      always:
        - name: "(10) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-pe-10.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 11 (R6b, codex round-6, umbrella #267): mxl NetBox-identity
    # no-divergence probe — the NetBox-axis twin of scenario 10's helm-
    # axis probe. R6b's single-source fix (roles/mxl/defaults/main.yml)
    # made netbox_service_name/the app:<> tag/the monitoring
    # cluster_service+cluster_namespace all read l3_catalog_key/l3_release/
    # l3_target_namespace FIRST — the SAME play-scope vars
    # snapshot.yml:80's own pre-run NetBox lookup uses — falling back to
    # mxl_function_key/mxl_release/mxl_namespace only for a standalone,
    # non-L3-gated use of the role. Before R6b, a caller-supplied
    # mxl_function_key extra_var could retarget mxl's OWN NetBox mutation
    # (provision.yml's lookup-then-create) independently of what
    # snapshot.yml's pre-run baseline looked up by, breaking rollback for
    # mxl (the snapshot's baseline and the actual mutated record would be
    # two different NetBox objects). This scenario forges mxl_function_key
    # via extra_vars to a DIFFERENT value than l3_catalog_key and proves,
    # via stub_netbox_api.py's new L3_STUB_NETBOX_LOG request capture,
    # that EVERY ipam.services request this run makes — snapshot.yml's own
    # lookup AND mxl's provision.yml's own lookup-then-create — uses the
    # SAME concrete record name (l3_catalog_key's value), never the forged
    # mxl_function_key.
    #
    # L3_STUB_NETBOX_LOG is set on the "start stubs" task's own
    # environment, NOT the later nested-playbook-run task's — the stub
    # server is a DETACHED child process spawned by start_stubs.py, so the
    # env var must be present when THAT process is spawned (it inherits
    # its parent's environment once, at spawn time) for
    # stub_netbox_api.py's own os.environ.get() to see it for the whole
    # server lifetime; setting it only on the later nested-playbook task
    # would have no effect on the already-running, separate server
    # process.
