            _pe4_netbox_url: "{{ _pe4_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(4) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
