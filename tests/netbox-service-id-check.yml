---
# The NetBox service id check in the launcher stage files, run against the stub NetBox.
#
# nmos-cpp and nmos-crosspoint each assert, in configure.yml and finalise.yml, that
# the NetBox service they found has an id. The stage's `set_fact` renders that id from
# the NetBox JSON, where it is an integer. Under ansible-core 2.15 the rendered value
# is a string, and under 2.21 and later it stays an integer, so a check that treats it as text
# (`| length`) passes on the one and fails on the other. This test runs the four real
# stage task files through include_role with an integer id from the stub and requires
# each to finish and to flip the lifecycle tag.
#
# MUST FAIL on ansible-core 2.21 or later when any of the four stage files applies `length` to
# the id ("object of type '_AnsibleTaggedInt' has no len()").
#
# Needs only python3 for the stub. Run:  ansible-playbook tests/netbox-service-id-check.yml

- name: NetBox service id check, four real stage files against the stub
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    l3_harness_dir: "{{ playbook_dir }}/harness"
    _cases:
      - {role: nmos-cpp, stage: configure, service: nmos-cpp, start: "lifecycle:bootstrapped", end: "lifecycle:active"}
      - {role: nmos-cpp, stage: finalise, service: nmos-cpp, start: "lifecycle:active", end: "lifecycle:bootstrapped"}
      - {role: nmos-crosspoint, stage: configure, service: nmos-crosspoint, start: "lifecycle:bootstrapped", end: "lifecycle:active"}
      - {role: nmos-crosspoint, stage: finalise, service: nmos-crosspoint, start: "lifecycle:active", end: "lifecycle:bootstrapped"}

  tasks:
    - name: Run the four stage files
      block:
        - name: Start the stubs
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-netbox-id-check.json]
          register: _start
          changed_when: false

        - name: Point the stage files at the NetBox stub
          ansible.builtin.set_fact:
            netbox_api_url: "{{ _start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"
            netbox_api_token: fake-netbox-token

        - name: Run each case
          ansible.builtin.include_tasks: _netbox-service-id-case.yml
          loop: "{{ _cases }}"
          loop_control:
            loop_var: case
            label: "{{ case.role }} {{ case.stage }}"

        - name: ALL FOUR NETBOX SERVICE ID CHECKS PASSED
          ansible.builtin.debug:
            msg: >-
              Each of the four stage files accepted an integer NetBox service id
              and flipped the lifecycle tag.
      always:
        - name: Stop the stubs
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-netbox-id-check.json]
          changed_when: false
          failed_when: false
