    # ════════════════════════════════════════════════════════════════════
    # Scenario 5: HAPPY validation + derivation path — valid topology_params
    # AND exactly one AGREEING NetBox site. Proves the run passes
    # topology_validate.yml cleanly (l3_release_group derived, no topology
    # marker) and proceeds all the way to lock acquisition, where the
    # EXISTING post-lock fault (the same mechanism
    # tests/l3-playbook-execution.yml's own scenarios use) stops it before
    # any real `helm pull`/`helm template` would be needed.
    # ════════════════════════════════════════════════════════════════════
    - name: "(5) valid topology_params + agreeing NetBox site, fault at post-lock — proves the happy path reaches lock"
      vars:
        _te5_run_id: "55555555555555555555555555555555"
      block:
        - name: "(5) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-5.json]
