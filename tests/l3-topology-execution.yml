        - name: "(5) ASSERT: the REAL playbook run FAILED (the post-lock fault, NOT a topology refusal)"
          ansible.builtin.assert:
            that:
              - _te5_run.rc != 0
            fail_msg: "(5) FAIL — exited 0. stdout={{ _te5_run.stdout }}"

        - name: "(5) ASSERT: l3_release_group was actually derived with the
            REAL shipping names (umbrella #201 WP3 fix-round D5 — this run
            supplies l3_release=mxl-videotest-view, the ratified viewer JT
