    # ════════════════════════════════════════════════════════════════════
    # Scenario 6 (finding 7 coverage): the group CAPACITY loop-and-sum
    # actually renders every release. Reaches PAST the gate (capacity.yml's
    # own `helm pull`+`helm template`), so needs the `helm` PATH shim
    # (same mechanism as l3-playbook-execution.yml's own scenarios 8-11)
