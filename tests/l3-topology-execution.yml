        - name: "(7) seed the ONE agreeing NetBox site"
          ansible.builtin.uri:
            url: "{{ _te7_netbox_url }}/api/dcim/sites/"
            method: POST
            body_format: json
            body: { name: dmf-example-site, slug: dmf-example-site }
            status_code: [201]

        - name: "(7) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-te-7-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _te7_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
