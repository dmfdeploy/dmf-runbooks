    # post-first-mutation (fires AFTER capacity has fully run, but BEFORE
    # any topology group provision/install) stops the run cleanly without
    # needing a real Deployment-readiness wait.
    # ════════════════════════════════════════════════════════════════════
    - name: "(6) group capacity loop-and-sum — start fresh stubs, seed 1 agreeing site, run the REAL playbook with the helm PATH shim"
      vars:
        _te6_run_id: "66666666666666666666666666666666"
      block:
        - name: "(6) stop any stale stub servers"
