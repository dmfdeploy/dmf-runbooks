              - -e
              - mxl_role=view
              - -e
              - l3_release=mxl-videotest-view
              - -e
              - l3_catalog_key=mxl-videotest-view
              - -e
              - "{{ {'topology_params': _te_j1_topology_params} | to_json }}"
              - -e
              - l3_override=true
              - -e
              - "l3_override_reason=(6) capacity loop-and-sum probe - stub helm template always renders empty, expected"
              - -e
              - l3_fault_inject=post-first-mutation
              - -e
              - "l3_request_id={{ _te6_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-te-6-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
