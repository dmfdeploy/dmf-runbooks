        - name: "(6) seed the ONE agreeing NetBox site"
          ansible.builtin.uri:
            url: "{{ _te6_netbox_url }}/api/dcim/sites/"
            method: POST
            body_format: json
            body: { name: dmf-example-site, slug: dmf-example-site }
            status_code: [201]

        - name: "(6) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-te-6-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _te6_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(6) create the helm PATH shim dir"
          ansible.builtin.file:
