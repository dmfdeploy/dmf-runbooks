---
# umbrella #201 WP3 — REAL-playbook stubbed execution tests for
# topology_validate.yml. Same pattern as tests/l3-playbook-execution.yml
# (which this file complements, not replaces): each scenario starts a
# FRESH stub-server process, runs the REAL, unmodified
# playbooks/launch-mxl-fabrics-demo.yml as a nested `ansible-playbook`
# subprocess, and asserts on its real stdout + real HTTP against the
# stub K8s API.
#
# Unlike l3-playbook-execution.yml's own scenarios, NO l3_fault_inject is
# needed for the refusal scenarios below — topology_validate.yml's own
# refusals are DATA-driven (a malformed/missing topology_params, or a
# NetBox site that doesn't agree with target_facility), so simply
# supplying the bad data is enough to exercise the real refusal path.
# Scenario 5 is the exception: it proves the HAPPY validation+derivation
# path reaches lock acquisition by combining a VALID topology_params with
# the EXISTING post-lock fault mechanism (avoiding any need to stub a real
# `helm pull`/`helm template`, the same accepted limitation
# tests/harness/README.md documents for l3-playbook-execution.yml).
#
# Run:  ansible-playbook tests/l3-topology-execution.yml

- name: "Umbrella #201 WP3 — L3 topology_params real-playbook stubbed execution tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    l3_harness_dir: "{{ playbook_dir }}/harness"
    _te_j1_topology_params:
      schema_version: 1
      target_facility: dmf-example-site
      sources:
        - id: source-a
          flow_id: "5fbec3b1-1b0f-417d-9059-8b94a47197ed"
          pattern: smpte
        - id: source-b
          flow_id: "b0ae9cba-a989-4568-ac96-8bd19272c966"
          pattern: ball
      viewer:
        id: viewer-a
        source_selection: source-a

  tasks:
    # ════════════════════════════════════════════════════════════════════
    # Scenario 1: malformed topology_params (bad schema_version) -> refused
    # topology-invalid, BEFORE lock acquisition (no mutation, nothing to
    # release).
    # ════════════════════════════════════════════════════════════════════
    - name: "(1) malformed topology_params (schema_version=2) — start fresh stubs, run the REAL playbook"
      vars:
        _te1_run_id: "11111111111111111111111111111111"
        _te1_bad_topology_params: "{{ _te_j1_topology_params | combine({'schema_version': 2}) }}"
      block:
        - name: "(1) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-1.json]
          changed_when: false
          failed_when: false

        - name: "(1) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-te-1.json]
          register: _te1_start
          changed_when: false

        - name: "(1) parse stub URLs"
          ansible.builtin.set_fact:
            _te1_k8s_url: "{{ _te1_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _te1_netbox_url: "{{ _te1_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(1) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-te-1-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _te1_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(1) run the REAL playbooks/launch-mxl-fabrics-demo.yml as a nested ansible-playbook, mxl_role=view + malformed topology_params"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _te1_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _te1_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - mxl_role=view
              - -e
              - l3_release=mxl-videotest-view
              - -e
              - l3_catalog_key=mxl-videotest-view
              - -e
              - "{{ {'topology_params': _te1_bad_topology_params} | to_json }}"
              - -e
              - "l3_request_id={{ _te1_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-te-1-kubeconfig.yaml
          register: _te1_run
          changed_when: false
          failed_when: false

        - name: "(1) ASSERT: the REAL playbook run FAILED"
          ansible.builtin.assert:
            that:
              - _te1_run.rc != 0
            fail_msg: "(1) FAIL — exited 0 with a malformed topology_params. stdout={{ _te1_run.stdout }}"

        - name: "(1) ASSERT: exactly ONE DMF_L3_OUTCOME marker, preflight-error/topology-invalid"
          ansible.builtin.set_fact:
            _te1_markers: "{{ (_te1_run.stdout_lines | select('match', '.*DMF_L3_OUTCOME:.*') | list) }}"

        - name: "(1) assert marker-count + token + detail"
          ansible.builtin.assert:
            that:
              - _te1_markers | length == 1
              - "'preflight-error' in _te1_markers[0]"
              - "'topology-invalid' in _te1_markers[0]"
            fail_msg: "(1) FAIL — expected exactly one preflight-error/topology-invalid marker, got: {{ _te1_markers }}"

        - name: "(1) ASSERT (via real HTTP against the stub): the facility lock was NEVER created (pre-lock refusal — nothing to release)"
          ansible.builtin.uri:
            url: "{{ _te1_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false

        - name: "(1) ASSERT (via real HTTP against the stub): no run snapshot ConfigMap was ever created (no mutation at all)"
          ansible.builtin.uri:
            url: "{{ _te1_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-run-{{ _te1_run_id }}"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(1) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-1.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 2: umbrella #201 WP3 fix-round D1/D3 — topology_params
    # ABSENT on a view-role launch is now a fully legitimate SCALAR path
    # (there is no more "required" refusal at all, per D1's own fix — see
    # topology_validate.yml's header), so this scenario proves the
    # COMPLEMENT to scenario 5: a scalar (non-topology) view launch reaches
    # lock acquisition JUST AS CLEANLY, with topology_validate.yml a
    # complete no-op — no l3_release_group ever derived, no topology-*
    # marker detail, nothing in stdout naming a source release. Uses the
    # SAME post-lock fault mechanism as scenario 5 to avoid needing a real
    # helm chart (an earlier draft ran this WITHOUT fault injection and
    # discovered exactly why every other real-playbook scenario needs one:
    # without it, the run correctly proceeds past topology_validate.yml
    # and lock acquisition into snapshot.yml's own `helm list`, which has
    # no real Helm-release-as-Secret backing in this stub environment —
    # not a topology-mode defect, just the same accepted stubbing limit
    # tests/harness/README.md documents).
    # ════════════════════════════════════════════════════════════════════
    - name: "(2) topology_params absent on a view-role launch (scalar mode) — start fresh stubs, run the REAL playbook"
      vars:
        _te2_run_id: "22222222222222222222222222222222"
      block:
        - name: "(2) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-2.json]
          changed_when: false
          failed_when: false

        - name: "(2) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-te-2.json]
          register: _te2_start
          changed_when: false

        - name: "(2) parse stub URLs"
          ansible.builtin.set_fact:
            _te2_k8s_url: "{{ _te2_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _te2_netbox_url: "{{ _te2_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(2) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-te-2-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _te2_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(2) run the REAL playbook, mxl_role=view, NO topology_params
            extra_var, fault at post-lock (same mechanism as scenario 5 —
            see this scenario's own header)"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _te2_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _te2_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - mxl_role=view
              - -e
              - l3_release=mxl-videotest-view
              - -e
              - l3_catalog_key=mxl-videotest-view
              - -e
              - l3_fault_inject=post-lock
              - -e
              - "l3_request_id={{ _te2_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-te-2-kubeconfig.yaml
          register: _te2_run
          changed_when: false
          failed_when: false

        - name: "(2) ASSERT: the REAL playbook run FAILED (the post-lock fault, not a topology refusal)"
          ansible.builtin.assert:
            that:
              - _te2_run.rc != 0
            fail_msg: "(2) FAIL — exited 0. stdout={{ _te2_run.stdout }}"

        - name: "(2) ASSERT: topology_validate.yml never derived anything at
            all — no l3_release_group report line anywhere in stdout,
            proving it was a genuine no-op for this scalar launch, not a
            silently-swallowed derivation"
          ansible.builtin.assert:
            that:
              - "'derived l3_release_group' not in _te2_run.stdout"
            fail_msg: >-
              (2) FAIL — topology_validate.yml derived a release group for
              a launch with no topology_params at all. stdout={{ _te2_run.stdout }}

        - name: "(2) ASSERT: exactly ONE DMF_L3_OUTCOME marker, the STANDARD
            post-lock preflight-error (NOT a topology-* detail — this is
            the SAME shared post-lock boundary every other launcher's own
            scenario exercises, proving a topology-free scalar view launch
            is indistinguishable from any other non-topology launch up to
            this point)"
          ansible.builtin.set_fact:
            _te2_markers: "{{ (_te2_run.stdout_lines | select('match', '.*DMF_L3_OUTCOME:.*') | list) }}"

        - name: "(2) assert marker-count + token (no topology-* detail)"
          ansible.builtin.assert:
            that:
              - _te2_markers | length == 1
              - "'preflight-error' in _te2_markers[0]"
              - "'topology' not in _te2_markers[0]"
            fail_msg: "(2) FAIL — expected exactly one plain preflight-error marker, got: {{ _te2_markers }}"

        - name: "(2) ASSERT (via real HTTP against the stub): the facility lock
            was released (unconditional release on ANY post-lock failure —
            same property scenario 5 proves for the topology-mode case)"
          ansible.builtin.uri:
            url: "{{ _te2_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(2) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-2.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 3: valid topology_params, but the env's own NetBox has TWO
    # sites -> refused topology-facility-ambiguous (never GUESS a facility).
    # ════════════════════════════════════════════════════════════════════
    - name: "(3) NetBox facility ambiguous (2 sites) — start fresh stubs, seed 2 sites, run the REAL playbook"
      vars:
        _te3_run_id: "33333333333333333333333333333333"
      block:
        - name: "(3) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-3.json]
          changed_when: false
          failed_when: false

        - name: "(3) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-te-3.json]
          register: _te3_start
          changed_when: false

        - name: "(3) parse stub URLs"
          ansible.builtin.set_fact:
            _te3_k8s_url: "{{ _te3_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _te3_netbox_url: "{{ _te3_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(3) seed TWO NetBox sites"
          ansible.builtin.uri:
            url: "{{ _te3_netbox_url }}/api/dcim/sites/"
            method: POST
            body_format: json
            body: { name: "{{ item }}", slug: "{{ item }}" }
            status_code: [201]
          loop:
            - dmf-example-site
            - dmf-other-site

        - name: "(3) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-te-3-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _te3_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(3) run the REAL playbook, mxl_role=view, VALID topology_params, 2 NetBox sites"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _te3_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _te3_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - mxl_role=view
              - -e
              - l3_release=mxl-videotest-view
              - -e
              - l3_catalog_key=mxl-videotest-view
              - -e
              - "{{ {'topology_params': _te_j1_topology_params} | to_json }}"
              - -e
              - "l3_request_id={{ _te3_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-te-3-kubeconfig.yaml
          register: _te3_run
          changed_when: false
          failed_when: false

        - name: "(3) ASSERT: the REAL playbook run FAILED"
          ansible.builtin.assert:
            that:
              - _te3_run.rc != 0
            fail_msg: "(3) FAIL — exited 0 with 2 ambiguous NetBox sites. stdout={{ _te3_run.stdout }}"

        - name: "(3) ASSERT: exactly ONE DMF_L3_OUTCOME marker, preflight-error/topology-facility-ambiguous"
          ansible.builtin.set_fact:
            _te3_markers: "{{ (_te3_run.stdout_lines | select('match', '.*DMF_L3_OUTCOME:.*') | list) }}"

        - name: "(3) assert marker-count + token + detail"
          ansible.builtin.assert:
            that:
              - _te3_markers | length == 1
              - "'preflight-error' in _te3_markers[0]"
              - "'topology-facility-ambiguous' in _te3_markers[0]"
            fail_msg: "(3) FAIL — expected exactly one preflight-error/topology-facility-ambiguous marker, got: {{ _te3_markers }}"

        - name: "(3) ASSERT (via real HTTP against the stub): the facility lock was NEVER created"
          ansible.builtin.uri:
            url: "{{ _te3_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(3) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-3.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 4: valid topology_params, exactly ONE NetBox site, but it
    # does NOT match topology_params.target_facility -> refused
    # topology-facility-mismatch.
    # ════════════════════════════════════════════════════════════════════
    - name: "(4) NetBox facility mismatch — start fresh stubs, seed 1 disagreeing site, run the REAL playbook"
      vars:
        _te4_run_id: "44444444444444444444444444444444"
      block:
        - name: "(4) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-4.json]
          changed_when: false
          failed_when: false

        - name: "(4) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-te-4.json]
          register: _te4_start
          changed_when: false

        - name: "(4) parse stub URLs"
          ansible.builtin.set_fact:
            _te4_k8s_url: "{{ _te4_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _te4_netbox_url: "{{ _te4_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(4) seed ONE NetBox site with a DIFFERENT slug than topology_params.target_facility"
          ansible.builtin.uri:
            url: "{{ _te4_netbox_url }}/api/dcim/sites/"
            method: POST
            body_format: json
            body: { name: dmf-wrong-site, slug: dmf-wrong-site }
            status_code: [201]

        - name: "(4) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-te-4-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _te4_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(4) run the REAL playbook, mxl_role=view, VALID topology_params (target_facility=dmf-example-site), NetBox site=dmf-wrong-site"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _te4_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _te4_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - mxl_role=view
              - -e
              - l3_release=mxl-videotest-view
              - -e
              - l3_catalog_key=mxl-videotest-view
              - -e
              - "{{ {'topology_params': _te_j1_topology_params} | to_json }}"
              - -e
              - "l3_request_id={{ _te4_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-te-4-kubeconfig.yaml
          register: _te4_run
          changed_when: false
          failed_when: false

        - name: "(4) ASSERT: the REAL playbook run FAILED"
          ansible.builtin.assert:
            that:
              - _te4_run.rc != 0
            fail_msg: "(4) FAIL — exited 0 with a mismatched NetBox site. stdout={{ _te4_run.stdout }}"

        - name: "(4) ASSERT: exactly ONE DMF_L3_OUTCOME marker, preflight-error/topology-facility-mismatch"
          ansible.builtin.set_fact:
            _te4_markers: "{{ (_te4_run.stdout_lines | select('match', '.*DMF_L3_OUTCOME:.*') | list) }}"

        - name: "(4) assert marker-count + token + detail"
          ansible.builtin.assert:
            that:
              - _te4_markers | length == 1
              - "'preflight-error' in _te4_markers[0]"
              - "'topology-facility-mismatch' in _te4_markers[0]"
            fail_msg: "(4) FAIL — expected exactly one preflight-error/topology-facility-mismatch marker, got: {{ _te4_markers }}"

        - name: "(4) ASSERT (via real HTTP against the stub): the facility lock was NEVER created"
          ansible.builtin.uri:
            url: "{{ _te4_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(4) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-4.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 5: HAPPY validation + derivation path — valid topology_params
    # AND exactly one AGREEING NetBox site. Proves the run passes
    # topology_validate.yml cleanly (l3_release_group derived, no topology
    # marker) and proceeds all the way to lock acquisition, where the
    # EXISTING post-lock fault (the same mechanism
    # tests/l3-playbook-execution.yml's own scenarios use) stops it before
    # any real `helm pull`/`helm template` would be needed.
    # ════════════════════════════════════════════════════════════════════
    - name: "(5) valid topology_params + agreeing NetBox site, fault at post-lock — proves the happy path reaches lock"
      vars:
