        - name: "(7) ASSERT: rollback's own NetBox lookup queried ALL THREE
            recovered topology service names (proves
            _l3_snapshot_topology_service_names correctly recovered the N+1
            name list from the snapshot, not just the scalar catalog key)"
          ansible.builtin.assert:
            that:
              - "'GET services name=mxl-videotest-view' in (_te7_netbox_log_raw.content | b64decode)"
              - "'GET services name=mxl-videotest-view-source-a' in (_te7_netbox_log_raw.content | b64decode)"
              - "'GET services name=mxl-videotest-view-source-b' in (_te7_netbox_log_raw.content | b64decode)"
            fail_msg: >-
              (7) FAIL — expected rollback's own NetBox lookup to query all
              three topology service names. Got:
              {{ _te7_netbox_log_raw.content | b64decode }}

        - name: "(7) ASSERT (via real HTTP against the stub): all THREE
            topology NetBox records are GONE (finalised + deleted as
            run-created — none of them were in the pre-run snapshot, which
            was empty)"
          ansible.builtin.uri:
            url: "{{ _te7_netbox_url }}/api/ipam/services/?name={{ item | urlencode }}"
            method: GET
            return_content: true
            validate_certs: false
          register: _te7_post_rollback_netbox
          loop:
            - mxl-videotest-view
            - mxl-videotest-view-source-a
            - mxl-videotest-view-source-b
          loop_control:
            label: "{{ item }}"

        - name: "(7) assert all three records are gone post-rollback"
          ansible.builtin.assert:
            that:
              - (item.json.results | default([])) | length == 0
            fail_msg: "(7) FAIL — expected '{{ item.item }}' to be deleted by rollback, still got {{ item.json.results | default([]) }}"
          loop: "{{ _te7_post_rollback_netbox.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: "(7) ASSERT (via real HTTP against the stub): the coordinator's
            active-source key is REMOVED entirely (D4 — it was ABSENT
            pre-run, this run's own write must not survive a rollback)"
          ansible.builtin.uri:
            url: "{{ _te7_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: GET
            return_content: true
            validate_certs: false
          register: _te7_post_rollback_coordinator

        - name: "(7) assert post-rollback coordinator state"
          ansible.builtin.assert:
            that:
              - "'active-source' not in (_te7_post_rollback_coordinator.json.data | default({}))"
            fail_msg: >-
              (7) FAIL — expected active-source to be removed after
              rollback (it was absent pre-run), got
              {{ _te7_post_rollback_coordinator.json.data }}
      always:
        - name: "(7) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-7.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 8 (fix-round addendum, codex cross-WP FAIL): a SOURCE-role
    # launch carrying topology_params — the exact shape today's live
    # catalog wiring produces while topology_ref is still attached to the
    # source entry too (dmf-media#22, pending) — must refuse BEFORE lock
    # acquisition via l3_topology_forbidden_for_this_entry, never running
    # topology_validate.yml's own structural validation/derivation at all
    # (this is a coherence guard, not a further validation stage — it
    # fires first and refuses outright, regardless of whether the
    # topology_params object itself would otherwise be valid).
    # ════════════════════════════════════════════════════════════════════
    - name: "(8) source-role launch carrying topology_params — start fresh stubs, run the REAL playbook"
      vars:
        _te8_run_id: "88888888888888888888888888888888"
      block:
        - name: "(8) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-8.json]
          changed_when: false
          failed_when: false

        - name: "(8) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-te-8.json]
          register: _te8_start
          changed_when: false

        - name: "(8) parse stub URLs"
          ansible.builtin.set_fact:
            _te8_k8s_url: "{{ _te8_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _te8_netbox_url: "{{ _te8_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(8) seed the ONE agreeing NetBox site (irrelevant to the
            outcome — the coherence guard fires before the facility check
            even runs — seeded anyway so a regression that removed the
            guard would still exercise a realistic environment, not mask
            itself behind an unrelated facility refusal)"
          ansible.builtin.uri:
            url: "{{ _te8_netbox_url }}/api/dcim/sites/"
            method: POST
            body_format: json
            body: { name: dmf-example-site, slug: dmf-example-site }
            status_code: [201]

        - name: "(8) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-te-8-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _te8_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(8) run the REAL playbook, mxl_role=source (the source
            entry's own identity), VALID topology_params (would otherwise
            pass structural validation cleanly — proves the guard fires
            BEFORE any further topology processing, not as a side effect
            of the object being invalid)"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _te8_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _te8_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - mxl_role=source
              - -e
              - l3_release=mxl-videotestsrc
              - -e
              - l3_catalog_key=mxl-videotestsrc
              - -e
              - "{{ {'topology_params': _te_j1_topology_params} | to_json }}"
              - -e
              - "l3_request_id={{ _te8_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-te-8-kubeconfig.yaml
          register: _te8_run
          changed_when: false
          failed_when: false

        - name: "(8) ASSERT: the REAL playbook run FAILED"
          ansible.builtin.assert:
            that:
              - _te8_run.rc != 0
            fail_msg: "(8) FAIL — exited 0 with topology_params on a source-role launch. stdout={{ _te8_run.stdout }}"

        - name: "(8) ASSERT: no topology structural validation / derivation
            ever ran — the guard fires FIRST, before
            l3_validate_topology_params or l3_topology_release_group are
            ever reached"
          ansible.builtin.assert:
            that:
              - "'derived l3_release_group' not in _te8_run.stdout"
            fail_msg: >-
              (8) FAIL — topology derivation ran despite the source-entry
              coherence guard. stdout={{ _te8_run.stdout }}

        - name: "(8) ASSERT: exactly ONE DMF_L3_OUTCOME marker, preflight-error/topology-wrong-entry"
          ansible.builtin.set_fact:
            _te8_markers: "{{ (_te8_run.stdout_lines | select('match', '.*DMF_L3_OUTCOME:.*') | list) }}"

        - name: "(8) assert marker-count + token + detail"
          ansible.builtin.assert:
            that:
              - _te8_markers | length == 1
              - "'preflight-error' in _te8_markers[0]"
              - "'topology-wrong-entry' in _te8_markers[0]"
            fail_msg: "(8) FAIL — expected exactly one preflight-error/topology-wrong-entry marker, got: {{ _te8_markers }}"

        - name: "(8) ASSERT (via real HTTP against the stub): the facility
            lock was NEVER created (pre-lock refusal — nothing to release)"
          ansible.builtin.uri:
            url: "{{ _te8_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false

        - name: "(8) ASSERT (via real HTTP against the stub): no run
            snapshot ConfigMap was ever created (no mutation at all)"
          ansible.builtin.uri:
            url: "{{ _te8_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-run-{{ _te8_run_id }}"
            method: GET
            status_code: [404]
            validate_certs: false

        - name: "(8) ASSERT (via real HTTP against the stub): no NetBox
            record was created for the source entry either (no group
            provision, no scalar provision — the guard fires well before
            the playbook's own mxl role provision task is ever reached)"
          ansible.builtin.uri:
            url: "{{ _te8_netbox_url }}/api/ipam/services/?name=mxl-videotestsrc"
            method: GET
            return_content: true
            validate_certs: false
          register: _te8_netbox_check

        - name: "(8) assert no NetBox record exists"
          ansible.builtin.assert:
            that:
              - (_te8_netbox_check.json.results | default([])) | length == 0
            fail_msg: "(8) FAIL — expected no NetBox record, got {{ _te8_netbox_check.json.results }}"
      always:
        - name: "(8) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-8.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 9 (umbrella #201 WP3b): teardown-mxl-fabrics-demo.yml becomes
    # topology-aware — tearing down a topology-launched viewer must also
    # remove its N source Helm releases + reset their NetBox records, not
    # just its own scalar release (the pre-WP3b orphaning bug). stub_helm.sh
    # is STATELESS across upgrade/uninstall calls (it just answers `helm
    # list` from a fixed L3_STUB_HELM_LIST_MXL env var, see its own header),
    # so this seeds the "already-launched" state directly (3 NetBox
    # services + the coordinator's active-source + the helm-list fixture)
    # rather than round-tripping through a real launch first — leaner, and
    # this scenario's own subject is teardown's discovery/removal logic,
    # not launch (already covered by scenario 7).
    # ════════════════════════════════════════════════════════════════════
    - name: "(9) topology-aware teardown — start fresh stubs, seed an already-launched 2-source topology, run the REAL teardown playbook"
      vars:
        _te9_run_id: "99999999999999999999999999999999"
      block:
        - name: "(9) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-9.json]
          changed_when: false
          failed_when: false

        - name: "(9) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-te-9.json]
          register: _te9_start
          changed_when: false

        - name: "(9) parse stub URLs"
          ansible.builtin.set_fact:
            _te9_k8s_url: "{{ _te9_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _te9_netbox_url: "{{ _te9_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(9) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-te-9-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _te9_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(9) seed the 3 already-launched NetBox services (viewer + 2 topology sources), all lifecycle:active"
          ansible.builtin.uri:
            url: "{{ _te9_netbox_url }}/api/ipam/services/"
            method: POST
            body_format: json
            body:
              name: "{{ item }}"
              tags:
                - { name: "dmf-catalog" }
                - { name: "app:{{ item }}" }
                - { name: "lifecycle:active" }
              custom_fields:
                cluster_service: "{{ item }}"
                cluster_namespace: mxl
                cluster_port: 9000
            status_code: [201]
          loop:
            - mxl-videotest-view
            - mxl-videotest-view-source-a
            - mxl-videotest-view-source-b
          loop_control:
            label: "{{ item }}"

        - name: "(9) seed the coordinator ConfigMap with a live active-source (this run's own switch/launch history — irrelevant to teardown, which never reads it)"
          ansible.builtin.uri:
            url: "{{ _te9_k8s_url }}/api/v1/namespaces/mxl/configmaps/"
            method: POST
            body_format: json
            body:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: mxl }
              data: { active-source: source-a }
            status_code: [201]

        - name: "(9) create the helm PATH shim dir"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin
            state: directory

        - name: "(9) symlink helm -> stub_helm.sh"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin/helm
            src: "{{ l3_harness_dir }}/stub_helm.sh"
            state: link
            force: true

        - name: "(9) run the REAL teardown-mxl-fabrics-demo.yml as a nested
            ansible-playbook, helm list fixtured to the 3 already-launched
            releases (viewer + 2 topology sources) via L3_STUB_HELM_LIST_MXL"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/teardown-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _te9_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _te9_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - mxl_release=mxl-videotest-view
              - -e
              - "l3_request_id={{ _te9_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-te-9-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LIST_MXL: >-
              [{"name": "mxl-videotest-view"}, {"name": "mxl-videotest-view-source-a"}, {"name": "mxl-videotest-view-source-b"}]
            L3_STUB_HELM_LOG: /tmp/l3-te-9-helm.log
          register: _te9_teardown_run
          changed_when: false
          failed_when: false

        - name: "(9) ASSERT: the REAL teardown run SUCCEEDED"
          ansible.builtin.assert:
            that:
              - _te9_teardown_run.rc == 0
            fail_msg: "(9) FAIL — teardown exited non-zero. stdout={{ _te9_teardown_run.stdout }}"

        - name: "(9) read the helm invocation log"
          ansible.builtin.slurp:
            src: /tmp/l3-te-9-helm.log
          register: _te9_helm_log_raw

        - name: "(9) ASSERT: helm uninstall ran for the viewer AND both topology source releases (the pre-WP3b bug: only the viewer would appear)"
          ansible.builtin.assert:
            that:
              - "'uninstall mxl-videotest-view -n mxl' in (_te9_helm_log_raw.content | b64decode)"
              - "'uninstall mxl-videotest-view-source-a -n mxl' in (_te9_helm_log_raw.content | b64decode)"
              - "'uninstall mxl-videotest-view-source-b -n mxl' in (_te9_helm_log_raw.content | b64decode)"
            fail_msg: >-
              (9) FAIL — expected helm uninstall for all three releases. Got:
              {{ _te9_helm_log_raw.content | b64decode }}

        - name: "(9) ASSERT (via real HTTP against the stub): all three NetBox
            records are reset to lifecycle:bootstrapped (finalise ran for
            the viewer AND both topology sources — mirrors the scalar
            teardown's own semantics, a reset not a delete)"
          ansible.builtin.uri:
            url: "{{ _te9_netbox_url }}/api/ipam/services/?name={{ item | urlencode }}"
            method: GET
            return_content: true
            validate_certs: false
          register: _te9_post_teardown_netbox
          loop:
            - mxl-videotest-view
            - mxl-videotest-view-source-a
            - mxl-videotest-view-source-b
          loop_control:
            label: "{{ item }}"

        - name: "(9) assert all three records are reset to bootstrapped"
          ansible.builtin.assert:
            that:
              - (item.json.results | default([])) | length == 1
              - "'lifecycle:bootstrapped' in (item.json.results[0].tags | map(attribute='name') | list)"
              - "'lifecycle:active' not in (item.json.results[0].tags | map(attribute='name') | list)"
            fail_msg: "(9) FAIL — expected '{{ item.item }}' reset to lifecycle:bootstrapped, got {{ item.json.results }}"
          loop: "{{ _te9_post_teardown_netbox.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: "(9) ASSERT (via real HTTP against the stub): the shared
            mxl-coordinator ConfigMap was removed (all three mxl-* releases
            were torn down — none left, so _mxl_other_releases correctly
            saw zero even though it must now also exclude the two topology
            source releases it JUST discovered, not only the viewer)"
          ansible.builtin.uri:
            url: "{{ _te9_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(9) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-9.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 10 (umbrella #296): the pulled capacity chart must SURVIVE
    # until the topology group-render loop has finished. capacity.yml's
    # chart block used to run its `always:` cleanup (rm -rf the pulled
    # tempdir) BEFORE the group loop, which reuses the very same
    # _l3_chart_render_path — invisible on every scalar launch (empty
    # l3_release_group = no-op loop), fatal on every topology one (live AWX
    # job 288: `Error: path "/tmp/ansible.XXXl3-capacity-chart/
    # mxl-fabrics-demo" not found`).
    #
    # This scenario differs from scenario 6 in the ONE way that matters:
    # scenario 6 asserts the group `helm template` calls were ATTEMPTED
    # (via L3_STUB_HELM_LOG, which stub_helm.sh writes before dispatch, so
    # a FAILING render is logged identically to a passing one). Here the
    # subject is that they SUCCEEDED — proved by the run reaching the
    # post-capacity fault boundary, which is strictly after the whole
    # capacity stage, and by the absence of helm's own path-not-found
    # signature anywhere in stdout.
    #
    # It only discriminates because stub_helm.sh now models real helm's
    # chart-path contract (`pull` creates <untardir>/<chart-name>/,
    # `template` fails closed on a missing path) — with the old
    # path-blind stub this scenario would pass on the BROKEN capacity.yml
    # too. Do not relax either stub case (see stub_helm.sh's header).
    #
    # l3_override=true for the same reason scenario 6 needs it: the stub
    # renders an empty manifest, a genuine missing-budget refusal.
    # ════════════════════════════════════════════════════════════════════
    - name: "(10) capacity chart survives the group render (#296) — start fresh stubs, seed 1 agreeing site, run the REAL playbook with the helm PATH shim"
      vars:
        _te10_run_id: "10101010101010101010101010101010"
      block:
        - name: "(10) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-10.json]
          changed_when: false
          failed_when: false

        - name: "(10) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-te-10.json]
          register: _te10_start
          changed_when: false

        - name: "(10) parse stub URLs"
          ansible.builtin.set_fact:
            _te10_k8s_url: "{{ _te10_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _te10_netbox_url: "{{ _te10_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(10) seed the ONE agreeing NetBox site"
          ansible.builtin.uri:
            url: "{{ _te10_netbox_url }}/api/dcim/sites/"
            method: POST
            body_format: json
            body: { name: dmf-example-site, slug: dmf-example-site }
            status_code: [201]

        - name: "(10) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-te-10-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _te10_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(10) create the helm PATH shim dir"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin
            state: directory

        - name: "(10) symlink helm -> stub_helm.sh"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin/helm
            src: "{{ l3_harness_dir }}/stub_helm.sh"
            state: link
            force: true

        - name: "(10) remove any stale helm invocation log from a prior run"
          ansible.builtin.file:
            path: /tmp/l3-te-10-helm.log
            state: absent

        - name: "(10) run the REAL playbook, mxl_role=view, VALID topology_params,
            agreeing NetBox site, l3_override for the stub's empty-render,
            fault at post-capacity (the FIRST boundary strictly after the
            whole capacity stage — chart pull, scalar render, group render
            loop, cleanup, budget/fit — and still before any mutation)"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/launch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _te10_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _te10_netbox_url }}"
              - -e
              - netbox_api_token=fake-netbox-token
              - -e
              - mxl_role=view
              - -e
              - l3_release=mxl-videotest-view
              - -e
              - l3_catalog_key=mxl-videotest-view
              - -e
              - "{{ {'topology_params': _te_j1_topology_params} | to_json }}"
              - -e
              - l3_override=true
              - -e
              - "l3_override_reason=(10) #296 chart-survival probe - stub helm template always renders empty, expected"
              - -e
              - l3_fault_inject=post-capacity
              - -e
              - "l3_request_id={{ _te10_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-te-10-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-te-10-helm.log
          register: _te10_run
          changed_when: false
          failed_when: false

        - name: "(10) ASSERT: helm's own path-not-found error appears NOWHERE in
            the run — THE #296 regression signature. On the unfixed
            capacity.yml this is the first assertion to blow, quoting the
            exact stderr the live AWX job 288 failed with"
          ansible.builtin.assert:
            that:
              - "'Error: path' not in _te10_run.stdout"
              # Quoted in full: an unquoted plain scalar containing ": "
              # is a YAML mapping, not a string, and ansible-core rejects
              # a non-string conditional outright.
              - "_te10_run.stdout_lines | select('search', 'Error: path .* not found') | list | length == 0"
            fail_msg: >-
              (10) FAIL — umbrella #296 regression: a capacity `helm
              template` was handed a chart path that no longer exists,
              i.e. the pulled chart tempdir was cleaned up before the
              topology group-render loop ran. stdout={{ _te10_run.stdout }}

        - name: "(10) ASSERT: the run reached the post-capacity fault boundary —
            the whole capacity stage (scalar render AND the group render
            loop AND cleanup AND the budget/fit evaluation) completed
            first. This is the positive form of the assertion above: on the
            unfixed capacity.yml the group render aborts the run before
            this boundary is ever reached"
          ansible.builtin.assert:
            that:
              - _te10_run.rc != 0
              - "\"L3_FAULT_INJECT: deliberately raised at boundary 'post-capacity'\" in _te10_run.stdout"
            fail_msg: >-
              (10) FAIL — expected the run to fail at the injected
              post-capacity boundary, proving capacity completed in full.
              rc={{ _te10_run.rc }} stdout={{ _te10_run.stdout }}

        - name: "(10) read the helm invocation log"
          ansible.builtin.slurp:
            src: /tmp/l3-te-10-helm.log
          register: _te10_helm_log_raw

        - name: "(10) parse helm invocation log lines"
          ansible.builtin.set_fact:
            _te10_helm_log_lines: "{{ (_te10_helm_log_raw.content | b64decode).splitlines() }}"

        - name: "(10) ASSERT: the chart was pulled, and `helm template` ran for
            the scalar viewer AND both topology group items"
          ansible.builtin.assert:
            that:
              - _te10_helm_log_lines | select('match', '^pull ') | list | length == 1
              - _te10_helm_log_lines | select('match', '^template mxl-videotest-view ') | list | length >= 1
              - _te10_helm_log_lines | select('match', '^template mxl-videotest-view-source-a ') | list | length >= 1
              - _te10_helm_log_lines | select('match', '^template mxl-videotest-view-source-b ') | list | length >= 1
            fail_msg: >-
              (10) FAIL — expected one `helm pull` and `helm template`
              calls for the scalar viewer AND both group items; got:
              {{ _te10_helm_log_lines }}

        - name: "(10) extract the chart path argv element of each capacity render
            (`template <release> <chart-path> -n <ns> ...`)"
          ansible.builtin.set_fact:
            _te10_scalar_path: "{{ (_te10_helm_log_lines | select('match', '^template mxl-videotest-view ') | first).split(' ')[2] }}"
            _te10_group_a_path: "{{ (_te10_helm_log_lines | select('match', '^template mxl-videotest-view-source-a ') | first).split(' ')[2] }}"
            _te10_group_b_path: "{{ (_te10_helm_log_lines | select('match', '^template mxl-videotest-view-source-b ') | first).split(' ')[2] }}"

        - name: "(10) ASSERT: every group item rendered from the SAME pulled
            tempdir the scalar render used (this is the exact resource
            whose lifetime #296 got wrong — a group render pointed
            anywhere else, or at a path outside the capacity tempdir,
            would mean the reuse contract itself had changed)"
          ansible.builtin.assert:
            that:
              - "'l3-capacity-chart' in _te10_scalar_path"
              - _te10_group_a_path == _te10_scalar_path
              - _te10_group_b_path == _te10_scalar_path
            fail_msg: >-
              (10) FAIL — expected all three capacity renders to share the
              one pulled chart path. scalar={{ _te10_scalar_path }}
              source-a={{ _te10_group_a_path }} source-b={{ _te10_group_b_path }}

        - name: "(10) ASSERT: exactly ONE DMF_L3_OUTCOME marker, preflight-error
            (post-capacity is still strictly PRE-mutation — l3_mutation_started
            is set by the playbook only after the whole gate returns)"
          ansible.builtin.set_fact:
            _te10_markers: "{{ (_te10_run.stdout_lines | select('match', '.*DMF_L3_OUTCOME:.*') | list) }}"

        - name: "(10) assert marker-count + token"
          ansible.builtin.assert:
            that:
              - _te10_markers | length == 1
              - "'preflight-error' in _te10_markers[0]"
            fail_msg: "(10) FAIL — expected exactly one preflight-error marker, got: {{ _te10_markers }}"

        - name: "(10) ASSERT: no helm upgrade/install ever ran (the gate refused
            before any mutation — capacity's own renders are the only helm
            calls a #296 regression could have been masked behind)"
          ansible.builtin.assert:
            that:
              - _te10_helm_log_lines | select('match', '^upgrade ') | list | length == 0
            fail_msg: >-
              (10) FAIL — an upgrade/install call was logged; the fault
              should have fired before any install. Got: {{ _te10_helm_log_lines }}

        - name: "(10) ASSERT (via real HTTP against the stub): the facility lock was released"
          ansible.builtin.uri:
            url: "{{ _te10_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false

        - name: "(10) ASSERT (via real HTTP against the stub): no NetBox record
            was created for the viewer or either source (pre-mutation refusal)"
          ansible.builtin.uri:
            url: "{{ _te10_netbox_url }}/api/ipam/services/?name={{ item | urlencode }}"
            method: GET
            return_content: true
            validate_certs: false
          register: _te10_netbox_check
          loop:
            - mxl-videotest-view
            - mxl-videotest-view-source-a
            - mxl-videotest-view-source-b
          loop_control:
            label: "{{ item }}"

        - name: "(10) assert no NetBox records exist"
          ansible.builtin.assert:
            that:
              - (item.json.results | default([])) | length == 0
            fail_msg: "(10) FAIL — expected no NetBox record for '{{ item.item }}', got {{ item.json.results | default([]) }}"
          loop: "{{ _te10_netbox_check.results }}"
          loop_control:
            label: "{{ item.item }}"
      always:
        - name: "(10) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-te-10.json]
          changed_when: false
          failed_when: false

    - name: ALL L3 TOPOLOGY EXECUTION TESTS PASSED
      ansible.builtin.debug:
        msg: >-
          umbrella #201 WP3 (fix-round D1-D5 + finding 7): the REAL,
          unmodified playbooks/launch-mxl-fabrics-demo.yml (and
          rollback-run.yml, scenario 7), run as real ansible-playbook
          subprocesses against the test harness stubs, correctly refuses
          BEFORE lock acquisition (facility lock confirmed 404 via real
          HTTP, no run snapshot ever created) for a malformed
          topology_params (scenario 1), an ambiguous NetBox facility
          (scenario 3), and a target_facility/NetBox-site mismatch
          (scenario 4) — each with exactly one honest, correctly detailed
          DMF_L3_OUTCOME marker. Scenarios 2 and 5 prove the complementary
          happy paths: scenario 2 — topology_params ABSENT on a view-role
          launch (D1/D3's fully legitimate scalar mode) — and scenario 5 —
          topology_params VALID with an AGREEING NetBox site, deriving
          l3_release_group with the REAL shipping names
          (mxl-videotest-view-source-a/-b, D5) — both reach lock
          acquisition cleanly and fail only at the SAME shared post-lock
          boundary every other launcher's own execution-test scenario
          uses, with scenario 2's own marker carrying NO topology-*
          detail at all — proving topology_validate.yml is a genuine,
          symmetric no-op for the scalar case and never blocks the
          topology-mode happy path either. Scenario 6 proves
          capacity.yml's group loop-and-sum actually renders every
          release (scalar viewer + both group items, via
          L3_STUB_HELM_LOG). Scenario 7 proves the full snapshot ->
          separate rollback-run.yml round-trip: all THREE topology NetBox
          records and the coordinator's own active-source write (both
          genuinely created/set by this run, not merely snapshotted) are
          correctly finalised+deleted / removed by a LATER, independent
          rollback invocation recovering the persisted
          topology_service_names + coordinator_state from the snapshot
          alone — this coverage caught two real, pre-existing defects
          along the way (fixed in the same fix round): the mxl role's
          per-item NetBox identity override needed a dedicated
          mxl_group_item_identity var (l3_catalog_key/l3_release
          themselves are extra-var-pinned for the whole play and cannot
          be overridden per loop iteration, R4a/P1-2's own lesson
          generalized); and rollback_netbox_surface.yml's bare
          `include_role: netbox_catalog_common` needed `public: true` —
          without it, `_netbox_owned_namespace` never escaped that
          include's own scope, so EVERY prior rollback of a genuinely
          run-created NetBox record (any launcher, not just topology
          mode) silently failed to finalise+delete it, undetected until
          this scenario was the first test in this codebase to actually
          reach that code path with a real record. Scenario 8
          (fix-round addendum, codex cross-WP FAIL): a source-role
          launch carrying topology_params — today's live shape while
          dmf-media#22's catalog cleanup is still pending — refuses via
          l3_topology_forbidden_for_this_entry BEFORE lock acquisition,
          with NO topology derivation, NO NetBox record, and NO lock
          ever created, even though the topology_params object itself
          would otherwise validate cleanly. Scenario 10 (umbrella #296)
          proves the capacity gate's pulled chart tempdir SURVIVES until
          the group-render loop has finished: all three renders share the
          one pulled path, helm's own `Error: path ... not found` appears
          nowhere, and the run reaches the post-capacity fault boundary —
          i.e. the whole capacity stage completed. Where scenario 6
          asserts the group renders were ATTEMPTED (the stub logs argv
          before dispatch, so a failing render logs identically), this one
          asserts they SUCCEEDED — the distinction that let every live
          topology launch fail in the gate while CI stayed green, until
          stub_helm.sh was taught real helm's chart-path contract.
