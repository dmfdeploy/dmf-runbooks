        - name: "(6) parse helm invocation log lines"
          ansible.builtin.set_fact:
            _te6_helm_log_lines: "{{ (_te6_helm_log_raw.content | b64decode).splitlines() }}"

        - name: "(6) ASSERT: capacity.yml rendered ALL THREE releases — the
