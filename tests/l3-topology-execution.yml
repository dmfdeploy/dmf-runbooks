              - "'topology' not in _te5_markers[0]"
            fail_msg: "(5) FAIL — expected exactly one plain preflight-error marker, got: {{ _te5_markers }}"

        - name: "(5) ASSERT (via real HTTP against the stub): the facility lock was released (unconditional release on ANY post-lock failure)"
