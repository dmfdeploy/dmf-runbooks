              custom_fields: {}
            status_code: [201]
          register: _fpe10_seed

        - name: "(10) run the REAL finalise-purge playbook — workload_slug=demo-h (the console's own stale preflight), expected id = the now-retagged service"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/finalise-purge.yml"
