                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(12) run the REAL finalise-purge playbook — purge_actor supplied as a native JSON int, codex's exact probe"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/finalise-purge.yml"
              - -e
              - "l3_kube_api_url={{ _fpe12_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _fpe12_netbox_url }}"
              - -e
              - vault_netbox_purge_token=fake-netbox-token
              - -e
              - workload_slug=demo-quartet-2
              - -e
              - '{"purge_expected_service_ids": []}'
              - -e
              - '{"purge_actor": 123}'
              - -e
              - purge_role=test-role
              - -e
              - "purge_reason=P2-2 int actor pin"
              - -e
              - l3_request_id=12121212121212121212121212121212
            chdir: "{{ playbook_dir }}/.."
          environment:
            KUBECONFIG: /tmp/l3-fpe-12-kubeconfig.yaml
          register: _fpe12_run
          changed_when: false
          failed_when: false

        - name: "(12) ASSERT: refused, detail=preflight — a non-string purge_actor is never silently coerced (P2-2)"
          ansible.builtin.assert:
            that:
              - _fpe12_run.rc != 0
              - "'DMF_L3_PURGE_OUTCOME: refused' in _fpe12_run.stdout"
