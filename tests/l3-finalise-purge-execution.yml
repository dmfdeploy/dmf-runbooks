    # ════════════════════════════════════════════════════════════════════
    # Scenario 11 (umbrella #347 fix round FIX-A2b.1, P2-1) — pagination.
    # $L3_STUB_NETBOX_PAGE_SIZE forces a 2-record page size regardless of
    # this launcher's own ?limit=500 request, so a handful of seeded
    # fixture records genuinely spans multiple pages.
    #   (11a) a bad-lifecycle member on the LAST page (page 3 of 3) must
    #         still be caught — proves the fail-closed validation sees
    #         late pages, not just the first.
    #   (11b) a clean multi-page purge succeeds, AND the final source read
    #         (which also paginates) correctly walks multiple pages of
    #         UNRELATED dmf-catalog residue afterwards without mistaking
    #         it for this workload's own leftovers.
    # ════════════════════════════════════════════════════════════════════
    - name: "(11) pagination — start fresh stubs with a forced small page size"
      block:
        - name: "(11) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-fpe-11.json]
          changed_when: false
          failed_when: false

        - name: "(11) start stubs (L3_STUB_NETBOX_PAGE_SIZE=2 — the detached stub process inherits this at spawn time)"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-fpe-11.json]
          register: _fpe11_start
          changed_when: false
          environment:
            L3_STUB_NETBOX_PAGE_SIZE: "2"

        - name: "(11) parse stub URLs"
          ansible.builtin.set_fact:
            _fpe11_k8s_url: "{{ _fpe11_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _fpe11_netbox_url: "{{ _fpe11_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(11) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-fpe-11-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _fpe11_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(11a) seed 5 workload:demo-page-a members — 4 clean, the 5th (deterministically LAST at page size 2 -> page 3) carries a bad lifecycle tag"
          ansible.builtin.uri:
            url: "{{ _fpe11_netbox_url }}/api/ipam/services/"
            method: POST
            body_format: json
            body:
              name: "mxl-demo-page-a-{{ item }}"
              tags:
                - {name: "dmf-catalog"}
                - {name: "app:mxl"}
                - {name: "{{ 'lifecycle:configured' if item == 5 else 'lifecycle:bootstrapped' }}"}
                - {name: "workload:demo-page-a"}
              custom_fields: {}
            status_code: [201]
          loop: [1, 2, 3, 4, 5]
          register: _fpe11a_seed

        - name: "(11a) run the REAL finalise-purge playbook — spans 3 pages at page size 2"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/finalise-purge.yml"
              - -e
              - "l3_kube_api_url={{ _fpe11_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _fpe11_netbox_url }}"
              - -e
              - vault_netbox_purge_token=fake-netbox-token
              - -e
              - workload_slug=demo-page-a
              - -e
              - "{{ {'purge_expected_service_ids': _fpe11a_seed.results | map(attribute='json') | map(attribute='id') | list} | to_json }}"
              - -e
              - purge_actor=test-actor
              - -e
              - purge_role=test-role
              - -e
              - "purge_reason=pagination late-page violation"
              - -e
              - l3_request_id=11111111111111111111111111111a11
            chdir: "{{ playbook_dir }}/.."
          environment:
            KUBECONFIG: /tmp/l3-fpe-11-kubeconfig.yaml
          register: _fpe11a_run
          changed_when: false
          failed_when: false

        - name: "(11a) ASSERT: refused — the bad-lifecycle member on the LAST page was still validated"
          ansible.builtin.assert:
            that:
              - _fpe11a_run.rc != 0
              - "'DMF_L3_PURGE_OUTCOME: refused' in _fpe11a_run.stdout"
              - "'detail=member-purge' in _fpe11a_run.stdout"
            fail_msg: "(11a) FAIL — expected the last-page bad-lifecycle member to be caught. stdout={{ _fpe11a_run.stdout }}"

        - name: "(11a) ASSERT (real HTTP): all 5 members still present — zero deletes on a fail-closed refusal"
          ansible.builtin.uri:
            url: "{{ _fpe11_netbox_url }}/api/ipam/services/{{ item.json.id }}/"
            method: GET
            status_code: [200]
          loop: "{{ _fpe11a_seed.results }}"
          loop_control:
            label: "{{ item.json.id }}"

        - name: "(11b) seed 4 clean workload:demo-page-b members (2 pages) + the Tag"
          ansible.builtin.uri:
            url: "{{ _fpe11_netbox_url }}/api/ipam/services/"
            method: POST
            body_format: json
            body:
              name: "mxl-demo-page-b-{{ item }}"
              tags:
                - {name: "dmf-catalog"}
                - {name: "app:mxl"}
                - {name: "lifecycle:bootstrapped"}
                - {name: "workload:demo-page-b"}
              custom_fields: {}
            status_code: [201]
          loop: [1, 2, 3, 4]
          register: _fpe11b_seed

        - name: "(11b) seed the workload Tag object"
          ansible.builtin.uri:
            url: "{{ _fpe11_netbox_url }}/api/extras/tags/"
            method: POST
            body_format: json
            body:
              name: "workload:demo-page-b"
              slug: "workload-demo-page-b"
            status_code: [201]

        - name: "(11b) seed 3 UNRELATED dmf-catalog services (a different workload, never purged) — forces the FINAL source read to also span multiple pages after demo-page-b's own 4 are deleted"
          ansible.builtin.uri:
            url: "{{ _fpe11_netbox_url }}/api/ipam/services/"
            method: POST
            body_format: json
            body:
              name: "mxl-unrelated-{{ item }}"
              tags:
                - {name: "dmf-catalog"}
                - {name: "app:mxl"}
                - {name: "lifecycle:active"}
                - {name: "workload:demo-page-other"}
              custom_fields: {}
            status_code: [201]
          loop: [1, 2, 3]
          register: _fpe11b_unrelated_seed

        - name: "(11b) run the REAL finalise-purge playbook — clean multi-page purge, cross-workload isolation under pagination"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/finalise-purge.yml"
              - -e
              - "l3_kube_api_url={{ _fpe11_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _fpe11_netbox_url }}"
              - -e
              - vault_netbox_purge_token=fake-netbox-token
              - -e
              - workload_slug=demo-page-b
              - -e
              - "{{ {'purge_expected_service_ids': _fpe11b_seed.results | map(attribute='json') | map(attribute='id') | list} | to_json }}"
              - -e
              - purge_actor=test-actor
              - -e
              - purge_role=test-role
              - -e
              - "purge_reason=pagination clean multi-page"
              - -e
              - l3_request_id=11111111111111111111111111111b11
            chdir: "{{ playbook_dir }}/.."
          environment:
            KUBECONFIG: /tmp/l3-fpe-11-kubeconfig.yaml
          register: _fpe11b_run
          changed_when: false
          failed_when: false

        - name: "(11b) ASSERT: SUCCEEDED — the clean multi-page purge converged"
          ansible.builtin.assert:
            that:
              - _fpe11b_run.rc == 0
              - "'DMF_L3_PURGE_OUTCOME: success' in _fpe11b_run.stdout"
            fail_msg: "(11b) FAIL — expected the clean multi-page purge to succeed. rc={{ _fpe11b_run.rc }} stdout={{ _fpe11b_run.stdout }}"

        - name: "(11b) ASSERT (real HTTP): all 4 demo-page-b members are genuinely gone"
          ansible.builtin.uri:
            url: "{{ _fpe11_netbox_url }}/api/ipam/services/{{ item.json.id }}/"
            method: GET
            status_code: [404]
          loop: "{{ _fpe11b_seed.results }}"
          loop_control:
            label: "{{ item.json.id }}"

        - name: "(11b) ASSERT (real HTTP): all 3 unrelated services are STILL PRESENT, untouched — the final read's own pagination across 2 pages of residue never mistook them for this workload's leftovers"
          ansible.builtin.uri:
            url: "{{ _fpe11_netbox_url }}/api/ipam/services/{{ item.json.id }}/"
            method: GET
            status_code: [200]
          loop: "{{ _fpe11b_unrelated_seed.results }}"
          loop_control:
            label: "{{ item.json.id }}"
      always:
        - name: "(11) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-fpe-11.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 12 (umbrella #347 fix round FIX-A2b.1, P2-2) — PERMANENT PIN
    # of codex's own executed GATE-A2b.1 int-typed-actor probe: native JSON
    # `{"purge_actor": 123}` — Jinja's `trim` filter silently coerced the
    # int without the (now-added) `is string` check.
    # ════════════════════════════════════════════════════════════════════
    - name: "(12) PIN codex's P2-2 int-typed-actor probe — a non-string purge_actor must refuse, never coerce"
      block:
        - name: "(12) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-fpe-12.json]
