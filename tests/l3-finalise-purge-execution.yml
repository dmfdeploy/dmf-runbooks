      block:
        - name: "(10) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-fpe-10.json]
          changed_when: false
          failed_when: false

        - name: "(10) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-fpe-10.json]
          register: _fpe10_start
          changed_when: false

        - name: "(10) parse stub URLs"
          ansible.builtin.set_fact:
            _fpe10_k8s_url: "{{ _fpe10_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _fpe10_netbox_url: "{{ _fpe10_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(10) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-fpe-10-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _fpe10_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(10) seed a service ALREADY retagged to a DIFFERENT workload (codex's own probe: the console's preflight named it for demo-h, it now belongs to other-workload)"
          ansible.builtin.uri:
            url: "{{ _fpe10_netbox_url }}/api/ipam/services/"
            method: POST
            body_format: json
