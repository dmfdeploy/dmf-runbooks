            # (reset_state's own _default_state, _services_next_id: 1), so
            # the FIRST service this scenario seeds is deterministically id
            # 1 — sticky-marking it ahead of seeding is safe.
            L3_STUB_NETBOX_STICKY_SERVICE_IDS: "1"

        - name: "(7) parse stub URLs"
