              - (_fpe8_tag_check.json.results | default(['nonempty'])) | length == 0
            fail_msg: "(8) FAIL — the workload Tag is still present after the converging re-run: {{ _fpe8_tag_check.json }}"
      always:
        - name: "(8) NOW stop scenario (6)/(8)'s shared stub instance"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-fpe-6.json]
          changed_when: false
          failed_when: false

        - name: "(8) also clean up scenario (7)'s throwaway probe pidfile, belt-and-suspenders"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-fpe-7-probe.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 9 (umbrella #347 fix round FIX-A2b.1, P1-1) — PERMANENT PIN
    # of codex's own executed GATE-A2b.1 forge probe: an otherwise-legitimate
