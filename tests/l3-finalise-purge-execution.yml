          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 13 (fix round FIX-A2b.3, operator review 2026-08-03; var
    # updated for ADR-0032 Amendment 3, 2026-08-14): the DECLARED
    # JT-contract invocation with the scoped delete-only purge token BLANK.
    # Every OTHER scenario above now passes ONLY vault_netbox_purge_token
    # (the frozen JT contract's own static var, never netbox_api_token
    # directly — see this playbook's own play-level `vars:` mapping, and
    # its header comment for the full story). This scenario proves the
    # mapping's OWN fail-closed edge: an absent/blank scoped token must
    # refuse structurally, pre-lock, before any NetBox call — never proceed
    # with an empty Authorization header. Discriminates a mutant that maps
    # netbox_api_token with a fallback to some non-empty default (defeating
    # _assert_netbox_token.yml's own ADR-0032 "no silent credential
    # upgrade" check) or that maps it only SOMETIMES (e.g. as a role
    # default instead of a play var, which this exact fix round proved does
    # not reach netbox_catalog_common's own later include).
    # ════════════════════════════════════════════════════════════════════
    - name: "(13) blank vault_netbox_purge_token refuses pre-lock, before any NetBox call"
      block:
        - name: "(13) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-fpe-13.json]
          changed_when: false
          failed_when: false

        - name: "(13) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-fpe-13.json]
          register: _fpe13_start
          changed_when: false

        - name: "(13) parse stub URLs"
          ansible.builtin.set_fact:
            _fpe13_k8s_url: "{{ _fpe13_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _fpe13_netbox_url: "{{ _fpe13_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(13) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-fpe-13-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _fpe13_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(13) run the REAL finalise-purge playbook — the declared JT invocation, vault_netbox_purge_token blank"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/finalise-purge.yml"
              - -e
              - "l3_kube_api_url={{ _fpe13_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - "netbox_api_url={{ _fpe13_netbox_url }}"
              - -e
              - vault_netbox_purge_token=
              - -e
              - workload_slug=demo-blank-token
              - -e
              - '{"purge_expected_service_ids": []}'
              - -e
              - purge_actor=test-actor
              - -e
              - purge_role=test-role
              - -e
              - "purge_reason=blank token probe"
              - -e
              - l3_request_id=13131313131313131313131313131313
            chdir: "{{ playbook_dir }}/.."
          environment:
            KUBECONFIG: /tmp/l3-fpe-13-kubeconfig.yaml
          register: _fpe13_run
          changed_when: false
          failed_when: false

        - name: "(13) ASSERT: refused pre-lock — never reaches the frozen-contract assert (detail=preflight), let alone any NetBox call"
          ansible.builtin.assert:
            that:
              - _fpe13_run.rc != 0
              - "'DMF_L3_PURGE_OUTCOME: refused' in _fpe13_run.stdout"
              - "'detail=pre-lock' in _fpe13_run.stdout"
              - "'preflight-error' in _fpe13_run.stdout"
            fail_msg: "(13) FAIL — expected a pre-lock refusal for a blank vault_netbox_purge_token. stdout={{ _fpe13_run.stdout }}"

        - name: "(13) ASSERT: the NetBox stub was never touched — no service list request landed"
          ansible.builtin.uri:
            url: "{{ _fpe13_netbox_url }}/api/ipam/services/"
            method: GET
            status_code: [200]
