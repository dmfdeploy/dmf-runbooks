            - name: "(7) stop the throwaway instance — we only needed a fresh reset"
              ansible.builtin.command:
                argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-fpe-7-probe.json]
              changed_when: false

        - name: "(7) start the REAL stub instance for this scenario, with service id 1 marked sticky (survives its own DELETE call)"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-fpe-7.json]
          register: _fpe7_start
          changed_when: false
          environment:
