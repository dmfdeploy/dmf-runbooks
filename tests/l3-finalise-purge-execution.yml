    # ════════════════════════════════════════════════════════════════════
    # Scenario 10 (umbrella #347 fix round FIX-A2b.1, P1-2) — PERMANENT PIN
    # of codex's own executed GATE-A2b.1 retag probe: a service that WAS a
    # member of the requested workload at the console's own preflight time
    # (its id is in purge_expected_service_ids) has since been retagged to
    # `workload:other-workload` — a live, still-real record, just no longer
    # grouped under the workload this run was asked to purge. The old code
    # treated "not found in this workload's own fresh grouping" as
    # "already-gone convergence" and DELETEd it directly; the fix makes the
    # launcher GET-by-id it first and refuse the whole run on a live 200.
    # ════════════════════════════════════════════════════════════════════
    - name: "(10) PIN codex's P1-2 retag probe — a stale expected id now belonging to ANOTHER workload must refuse, never be deleted"
      vars:
