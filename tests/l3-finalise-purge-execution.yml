        - name: "(12) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-fpe-12.json]
          register: _fpe12_start
          changed_when: false

        - name: "(12) parse stub URLs"
          ansible.builtin.set_fact:
            _fpe12_k8s_url: "{{ _fpe12_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"
            _fpe12_netbox_url: "{{ _fpe12_start.stdout_lines | select('match', '^NETBOX_STUB_URL=') | first | regex_replace('^NETBOX_STUB_URL=', '') }}"

        - name: "(12) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
