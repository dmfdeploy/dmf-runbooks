      block:
        - name: "(7) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-fpe-7.json]
          changed_when: false
          failed_when: false

        - name: "(7) seed two clean workload members + the Tag first (via a temporary start so we know the sticky id ahead of the REAL start)"
          block:
            - name: "(7) start a throwaway stub instance just to allocate ids"
              ansible.builtin.command:
                argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-fpe-7-probe.json]
