          failed_when: false

        - name: "(10) ASSERT: refused, detail=member-purge — a live record outside the requested workload's grouping is NEVER treated as already-gone (P1-2)"
          ansible.builtin.assert:
            that:
              - _fpe10_run.rc != 0
              - "'DMF_L3_PURGE_OUTCOME: refused' in _fpe10_run.stdout"
              - "'detail=member-purge' in _fpe10_run.stdout"
