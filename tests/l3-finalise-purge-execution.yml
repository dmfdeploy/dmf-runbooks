            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _fpe7_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
