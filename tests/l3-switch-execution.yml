                epoch: "pre-switch-uid:1000"
            status_code: [201]

        - name: "(10) seed the receiver's target Deployment, NEVER reaching rollout-status readiness for PHASE 2 verify's own attempts (triggers the rollback-and-verify ladder)"
          ansible.builtin.uri:
            url: "{{ _se10_k8s_url }}/apis/apps/v1/namespaces/mxl/deployments/"
            method: POST
            body_format: json
            body:
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: mxl-videotest-view-target, namespace: mxl, generation: 2 }
              spec:
                replicas: 1
                template:
                  spec:
                    containers:
                      - name: status
                        env:
                          - { name: MXL_FLOW_ID, value: b0ae9cba-a989-4568-ac96-8bd19272c966 }
              status:
                observedGeneration: 1
                replicas: 1
                updatedReplicas: 0
                readyReplicas: 0
                availableReplicas: 0
                unavailableReplicas: 1
            status_code: [201]

        - name: "(10) queue the Deployment's OWN trajectory: still-not-ready for PHASE 2 verify's own attempts (2), THEN converged (rolled back to the pre-switch flow.id) for the rollback verify's FIRST attempt — criteria 2+3 are satisfiable immediately, isolating criterion 1 (values) as the ONLY reason verification never succeeds"
          ansible.builtin.uri:
            url: "{{ _se10_k8s_url }}/test-only/get-patch-queue"
            method: POST
            body_format: json
            body:
              kind: Deployment
              namespace: mxl
              name: mxl-videotest-view-target
              patches:
                - status: { observedGeneration: 1, updatedReplicas: 0, readyReplicas: 0, availableReplicas: 0, unavailableReplicas: 1 }
                - status: { observedGeneration: 1, updatedReplicas: 0, readyReplicas: 0, availableReplicas: 0, unavailableReplicas: 1 }
                - status: { observedGeneration: 2, updatedReplicas: 1, readyReplicas: 1, availableReplicas: 1, unavailableReplicas: 0 }
                  spec:
                    template:
                      spec:
                        containers:
                          - name: status
                            env:
                              - { name: MXL_FLOW_ID, value: 5fbec3b1-1b0f-417d-9059-8b94a47197ed }
            status_code: [200]

        - name: "(10) queue the coordinator's target-info/epoch republish (conditional) — criterion 4 is satisfiable too, so ONLY criterion 1 (the permanently-failing values read) keeps verification from ever succeeding"
          ansible.builtin.uri:
            url: "{{ _se10_k8s_url }}/test-only/get-patch-queue"
            method: POST
            body_format: json
            body:
              kind: ConfigMap
              namespace: mxl
              name: mxl-coordinator
              patches:
                - when_absent: "data.target-info"
                  patch:
                    data:
                      target-info: '{"pod_uid": "rollback-restored-uid", "start_ts": "3000"}'
                      epoch: "rollback-restored-uid:3000"
            status_code: [200]

        - name: "(10) create the helm PATH shim dir"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin
            state: directory

        - name: "(10) symlink helm -> stub_helm.sh"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin/helm
            src: "{{ l3_harness_dir }}/stub_helm.sh"
            state: link
            force: true

        - name: "(10) remove any stale helm invocation log / values-call-count file from a prior run"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/l3-se-10-helm.log
            - /tmp/l3-se-10-values-count

        - name: "(10) run the REAL switch playbook — helm get values allowed to succeed exactly ONCE (the pre-quiesce baseline capture), fails on every call after (every rollback-verify poll attempt)"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se10_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-b
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se_j1_topology_params_switched_to_b} | to_json }}"
              - -e
              - "l3_request_id={{ _se10_run_id }}"
              - -e
              - l3_switch_quiesce_settle_seconds=1
              - -e
              - l3_switch_upgrade_verify_timeout_seconds=1
              - -e
              - l3_switch_verify_poll_delay_seconds=1
              - -e
              - l3_switch_rollback_verify_timeout_seconds=3
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-10-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-se-10-helm.log
            L3_STUB_HELM_VALUES_FAIL_AFTER_N: "1"
            L3_STUB_HELM_VALUES_COUNT_FILE: /tmp/l3-se-10-values-count
          register: _se10_run
          changed_when: false
          failed_when: false

        - name: "(10) ASSERT: the job fails with rollback_verification_failed — the poll ran to budget (never crashed on the values-read failure, never masked it as a bare rescue message), and criterion 1 alone kept verification from ever succeeding"
          ansible.builtin.assert:
            that:
              - _se10_run.rc != 0
              - "'rollback_verification_failed:' in _se10_run.stdout"
              - "'rollback_verified previous_source_restored:' not in _se10_run.stdout"
            fail_msg: "(10) FAIL — expected rollback_verification_failed. stdout={{ _se10_run.stdout }}"

        - name: "(10) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token rollback_verification_failed (umbrella #323 fix round, codex gate: this scenario reaches a real PHASE-2 terminal branch but used to assert ONLY the legacy stdout prefix above — so a mutant that dropped the structured event on the values-read-failure path, or emitted the WRONG enum for it, passed unnoticed here)"
          ansible.builtin.set_fact:
            _se10_markers: "{{ (_se10_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(10) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se10_markers | length == 1
            fail_msg: "(10) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se10_markers }}"

        - name: "(10) parse the marker's token out of the line — the EXACT field, never a substring (see scenario 1's own parse task for why `'x' in marker` discriminates almost nothing)"
          ansible.builtin.set_fact:
            _se10_token: "{{ (_se10_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"

        - name: "(10) ASSERT the parsed enum is EXACTLY token 'rollback_verification_failed' — never `refused` (this is NOT a generic rescue exit: the poll ran to its own budget and the play reported the frozen design's own outcome for it), and never either rollback_verified_* token (nothing was restored)"
          ansible.builtin.assert:
            that:
              - _se10_token == 'rollback_verification_failed'
              - "'restored_active_source' not in _se10_markers[0]"
            fail_msg: "(10) FAIL — expected token 'rollback_verification_failed'. got token={{ _se10_token }} markers={{ _se10_markers }}"

        - name: "(10) ASSERT: at least one 'get values' call was made (the pre-quiesce baseline capture — call #1, which MUST still succeed) and at least one MORE (a rollback-verify poll attempt, which must have failed and NOT aborted the play)"
          ansible.builtin.slurp:
            src: /tmp/l3-se-10-helm.log
          register: _se10_helm_log_raw

        - name: "(10) parse + count values-read invocations"
          ansible.builtin.set_fact:
            _se10_values_lines: "{{ (_se10_helm_log_raw.content | b64decode).split('\n') | select('match', '^get values ') | list }}"

        - name: "(10) assert at least two 'get values' calls (baseline + at least one tolerated rollback-verify failure)"
          ansible.builtin.assert:
            that:
              - _se10_values_lines | length >= 2
            fail_msg: "(10) FAIL — expected at least 2 'get values' calls (baseline capture + at least one failed rollback-verify poll). got={{ _se10_values_lines }}"

        - name: "(10) ASSERT (via real HTTP against the stub): active-source stays ABSENT — no restore was attempted (rollback verification itself failed), and it is NEVER the switch target"
          ansible.builtin.uri:
            url: "{{ _se10_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: GET
            return_content: true
            validate_certs: false
          register: _se10_coordinator

        - name: "(10) assert active-source absent"
          ansible.builtin.assert:
            that:
              - "'active-source' not in (_se10_coordinator.json.data | default({}))"
            fail_msg: "(10) FAIL — active-source={{ _se10_coordinator.json.data['active-source'] | default('<absent>') }}, expected absent. got={{ _se10_coordinator.json.data }}"

        - name: "(10) ASSERT (via real HTTP against the stub): the facility lock was released"
          ansible.builtin.uri:
            url: "{{ _se10_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(10) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-10.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 11: umbrella #323 fix round, codex gate P2a — the OTHER
    # verified-rollback exit. Identical in every respect to scenario 7
    # (upgrade never converges -> rollback -> rollback verifies on its first
    # poll) EXCEPT that the pre-switch coordinator has NO active-source set.
    # The restore task is correctly SKIPPED on that exit (`when: ... and
    # (_switch_baseline.active_source | trim) != ''` — there is nothing to
    # restore, and writing an empty active-source would be a mutation, not a
    # restore), but the play used to emit
    # rollback_verified_previous_source_restored anyway, with
    # restored_active_source rendering EMPTY: a factually FALSE enum on a
    # perfectly valid exit. It now emits rollback_verified_no_previous_source.
    #
    # This scenario is what makes that split real rather than cosmetic: run
    # it against the pre-fix play and it fails on the token, while scenario
    # 7 (the active-source=source-a twin) keeps passing — which is exactly
    # the discrimination the old single-token design lacked. The LEGACY
    # stdout fail message is asserted to be the SAME, byte-identical
    # `rollback_verified previous_source_restored:` line scenario 7 sees:
    # dmf-cms's #320 bridge parses it during the transition and this fix
    # deliberately did not touch it.
    # ════════════════════════════════════════════════════════════════════
    - name: "(11) rollback verifies, but the pre-switch coordinator had NO active-source — the job must report rollback_verified_no_previous_source, never claim a restore that never happened"
      vars:
        _se11_run_id: "b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1"
      block:
        - name: "(11) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-11.json]
          changed_when: false
          failed_when: false

        - name: "(11) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-se-11.json]
          register: _se11_start
          changed_when: false

        - name: "(11) parse stub URLs"
          ansible.builtin.set_fact:
            _se11_k8s_url: "{{ _se11_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"

        - name: "(11) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-se-11-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _se11_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(11) seed the coordinator ConfigMap with NO active-source (the discriminating difference from scenario 7 — a live topology that is currently quiesced, which is a perfectly legal pre-switch state)"
          ansible.builtin.uri:
            url: "{{ _se11_k8s_url }}/api/v1/namespaces/mxl/configmaps/"
            method: POST
            body_format: json
            body:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: mxl }
              data:
                target-info: '{"pod_uid": "pre-switch-uid", "start_ts": "1000"}'
                epoch: "pre-switch-uid:1000"
            status_code: [201]

        - name: "(11) seed the receiver's target Deployment, NEVER reaching rollout-status readiness (same job-413 shape as scenario 7)"
          ansible.builtin.uri:
            url: "{{ _se11_k8s_url }}/apis/apps/v1/namespaces/mxl/deployments/"
            method: POST
            body_format: json
            body:
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: mxl-videotest-view-target, namespace: mxl, generation: 2 }
              spec:
                replicas: 1
                template:
                  spec:
                    containers:
                      - name: status
                        env:
                          - { name: MXL_FLOW_ID, value: b0ae9cba-a989-4568-ac96-8bd19272c966 }
              status:
                observedGeneration: 1
                replicas: 1
                updatedReplicas: 0
                readyReplicas: 0
                availableReplicas: 0
                unavailableReplicas: 1
            status_code: [201]

        - name: "(11) queue the Deployment's own trajectory: not-ready for PHASE 2 verify's two attempts, THEN converged at the pre-switch flow.id for the rollback verify's first attempt (identical to scenario 7 — the rollback itself must genuinely verify, so the ONLY variable under test is the absent active-source)"
          ansible.builtin.uri:
            url: "{{ _se11_k8s_url }}/test-only/get-patch-queue"
            method: POST
            body_format: json
            body:
              kind: Deployment
              namespace: mxl
              name: mxl-videotest-view-target
              patches:
                - status: { observedGeneration: 1, updatedReplicas: 0, readyReplicas: 0, availableReplicas: 0, unavailableReplicas: 1 }
                - status: { observedGeneration: 1, updatedReplicas: 0, readyReplicas: 0, availableReplicas: 0, unavailableReplicas: 1 }
                - status: { observedGeneration: 2, updatedReplicas: 1, readyReplicas: 1, availableReplicas: 1, unavailableReplicas: 0 }
                  spec:
                    template:
                      spec:
                        containers:
                          - name: status
                            env:
                              - { name: MXL_FLOW_ID, value: 5fbec3b1-1b0f-417d-9059-8b94a47197ed }
            status_code: [200]

        - name: "(11) queue the coordinator's target-info/epoch republish (conditional — see this file's own header for why bare FIFO would be wrong here)"
          ansible.builtin.uri:
            url: "{{ _se11_k8s_url }}/test-only/get-patch-queue"
            method: POST
            body_format: json
            body:
              kind: ConfigMap
              namespace: mxl
              name: mxl-coordinator
              patches:
                - when_absent: "data.target-info"
                  patch:
                    data:
                      target-info: '{"pod_uid": "rollback-restored-uid", "start_ts": "3000"}'
                      epoch: "rollback-restored-uid:3000"
            status_code: [200]

        - name: "(11) create the helm PATH shim dir"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin
            state: directory

        - name: "(11) symlink helm -> stub_helm.sh"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin/helm
            src: "{{ l3_harness_dir }}/stub_helm.sh"
            state: link
            force: true

        - name: "(11) remove any stale helm invocation log from a prior run"
          ansible.builtin.file:
            path: /tmp/l3-se-11-helm.log
            state: absent

        - name: "(11) run the REAL switch playbook"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se11_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
