            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-se-11-helm.log
          register: _se11_run
          changed_when: false
          failed_when: false

        - name: "(11) ASSERT: the job FAILED, and the LEGACY stdout line is the SAME byte-identical `rollback_verified previous_source_restored:` message scenario 7 sees — this fix changed the structured enum ONLY, never dmf-cms's #320 bridge contract"
          ansible.builtin.assert:
            that:
              - _se11_run.rc != 0
              - "'rollback_verified previous_source_restored:' in _se11_run.stdout"
