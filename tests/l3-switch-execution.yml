---
# umbrella #201 WP4b — REAL-playbook stubbed execution tests for
# playbooks/switch-mxl-fabrics-demo.yml (spec §6.2's quiesce -> re-point ->
# select). Same pattern as tests/l3-topology-execution.yml: each scenario
# starts a FRESH stub-server process, runs the REAL, unmodified switch
# playbook as a nested `ansible-playbook` subprocess, and asserts on its
# real stdout + real HTTP against the stub K8s API + the helm invocation
# log (tests/harness/stub_helm.sh's own L3_STUB_HELM_LOG).
#
# Unlike a launch/teardown, a switch touches NO NetBox at all — every
# scenario here only needs the K8s stub + the helm PATH shim, never the
# NetBox stub or a dcim.sites seed.
#
# Sequencing-order proof (mutant-detectable, claude1's own condition):
# scenarios 4a/4b/4c fault at each of the three phase boundaries in turn
# and assert the EXACT intermediate state at each — a reordered mutant
# (e.g. select-before-repoint, or repoint-before-quiesce) fails at least
# one of these three staged assertions. Scenario 6 (happy path) then
# proves the full, unfaulted sequence reaches the correct final state.
#
# Atomic re-point (claude1's own condition 1): scenario 5 simulates a
# `helm upgrade` failure via L3_STUB_HELM_UPGRADE_FAIL — the stub cannot
# itself model Helm's OWN --atomic/--rollback-on-failure rollback-to-pre-
# values guarantee (that is Helm's own tested behavior, not code this repo
# owns); what IS proven here is that the playbook genuinely REQUESTS a
# rollback-on-failure mode (via the logged argv) and correctly treats a
# failed re-point as a failure — never advancing to phase 3, never masking
# it as success.
#
# umbrella #306 (chart-argument fix): PHASE 2's `helm upgrade` used to omit
# the CHART positional entirely — a structurally invalid command that
# stub_helm.sh's OLD, permissive `upgrade` case could never catch (it never
# checked for a chart positional at all), which is exactly how AWX job 321
# became this playbook's first-ever, and first-ever FAILED, live
# invocation. The fix adds a chart-resolution step
# (switch_resolve_chart.yml) between switch_read_coordinator and PHASE 1:
# `helm get metadata` (never the l3_chart_version pin) followed by
# `helm pull` to a temp dir, both now visible in the helm invocation log
# BEFORE phase 1 ever runs. Scenario 4b's own assertions below had to
# change for exactly this reason — "no helm log exists" stopped being true
# the moment resolution moved before quiesce, even though phase 2 (the
# actual re-point) still hasn't run at that boundary. stub_helm.sh's own
# `upgrade` case is now hardened to enforce Helm's real `[RELEASE] [CHART]`
# two-positional contract (rejecting exactly the shape that broke AWX job
# 321) and its `--help` output now feature-detects to
# --rollback-on-failure — scenarios 4c/5/6 assert the resulting argv
# carries the pulled tempdir chart path, --reuse-values, no reset-mode
# flag, and --rollback-on-failure.
#
# umbrella #323 fix round (codex adversarial gate): three additions, all
# structural rather than cosmetic. (1) Every structured-event assertion now
# PARSES the token out of the marker line and compares it for EQUALITY —
# the previous `'refused' in marker` substring checks were satisfied by
# 'not_refused', by any kv value containing the word, and by any longer
# token sharing the prefix, which is to say they discriminated almost
# nothing. Those parse expressions are deliberately BACKSLASH-FREE (a
# literal space instead of `\s+`, and a whole-match regex_search +
# regex_replace instead of a `\1` backreference): how many backslashes
# survive depends on the YAML scalar style AND the Jinja quote style AND
# the ansible-core version, and this suite's own first attempt at it
# silently produced a non-matching pattern under one such combination. A
# pattern with no escapes at all cannot drift that way — which also matters
# because CI runs an EE-pinned ansible-core 2.15 leg that cannot be
# reproduced on this harness. The whole-match form also never RAISES on a
# non-match (regex_search with a group reference does), so a missing field
# surfaces as a readable assertion failure instead of a template error. (2) Scenario 11 covers the verified-rollback exit where the
# pre-switch coordinator had NO active-source: it and scenario 7 differ in
# exactly that one fixture and must now report DIFFERENT tokens, which is
# what stops the play claiming a restore that never happened. (3) Scenarios
# 12a/12b/12c are adversarial: they run the real playbook with the outcome
# event's own control variables supplied as extra_vars and prove the caller
# can neither silence nor author the event. See each scenario's own header.
#
# Run:  ansible-playbook tests/l3-switch-execution.yml
# (LONG — it starts fresh stub servers per scenario and runs the real
# playbook as a nested subprocess each time; run it detached and poll
# rather than in a foreground shell with a command timeout.)

- name: "Umbrella #201 WP4b — L3 switch playbook real-playbook stubbed execution tests"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    l3_harness_dir: "{{ playbook_dir }}/harness"
    _se_j1_topology_params_switched_to_b:
      schema_version: 1
      target_facility: dmf-example-site
      sources:
        - id: source-a
          flow_id: "5fbec3b1-1b0f-417d-9059-8b94a47197ed"
          pattern: smpte
        - id: source-b
          flow_id: "b0ae9cba-a989-4568-ac96-8bd19272c966"
          pattern: ball
      viewer:
        id: viewer-a
        source_selection: source-b

  tasks:
    # ════════════════════════════════════════════════════════════════════
    # Scenario 0: stub_helm.sh's own `upgrade` argv contract (umbrella #306
    # fix-round 1, codex MAJOR) — a direct probe against the stub script
    # itself, no stub K8s/NetBox servers needed. Real Helm's `helm upgrade`
    # requires EXACTLY two positionals (RELEASE, CHART); stub_helm.sh must
    # reject both too few (the original umbrella #306 bug shape — no chart
    # at all) and too many (a stray extra positional — e.g. a flag this
    # stub misclassifies as taking no value, stranding its real value as
    # an extra positional; codex's own adversarial probe evidence: real
    # Helm rc=1 on a 3-positional argv, the pre-fix-round-1 stub rc=0'd
    # it) with the SAME real-Helm error, and accept exactly two.
    # ════════════════════════════════════════════════════════════════════
    - name: "(0) stub_helm.sh upgrade argv contract — too few positionals (the original umbrella #306 bug shape) rejected rc=1"
      ansible.builtin.command:
        argv:
          - "{{ l3_harness_dir }}/stub_helm.sh"
          - upgrade
          - mxl-videotest-view
          - --reuse-values
          - -n
          - mxl
          - --set
          - flow.id=b0ae9cba-a989-4568-ac96-8bd19272c966
          - --rollback-on-failure
          - --wait
          - --timeout
          - 90s
      register: _se0_too_few
      changed_when: false
      failed_when: false

    - name: "(0) assert too-few positionals rejected"
      ansible.builtin.assert:
        that:
          - _se0_too_few.rc == 1
          - "'requires 2 arguments' in _se0_too_few.stderr"
        fail_msg: "(0) FAIL — expected stub_helm.sh to reject a no-chart upgrade argv with rc=1. rc={{ _se0_too_few.rc }} stderr={{ _se0_too_few.stderr }}"

    - name: "(0) create a real local chart dir for the two probes below (stub_helm.sh's own path-existence check needs a real path)"
      ansible.builtin.tempfile:
        state: directory
        suffix: l3-se0-chart
      register: _se0_chart_tmp

    - name: "(0) create the chart subdirectory"
      ansible.builtin.file:
        path: "{{ _se0_chart_tmp.path }}/mxl-fabrics-demo"
        state: directory

    - name: "(0) stub_helm.sh upgrade argv contract — a STRAY THIRD positional (codex fix-round-1 MAJOR adversarial finding) rejected rc=1"
      ansible.builtin.command:
        argv:
          - "{{ l3_harness_dir }}/stub_helm.sh"
          - upgrade
          - mxl-videotest-view
          - "{{ _se0_chart_tmp.path }}/mxl-fabrics-demo"
          - --reuse-values
          - stray-positional
          - -n
          - mxl
          - --set
          - flow.id=b0ae9cba-a989-4568-ac96-8bd19272c966
          - --rollback-on-failure
          - --wait
          - --timeout
          - 90s
      register: _se0_too_many
      changed_when: false
      failed_when: false

    - name: "(0) assert stray-third-positional rejected"
      ansible.builtin.assert:
        that:
          - _se0_too_many.rc == 1
          - "'requires 2 arguments' in _se0_too_many.stderr"
        fail_msg: "(0) FAIL — expected stub_helm.sh to reject a 3-positional upgrade argv with rc=1. rc={{ _se0_too_many.rc }} stderr={{ _se0_too_many.stderr }}"

    - name: "(0) stub_helm.sh upgrade argv contract — the CORRECT two-positional shape accepted rc=0"
      ansible.builtin.command:
        argv:
          - "{{ l3_harness_dir }}/stub_helm.sh"
          - upgrade
          - mxl-videotest-view
          - "{{ _se0_chart_tmp.path }}/mxl-fabrics-demo"
          - -n
          - mxl
          - --reuse-values
          - --set
          - flow.id=b0ae9cba-a989-4568-ac96-8bd19272c966
          - --rollback-on-failure
          - --wait
          - --timeout
          - 90s
      register: _se0_correct
      changed_when: false
      failed_when: false

    - name: "(0) assert the correct two-positional shape is accepted"
      ansible.builtin.assert:
        that:
          - _se0_correct.rc == 0
        fail_msg: "(0) FAIL — expected the correct two-positional upgrade argv to succeed. rc={{ _se0_correct.rc }} stdout={{ _se0_correct.stdout }} stderr={{ _se0_correct.stderr }}"

    - name: "(0) remove the probe chart tempdir"
      ansible.builtin.file:
        path: "{{ _se0_chart_tmp.path }}"
        state: absent

    # ════════════════════════════════════════════════════════════════════
    # Scenario 1: malformed topology_params (bad schema_version) -> refused
    # BEFORE any lock acquisition (no mutation, nothing to release).
    # ════════════════════════════════════════════════════════════════════
    - name: "(1) malformed topology_params (schema_version=2) — start fresh stubs, run the REAL switch playbook"
      vars:
        _se1_run_id: "11111111111111111111111111111111"
        _se1_bad_topology_params: "{{ _se_j1_topology_params_switched_to_b | combine({'schema_version': 2}) }}"
      block:
        - name: "(1) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-1.json]
          changed_when: false
          failed_when: false

        - name: "(1) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-se-1.json]
          register: _se1_start
          changed_when: false

        - name: "(1) parse stub URLs"
          ansible.builtin.set_fact:
            _se1_k8s_url: "{{ _se1_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"

        - name: "(1) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-se-1-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _se1_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(1) run the REAL switch playbook"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se1_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-b
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se1_bad_topology_params} | to_json }}"
              - -e
              - "l3_request_id={{ _se1_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-1-kubeconfig.yaml
          register: _se1_run
          changed_when: false
          failed_when: false

        - name: "(1) ASSERT: the REAL playbook run FAILED"
          ansible.builtin.assert:
            that:
              - _se1_run.rc != 0
              - "'DMF_L3_SWITCH_REFUSED' in _se1_run.stdout"
              - "'detail=topology-invalid' in _se1_run.stdout"
            fail_msg: "(1) FAIL — expected a topology-invalid refusal. stdout={{ _se1_run.stdout }}"

        - name: "(1) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token refused (umbrella #323 — a pre-lock refusal never emits its own PHASE-2-specific token, so this proves the rescue:'s own generic catch-all fires exactly once; a mutant that drops the event entirely fails this, not just the legacy DMF_L3_SWITCH_REFUSED prefix assert above)"
          ansible.builtin.set_fact:
            _se1_markers: "{{ (_se1_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(1) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se1_markers | length == 1
            fail_msg: "(1) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se1_markers }}"

        - name: "(1) parse the marker's token + detail out of the line — the EXACT fields, never a substring (umbrella #323 fix round, codex gate: `'refused' in marker` is also satisfied by a mutant emitting 'not_refused', by any kv VALUE containing that word, and by any longer token sharing the prefix — so the old check discriminated almost nothing). detail= is parsed as the FIRST such field, which is why the playbook always renders it immediately after the token: caller-supplied free text (receiver_instance) can only ever appear later in the line and can never splice this value."
          ansible.builtin.set_fact:
            _se1_token: "{{ (_se1_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"
            _se1_detail: "{{ (_se1_markers[0] | regex_search('detail=[A-Za-z0-9_-]+') | default('detail=<no-detail-field>', true)) | regex_replace('^detail=', '') }}"

        - name: "(1) ASSERT the parsed enum is EXACTLY token 'refused' detail 'pre-lock'. detail=pre-lock is the stage that was in flight: a refusal inside switch_lock (identity/validate/lock acquisition) — nothing touched, no lock ever held."
          ansible.builtin.assert:
            that:
              - _se1_token == 'refused'
              - _se1_detail == 'pre-lock'
            fail_msg: "(1) FAIL — expected token 'refused' detail 'pre-lock'. got token={{ _se1_token }} detail={{ _se1_detail }} markers={{ _se1_markers }}"

        - name: "(1) ASSERT (via real HTTP against the stub): the facility lock was NEVER created (pre-lock refusal)"
          ansible.builtin.uri:
            url: "{{ _se1_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(1) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-1.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 2: source_instance disagrees with topology_params.viewer.
    # source_selection -> refused BEFORE any lock acquisition.
    # ════════════════════════════════════════════════════════════════════
    - name: "(2) source_instance/viewer.source_selection mismatch — start fresh stubs, run the REAL switch playbook"
      vars:
        _se2_run_id: "22222222222222222222222222222222"
      block:
        - name: "(2) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-2.json]
          changed_when: false
          failed_when: false

        - name: "(2) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-se-2.json]
          register: _se2_start
          changed_when: false

        - name: "(2) parse stub URLs"
          ansible.builtin.set_fact:
            _se2_k8s_url: "{{ _se2_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"

        - name: "(2) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-se-2-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _se2_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(2) run the REAL switch playbook, source_instance=source-a
            but topology_params.viewer.source_selection=source-b (the
            fixture's own default) — a forged/malformed pair"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se2_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-a
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se_j1_topology_params_switched_to_b} | to_json }}"
              - -e
              - "l3_request_id={{ _se2_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-2-kubeconfig.yaml
          register: _se2_run
          changed_when: false
          failed_when: false

        - name: "(2) ASSERT: the REAL playbook run FAILED"
          ansible.builtin.assert:
            that:
              - _se2_run.rc != 0
              - "'detail=switch-source-instance-mismatch' in _se2_run.stdout"
            fail_msg: "(2) FAIL — expected a switch-source-instance-mismatch refusal. stdout={{ _se2_run.stdout }}"

        - name: "(2) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token refused (umbrella #323 — this is the SAME generic rescue catch-all scenario 1 exercises; asserted here too for uniform belt-and-suspenders coverage across every pre-PHASE-2 refusal path)"
          ansible.builtin.set_fact:
            _se2_markers: "{{ (_se2_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(2) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se2_markers | length == 1
            fail_msg: "(2) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se2_markers }}"

        - name: "(2) parse the marker's token + detail out of the line — the EXACT fields, never a substring (umbrella #323 fix round, codex gate: `'refused' in marker` is also satisfied by a mutant emitting 'not_refused', by any kv VALUE containing that word, and by any longer token sharing the prefix — so the old check discriminated almost nothing). detail= is parsed as the FIRST such field, which is why the playbook always renders it immediately after the token: caller-supplied free text (receiver_instance) can only ever appear later in the line and can never splice this value."
          ansible.builtin.set_fact:
            _se2_token: "{{ (_se2_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"
            _se2_detail: "{{ (_se2_markers[0] | regex_search('detail=[A-Za-z0-9_-]+') | default('detail=<no-detail-field>', true)) | regex_replace('^detail=', '') }}"

        - name: "(2) ASSERT the parsed enum is EXACTLY token 'refused' detail 'pre-lock'. detail=pre-lock is the stage that was in flight: a refusal inside switch_lock (identity/validate/lock acquisition) — nothing touched, no lock ever held."
          ansible.builtin.assert:
            that:
              - _se2_token == 'refused'
              - _se2_detail == 'pre-lock'
            fail_msg: "(2) FAIL — expected token 'refused' detail 'pre-lock'. got token={{ _se2_token }} detail={{ _se2_detail }} markers={{ _se2_markers }}"

        - name: "(2) ASSERT (via real HTTP against the stub): the facility lock was NEVER created (pre-lock refusal)"
          ansible.builtin.uri:
            url: "{{ _se2_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(2) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-2.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 3: coordinator ConfigMap absent -> refused AFTER a brief
    # lock hold (the check runs post-lock, per this playbook's own design)
    # — proves the lock is still released even for this refusal.
    # ════════════════════════════════════════════════════════════════════
    - name: "(3) coordinator ConfigMap missing — start fresh stubs (no seed), run the REAL switch playbook"
      vars:
        _se3_run_id: "33333333333333333333333333333333"
      block:
        - name: "(3) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-3.json]
          changed_when: false
          failed_when: false

        - name: "(3) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-se-3.json]
          register: _se3_start
          changed_when: false

        - name: "(3) parse stub URLs"
          ansible.builtin.set_fact:
            _se3_k8s_url: "{{ _se3_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"

        - name: "(3) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-se-3-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _se3_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(3) run the REAL switch playbook against a stub with NO coordinator ConfigMap seeded"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se3_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-b
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se_j1_topology_params_switched_to_b} | to_json }}"
              - -e
              - "l3_request_id={{ _se3_run_id }}"
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-3-kubeconfig.yaml
          register: _se3_run
          changed_when: false
          failed_when: false

        - name: "(3) ASSERT: the REAL playbook run FAILED"
          ansible.builtin.assert:
            that:
              - _se3_run.rc != 0
              - "'detail=switch-coordinator-missing' in _se3_run.stdout"
            fail_msg: "(3) FAIL — expected a switch-coordinator-missing refusal. stdout={{ _se3_run.stdout }}"

        - name: "(3) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token refused (umbrella #323 — this refusal fires POST-lock, via the same generic rescue catch-all as scenarios 1/2; asserted for uniform coverage across every pre-PHASE-2 refusal path)"
          ansible.builtin.set_fact:
            _se3_markers: "{{ (_se3_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(3) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se3_markers | length == 1
            fail_msg: "(3) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se3_markers }}"

        - name: "(3) parse the marker's token + detail out of the line — the EXACT fields, never a substring (umbrella #323 fix round, codex gate: `'refused' in marker` is also satisfied by a mutant emitting 'not_refused', by any kv VALUE containing that word, and by any longer token sharing the prefix — so the old check discriminated almost nothing). detail= is parsed as the FIRST such field, which is why the playbook always renders it immediately after the token: caller-supplied free text (receiver_instance) can only ever appear later in the line and can never splice this value."
          ansible.builtin.set_fact:
            _se3_token: "{{ (_se3_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"
            _se3_detail: "{{ (_se3_markers[0] | regex_search('detail=[A-Za-z0-9_-]+') | default('detail=<no-detail-field>', true)) | regex_replace('^detail=', '') }}"

        - name: "(3) ASSERT the parsed enum is EXACTLY token 'refused' detail 'coordinator-read'. detail=coordinator-read is the stage that was in flight: the facility lock IS held by this point but nothing has been mutated."
          ansible.builtin.assert:
            that:
              - _se3_token == 'refused'
              - _se3_detail == 'coordinator-read'
            fail_msg: "(3) FAIL — expected token 'refused' detail 'coordinator-read'. got token={{ _se3_token }} detail={{ _se3_detail }} markers={{ _se3_markers }}"

        - name: "(3) ASSERT (via real HTTP against the stub): the facility
            lock was acquired then RELEASED (this refusal fires AFTER
            switch_lock, proving the lock does not leak even for a
            post-lock, pre-mutation refusal)"
          ansible.builtin.uri:
            url: "{{ _se3_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(3) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-3.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 4: sequencing-order proof, three staged fault-injection
    # points against a SEEDED, already-running topology (active-source=
    # source-a pre-switch). A reordered mutant (e.g. select-before-repoint)
    # fails at least one of 4a/4b/4c's own staged assertions.
    # ════════════════════════════════════════════════════════════════════
    - name: "(4) sequencing-order proof — start fresh stubs, seed an already-running topology, fault at each of the three phase boundaries in turn"
      vars:
        _se4_run_id: "44444444444444444444444444444444"
      block:
        - name: "(4) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-4.json]
          changed_when: false
          failed_when: false

        - name: "(4) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-se-4.json]
          register: _se4_start
          changed_when: false

        - name: "(4) parse stub URLs"
          ansible.builtin.set_fact:
            _se4_k8s_url: "{{ _se4_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"

        - name: "(4) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-se-4-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _se4_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(4) seed the coordinator ConfigMap with a live PRE-switch state (active-source=source-a)"
          ansible.builtin.uri:
            url: "{{ _se4_k8s_url }}/api/v1/namespaces/mxl/configmaps/"
            method: POST
            body_format: json
            body:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: mxl }
              data:
                active-source: source-a
                target-info: '{"pod_uid": "pre-switch-uid", "start_ts": "1000"}'
                epoch: "pre-switch-uid:1000"
            status_code: [201]

        - name: "(4) create the helm PATH shim dir"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin
            state: directory

        - name: "(4) symlink helm -> stub_helm.sh"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin/helm
            src: "{{ l3_harness_dir }}/stub_helm.sh"
            state: link
            force: true

        - name: "(4) remove any stale helm invocation logs from a prior run
            (umbrella #306 — 4b/4c now write real helm calls before their
            own fault fires, so a leftover log from an earlier LOCAL run
            would silently accumulate across invocations; L3_STUB_HELM_LOG
            is always appended, never truncated)"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/l3-se-4a-helm.log
            - /tmp/l3-se-4b-helm.log
            - /tmp/l3-se-4c-helm.log

        # ── 4a: fault at post-switch-lock (before ANY coordinator mutation)
        - name: "(4a) run the REAL switch playbook, fault at post-switch-lock"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se4_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-b
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se_j1_topology_params_switched_to_b} | to_json }}"
              - -e
              - "l3_request_id={{ _se4_run_id }}"
              - -e
              - l3_fault_inject=post-switch-lock
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-4-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-se-4a-helm.log
          register: _se4a_run
          changed_when: false
          failed_when: false

        - name: "(4a) ASSERT: the REAL playbook run FAILED (the injected fault propagated)"
          ansible.builtin.assert:
            that:
              - _se4a_run.rc != 0
            fail_msg: "(4a) FAIL — exited 0. stdout={{ _se4a_run.stdout }}"

        - name: "(4a) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token refused (umbrella #323 — the fault_inject boundary raises through the same generic rescue catch-all as scenarios 1/2/3; asserted for uniform coverage)"
          ansible.builtin.set_fact:
            _se4a_markers: "{{ (_se4a_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(4a) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se4a_markers | length == 1
            fail_msg: "(4a) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se4a_markers }}"

        - name: "(4a) parse the marker's token + detail out of the line — the EXACT fields, never a substring (umbrella #323 fix round, codex gate: `'refused' in marker` is also satisfied by a mutant emitting 'not_refused', by any kv VALUE containing that word, and by any longer token sharing the prefix — so the old check discriminated almost nothing). detail= is parsed as the FIRST such field, which is why the playbook always renders it immediately after the token: caller-supplied free text (receiver_instance) can only ever appear later in the line and can never splice this value."
          ansible.builtin.set_fact:
            _se4a_token: "{{ (_se4a_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"
            _se4a_detail: "{{ (_se4a_markers[0] | regex_search('detail=[A-Za-z0-9_-]+') | default('detail=<no-detail-field>', true)) | regex_replace('^detail=', '') }}"

        - name: "(4a) ASSERT the parsed enum is EXACTLY token 'refused' detail 'coordinator-read'. detail=coordinator-read is the stage that was in flight: the facility lock IS held by this point but nothing has been mutated."
          ansible.builtin.assert:
            that:
              - _se4a_token == 'refused'
              - _se4a_detail == 'coordinator-read'
            fail_msg: "(4a) FAIL — expected token 'refused' detail 'coordinator-read'. got token={{ _se4a_token }} detail={{ _se4a_detail }} markers={{ _se4a_markers }}"

        - name: "(4a) ASSERT (via real HTTP against the stub): the coordinator is COMPLETELY UNCHANGED (no phase ever ran)"
          ansible.builtin.uri:
            url: "{{ _se4_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: GET
            return_content: true
            validate_certs: false
          register: _se4a_coordinator

        - name: "(4a) assert coordinator unchanged"
          ansible.builtin.assert:
            that:
              - _se4a_coordinator.json.data['active-source'] == 'source-a'
              - _se4a_coordinator.json.data['target-info'] is defined
              - _se4a_coordinator.json.data['epoch'] == 'pre-switch-uid:1000'
            fail_msg: "(4a) FAIL — coordinator was mutated despite faulting before phase 1. got={{ _se4a_coordinator.json.data }}"

        - name: "(4a) ASSERT: no helm upgrade call was ever made"
          ansible.builtin.stat:
            path: /tmp/l3-se-4a-helm.log
          register: _se4a_helm_log_stat

        - name: "(4a) assert no helm log exists at all (no helm invocation of any kind)"
          ansible.builtin.assert:
            that:
              - not _se4a_helm_log_stat.stat.exists
            fail_msg: "(4a) FAIL — expected zero helm invocations before phase 1, got a log file"

        - name: "(4a) ASSERT (via real HTTP against the stub): the facility lock was released"
          ansible.builtin.uri:
            url: "{{ _se4_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false

        # ── 4b: fault at post-switch-quiesce (after phase 1, before phase 2)
        - name: "(4b) run the REAL switch playbook, fault at post-switch-quiesce"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se4_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-b
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se_j1_topology_params_switched_to_b} | to_json }}"
              - -e
              - "l3_request_id={{ _se4_run_id }}"
              - -e
              - l3_fault_inject=post-switch-quiesce
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-4-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-se-4b-helm.log
          register: _se4b_run
          changed_when: false
          failed_when: false

        - name: "(4b) ASSERT: the REAL playbook run FAILED (the injected fault propagated)"
          ansible.builtin.assert:
            that:
              - _se4b_run.rc != 0
            fail_msg: "(4b) FAIL — exited 0. stdout={{ _se4b_run.stdout }}"

        - name: "(4b) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token refused (umbrella #323 — the fault_inject boundary raises through the same generic rescue catch-all as scenarios 1/2/3/4a; asserted for uniform coverage)"
          ansible.builtin.set_fact:
            _se4b_markers: "{{ (_se4b_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(4b) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se4b_markers | length == 1
            fail_msg: "(4b) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se4b_markers }}"

        - name: "(4b) parse the marker's token + detail out of the line — the EXACT fields, never a substring (umbrella #323 fix round, codex gate: `'refused' in marker` is also satisfied by a mutant emitting 'not_refused', by any kv VALUE containing that word, and by any longer token sharing the prefix — so the old check discriminated almost nothing). detail= is parsed as the FIRST such field, which is why the playbook always renders it immediately after the token: caller-supplied free text (receiver_instance) can only ever appear later in the line and can never splice this value."
          ansible.builtin.set_fact:
            _se4b_token: "{{ (_se4b_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"
            _se4b_detail: "{{ (_se4b_markers[0] | regex_search('detail=[A-Za-z0-9_-]+') | default('detail=<no-detail-field>', true)) | regex_replace('^detail=', '') }}"

        - name: "(4b) ASSERT the parsed enum is EXACTLY token 'refused' detail 'quiesce'. detail=quiesce is the stage that was in flight: PHASE 1 has cleared active-source; the viewer is NOT yet re-pointed."
          ansible.builtin.assert:
            that:
              - _se4b_token == 'refused'
              - _se4b_detail == 'quiesce'
            fail_msg: "(4b) FAIL — expected token 'refused' detail 'quiesce'. got token={{ _se4b_token }} detail={{ _se4b_detail }} markers={{ _se4b_markers }}"

        - name: "(4b) ASSERT (via real HTTP against the stub): the coordinator is QUIESCED (active-source/target-info/epoch all cleared) — phase 1 ran, phase 2/3 did not"
          ansible.builtin.uri:
            url: "{{ _se4_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: GET
            return_content: true
            validate_certs: false
          register: _se4b_coordinator

        - name: "(4b) assert coordinator quiesced"
          ansible.builtin.assert:
            that:
              - "'active-source' not in (_se4b_coordinator.json.data | default({}))"
              - "'target-info' not in (_se4b_coordinator.json.data | default({}))"
              - "'epoch' not in (_se4b_coordinator.json.data | default({}))"
            fail_msg: "(4b) FAIL — expected a fully quiesced coordinator (phase 1 complete). got={{ _se4b_coordinator.json.data }}"

        - name: "(4b) ASSERT: chart resolution (umbrella #306's switch_resolve_chart.yml)
            AND the pre-switch baseline capture (umbrella #306 design round
            #2's own switch_capture_baseline.yml — a 'get values' read) both
            ran — they sit BEFORE phase 1 quiesce, so a fault at
            post-switch-quiesce fires strictly after them — but NO helm
            upgrade call was made (phase 2 never reached)"
          ansible.builtin.slurp:
            src: /tmp/l3-se-4b-helm.log
          register: _se4b_helm_log_raw

        - name: "(4b) parse helm invocation log lines"
          ansible.builtin.set_fact:
            _se4b_helm_log_lines: "{{ (_se4b_helm_log_raw.content | b64decode).split('\n') | select('!=', '') | list }}"

        - name: "(4b) assert exactly one metadata read, one values read, one pull, and ZERO upgrade calls"
          ansible.builtin.assert:
            that:
              - (_se4b_helm_log_lines | select('match', '^get metadata ') | list | length) == 1
              - (_se4b_helm_log_lines | select('match', '^get values ') | list | length) == 1
              - (_se4b_helm_log_lines | select('match', '^pull ') | list | length) == 1
              - (_se4b_helm_log_lines | select('match', '^upgrade ') | reject('equalto', 'upgrade --help') | list | length) == 0
            fail_msg: "(4b) FAIL — expected exactly one metadata read + one values read + one pull and zero upgrade calls before phase 2. got={{ _se4b_helm_log_lines }}"

        - name: "(4b) ASSERT (via real HTTP against the stub): the facility lock was released"
          ansible.builtin.uri:
            url: "{{ _se4_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false

        - name: "(4c) delete the coordinator (4b's own real quiesce left it
            cleared but present) so it can be freshly re-seeded — the stub
            K8s API enforces optimistic-concurrency resourceVersion
            checking on updates, so a PUT/PATCH here would need to read it
            back first; delete+recreate is simpler and matches every other
            scenario's own seed step exactly"
          ansible.builtin.uri:
            url: "{{ _se4_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: DELETE
            status_code: [200, 202, 204]

        - name: "(4c) re-seed the coordinator with the SAME live PRE-switch state, for a clean 4c run"
          ansible.builtin.uri:
            url: "{{ _se4_k8s_url }}/api/v1/namespaces/mxl/configmaps/"
            method: POST
            body_format: json
            body:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: mxl }
              data:
                active-source: source-a
                target-info: '{"pod_uid": "pre-switch-uid", "start_ts": "1000"}'
                epoch: "pre-switch-uid:1000"
            status_code: [201]

        # ── 4c: fault at post-switch-repoint (after phase 2, before phase 3)
        - name: "(4c) run the REAL switch playbook, fault at post-switch-repoint"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se4_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-b
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se_j1_topology_params_switched_to_b} | to_json }}"
              - -e
              - "l3_request_id={{ _se4_run_id }}"
              - -e
              - l3_fault_inject=post-switch-repoint
              - -e
              - l3_switch_quiesce_settle_seconds=1
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-4-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-se-4c-helm.log
          register: _se4c_run
          changed_when: false
          failed_when: false

        - name: "(4c) ASSERT: the REAL playbook run FAILED (the injected fault propagated)"
          ansible.builtin.assert:
            that:
              - _se4c_run.rc != 0
            fail_msg: "(4c) FAIL — exited 0. stdout={{ _se4c_run.stdout }}"

        - name: "(4c) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token refused (umbrella #323 — the fault_inject boundary raises through the same generic rescue catch-all as scenarios 1/2/3/4a/4b — the viewer's helm release WAS re-pointed by this point, but the outcome is still 'refused', never a PHASE-2-specific token, because this fault fires BEFORE PHASE 2 verify ever runs)"
          ansible.builtin.set_fact:
            _se4c_markers: "{{ (_se4c_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(4c) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se4c_markers | length == 1
            fail_msg: "(4c) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se4c_markers }}"

        - name: "(4c) parse the marker's token + detail out of the line — the EXACT fields, never a substring (umbrella #323 fix round, codex gate: `'refused' in marker` is also satisfied by a mutant emitting 'not_refused', by any kv VALUE containing that word, and by any longer token sharing the prefix — so the old check discriminated almost nothing). detail= is parsed as the FIRST such field, which is why the playbook always renders it immediately after the token: caller-supplied free text (receiver_instance) can only ever appear later in the line and can never splice this value."
          ansible.builtin.set_fact:
            _se4c_token: "{{ (_se4c_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"
            _se4c_detail: "{{ (_se4c_markers[0] | regex_search('detail=[A-Za-z0-9_-]+') | default('detail=<no-detail-field>', true)) | regex_replace('^detail=', '') }}"

        - name: "(4c) ASSERT the parsed enum is EXACTLY token 'refused' detail 'repoint'. detail=repoint is the stage that was in flight: the viewer's Helm release WAS re-pointed — materially different from detail=quiesce, which is exactly why detail= exists."
          ansible.builtin.assert:
            that:
              - _se4c_token == 'refused'
              - _se4c_detail == 'repoint'
            fail_msg: "(4c) FAIL — expected token 'refused' detail 'repoint'. got token={{ _se4c_token }} detail={{ _se4c_detail }} markers={{ _se4c_markers }}"

        - name: "(4c) ASSERT: the receiver's chart was resolved (umbrella #306
            — get metadata + pull, BEFORE the re-point), the pre-switch
            baseline was captured (umbrella #306 design round #2 — get
            values), and the viewer's helm release WAS re-pointed (phase 2
            ran) with the pulled tempdir chart arg, --reuse-values, no
            reset-mode flag, and the target source's flow.id — and NONE of
            --wait/--timeout/--rollback-on-failure/--atomic (helm-as-oracle
            is gone; PHASE 2 verify — not helm's own wait — is what would
            have decided readiness, had the fault not fired first)"
          ansible.builtin.slurp:
            src: /tmp/l3-se-4c-helm.log
          register: _se4c_helm_log_raw

        - name: "(4c) parse + isolate the metadata/values/pull/upgrade invocation lines"
          ansible.builtin.set_fact:
            _se4c_helm_log_lines: "{{ (_se4c_helm_log_raw.content | b64decode).split('\n') | select('!=', '') | list }}"

        - name: "(4c) split by invocation kind"
          ansible.builtin.set_fact:
            _se4c_metadata_lines: "{{ _se4c_helm_log_lines | select('match', '^get metadata ') | list }}"
            _se4c_values_lines: "{{ _se4c_helm_log_lines | select('match', '^get values ') | list }}"
            _se4c_pull_lines: "{{ _se4c_helm_log_lines | select('match', '^pull ') | list }}"
            _se4c_upgrade_lines: "{{ _se4c_helm_log_lines | select('match', '^upgrade ') | reject('equalto', 'upgrade --help') | list }}"

        - name: "(4c) assert exactly one metadata read, one values read, one pull, one upgrade"
          ansible.builtin.assert:
            that:
              - _se4c_metadata_lines | length == 1
              - _se4c_values_lines | length == 1
              - _se4c_pull_lines | length == 1
              - _se4c_upgrade_lines | length == 1
            fail_msg: "(4c) FAIL — expected exactly one metadata/values/pull/upgrade call each. got={{ _se4c_helm_log_lines }}"

        - name: "(4c) assert the metadata read targeted the receiver (never l3_chart_version)"
          ansible.builtin.assert:
            that:
              - _se4c_metadata_lines[0] == 'get metadata mxl-videotest-view -n mxl -o json'
            fail_msg: "(4c) FAIL — unexpected 'helm get metadata' argv: {{ _se4c_metadata_lines[0] }}"

        - name: "(4c) assert the pre-switch baseline values read targeted the receiver (umbrella #306 design round #2)"
          ansible.builtin.assert:
            that:
              - _se4c_values_lines[0] == 'get values mxl-videotest-view -n mxl -o json'
            fail_msg: "(4c) FAIL — unexpected 'helm get values' argv: {{ _se4c_values_lines[0] }}"

        - name: "(4c) assert the pull used the receiver's OWN installed version (the default stub fixture, 0.4.0)"
          ansible.builtin.assert:
            that:
              - _se4c_pull_lines[0] is match('^pull oci://zot\.zot\.svc\.cluster\.local:5000/dmf/charts/mxl-fabrics-demo --version 0\.4\.0 --untar --untardir \S+ --plain-http$')
            fail_msg: "(4c) FAIL — unexpected 'helm pull' argv: {{ _se4c_pull_lines[0] }}"

        - name: "(4c) extract the pulled tempdir path (random per run — read back from the pull argv itself, not hardcoded)"
          ansible.builtin.set_fact:
            _se4c_chart_tmp: "{{ (_se4c_pull_lines[0] | regex_search('--untardir (\\S+)', '\\1')) | first }}"

        - name: "(4c) assert the upgrade argv carries the pulled tempdir chart path, --reuse-values, the target source's flow.id, and NONE of the removed wait/rollback flags (umbrella #306 design round #2)"
          ansible.builtin.assert:
            that:
              - _se4c_upgrade_lines[0] == ('upgrade mxl-videotest-view ' ~ _se4c_chart_tmp ~ '/mxl-fabrics-demo -n mxl --reuse-values --set flow.id=b0ae9cba-a989-4568-ac96-8bd19272c966')
              - "'--wait' not in _se4c_upgrade_lines[0]"
              - "'--timeout' not in _se4c_upgrade_lines[0]"
              - "'--rollback-on-failure' not in _se4c_upgrade_lines[0]"
              - "'--atomic' not in _se4c_upgrade_lines[0]"
            fail_msg: >-
              (4c) FAIL — expected the viewer's helm upgrade to carry the
              pulled tempdir chart path, --reuse-values, and the target
              source's own flow.id, with NO wait/timeout/rollback-on-
              failure/atomic flags. Got: {{ _se4c_upgrade_lines[0] }}

        - name: "(4c) ASSERT (via real HTTP against the stub): active-source
            is STILL absent (phase 3/select never ran — proves select is
            genuinely LAST, not reordered before/during the re-point)"
          ansible.builtin.uri:
            url: "{{ _se4_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: GET
            return_content: true
            validate_certs: false
          register: _se4c_coordinator

        - name: "(4c) assert active-source still absent"
          ansible.builtin.assert:
            that:
              - "'active-source' not in (_se4c_coordinator.json.data | default({}))"
            fail_msg: "(4c) FAIL — active-source was set despite faulting before phase 3 (select ran too early). got={{ _se4c_coordinator.json.data }}"

        - name: "(4c) ASSERT (via real HTTP against the stub): the facility lock was released"
          ansible.builtin.uri:
            url: "{{ _se4_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(4) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-4.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 5: the PHASE 2 helm upgrade COMMAND ITSELF fails outright
    # (rc != 0) — REWRITTEN for the adversarial gate's Finding 1 (this PR's
    # own fix round): the OLD version of this scenario asserted that a
    # failed upgrade command jumps straight to the generic rescue, never
    # reaching PHASE 2 verify at all. That was itself a design-conformance
    # bug — the frozen design's own "helm rc is diagnostic only" principle
    # was never applied to the UPGRADE command, only the rollback command.
    # Fixed: the PHASE 2 upgrade task now carries failed_when: false, so
    # rc!=0 flows into PHASE 2 verify exactly like a rc=0 upgrade whose
    # Deployment never converges (scenario 7) — verification decides,
    # never the bare rc. This scenario proves BOTH trigger shapes (rc!=0
    # here, rc=0-but-never-ready in scenario 7) funnel into the SAME
    # verify-rollback-and-verify ladder and land on the SAME outcome.
    # ════════════════════════════════════════════════════════════════════
    - name: "(5) failed helm upgrade COMMAND (rc!=0) still flows into PHASE 2 verify, never bypasses it — rolls back, verifies, restores the previous source, and fails rollback_verified previous_source_restored"
      vars:
        _se5_run_id: "55555555555555555555555555555555"
      block:
        - name: "(5) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-5.json]
          changed_when: false
          failed_when: false

        - name: "(5) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-se-5.json]
          register: _se5_start
          changed_when: false

        - name: "(5) parse stub URLs"
          ansible.builtin.set_fact:
            _se5_k8s_url: "{{ _se5_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"

        - name: "(5) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-se-5-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _se5_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(5) seed the coordinator ConfigMap with a live PRE-switch state (active-source=source-a)"
          ansible.builtin.uri:
            url: "{{ _se5_k8s_url }}/api/v1/namespaces/mxl/configmaps/"
            method: POST
            body_format: json
            body:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: mxl }
              data:
                active-source: source-a
                target-info: '{"pod_uid": "pre-switch-uid", "start_ts": "1000"}'
                epoch: "pre-switch-uid:1000"
            status_code: [201]

        - name: "(5) seed the receiver's target Deployment, NOT ready (a failed helm upgrade — rc!=0 — leaves no rollout-status guarantee either way; PHASE 2 verify must fail on this regardless of the command's own rc)"
          ansible.builtin.uri:
            url: "{{ _se5_k8s_url }}/apis/apps/v1/namespaces/mxl/deployments/"
            method: POST
            body_format: json
            body:
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: mxl-videotest-view-target, namespace: mxl, generation: 2 }
              spec:
                replicas: 1
                template:
                  spec:
                    containers:
                      - name: status
                        env:
                          - { name: MXL_FLOW_ID, value: b0ae9cba-a989-4568-ac96-8bd19272c966 }
              status:
                observedGeneration: 1
                replicas: 1
                updatedReplicas: 0
                readyReplicas: 0
                availableReplicas: 0
                unavailableReplicas: 1
            status_code: [201]

        - name: "(5) queue the Deployment's OWN trajectory: still-not-ready for PHASE 2 verify's own attempts (2, per l3_switch_upgrade_verify_timeout_seconds=1 / l3_switch_verify_poll_delay_seconds=1 -> (1 // 1) + 1 = 2), THEN converged (rolled back to the pre-switch flow.id) for the rollback verify's FIRST attempt"
          ansible.builtin.uri:
            url: "{{ _se5_k8s_url }}/test-only/get-patch-queue"
            method: POST
            body_format: json
            body:
              kind: Deployment
              namespace: mxl
              name: mxl-videotest-view-target
              patches:
                - status: { observedGeneration: 1, updatedReplicas: 0, readyReplicas: 0, availableReplicas: 0, unavailableReplicas: 1 }
                - status: { observedGeneration: 1, updatedReplicas: 0, readyReplicas: 0, availableReplicas: 0, unavailableReplicas: 1 }
                - status: { observedGeneration: 2, updatedReplicas: 1, readyReplicas: 1, availableReplicas: 1, unavailableReplicas: 0 }
                  spec:
                    template:
                      spec:
                        containers:
                          - name: status
                            env:
                              - { name: MXL_FLOW_ID, value: 5fbec3b1-1b0f-417d-9059-8b94a47197ed }
            status_code: [200]

        - name: "(5) queue the coordinator's target-info/epoch republish (conditional — see this file's own header for why bare FIFO would be wrong here)"
          ansible.builtin.uri:
            url: "{{ _se5_k8s_url }}/test-only/get-patch-queue"
            method: POST
            body_format: json
            body:
              kind: ConfigMap
              namespace: mxl
              name: mxl-coordinator
              patches:
                - when_absent: "data.target-info"
                  patch:
                    data:
                      target-info: '{"pod_uid": "rollback-restored-uid", "start_ts": "3000"}'
                      epoch: "rollback-restored-uid:3000"
            status_code: [200]

        - name: "(5) create the helm PATH shim dir"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin
            state: directory

        - name: "(5) symlink helm -> stub_helm.sh"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin/helm
            src: "{{ l3_harness_dir }}/stub_helm.sh"
            state: link
            force: true

        - name: "(5) remove any stale helm invocation log from a prior run"
          ansible.builtin.file:
            path: /tmp/l3-se-5-helm.log
            state: absent

        - name: "(5) run the REAL switch playbook, helm upgrade fixtured to fail (rc!=0) but PHASE 2 verify still runs"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se5_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-b
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se_j1_topology_params_switched_to_b} | to_json }}"
              - -e
              - "l3_request_id={{ _se5_run_id }}"
              - -e
              - l3_switch_quiesce_settle_seconds=1
              - -e
              - l3_switch_upgrade_verify_timeout_seconds=1
              - -e
              - l3_switch_verify_poll_delay_seconds=1
              - -e
              - l3_switch_rollback_verify_timeout_seconds=3
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-5-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-se-5-helm.log
            L3_STUB_HELM_UPGRADE_FAIL: "1"
          register: _se5_run
          changed_when: false
          failed_when: false

        - name: "(5) ASSERT: the job fails with rollback_verified previous_source_restored — the failed upgrade COMMAND never bypassed PHASE 2 verify, and the SAME verify-rollback-and-verify ladder scenario 7 (rc=0-but-never-ready) exercises decided this outcome"
          ansible.builtin.assert:
            that:
              - _se5_run.rc != 0
              - "'rollback_verified previous_source_restored:' in _se5_run.stdout"
              - "'rollback_verification_failed:' not in _se5_run.stdout"
            fail_msg: "(5) FAIL — expected rollback_verified previous_source_restored despite the upgrade command's own rc!=0. stdout={{ _se5_run.stdout }}"

        - name: "(5) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token rollback_verified_previous_source_restored (umbrella #323 — asserts on the STRUCTURED event, not merely the legacy prefix above; a mutant that drops the event but leaves the legacy fail msg untouched fails only this)"
          ansible.builtin.set_fact:
            _se5_markers: "{{ (_se5_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(5) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se5_markers | length == 1
            fail_msg: "(5) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se5_markers }}"

        - name: "(5) parse the marker's token out of the line — the EXACT fields, never a substring (umbrella #323 fix round, codex gate: `'rollback_verified_previous_source_restored' in marker` is also satisfied by a mutant emitting 'not_rollback_verified_previous_source_restored', by any kv VALUE containing that word, and by any longer token sharing the prefix — so the old check discriminated almost nothing). detail= is parsed as the FIRST such field, which is why the playbook always renders it immediately after the token: caller-supplied free text (receiver_instance) can only ever appear later in the line and can never splice this value."
          ansible.builtin.set_fact:
            _se5_token: "{{ (_se5_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"

        - name: "(5) ASSERT the parsed enum is EXACTLY token 'rollback_verified_previous_source_restored'"
          ansible.builtin.assert:
            that:
              - _se5_token == 'rollback_verified_previous_source_restored'
              - "'restored_active_source=source-a' in _se5_markers[0]"
            fail_msg: "(5) FAIL — expected token 'rollback_verified_previous_source_restored'. got token={{ _se5_token }} markers={{ _se5_markers }}"

        - name: "(5) ASSERT: chart resolution (umbrella #306) + the pre-switch
            baseline capture (umbrella #306 design round #2) ran and helm
            upgrade WAS attempted with the pulled tempdir chart arg,
            --reuse-values, no reset-mode flag, and NONE of the removed
            wait/rollback flags — the upgrade command's own (failed) argv
            is logged exactly like a successful one, since its rc is
            diagnostic only"
          ansible.builtin.slurp:
            src: /tmp/l3-se-5-helm.log
          register: _se5_helm_log_raw

        - name: "(5) parse + isolate the metadata/values/pull/upgrade invocation lines"
          ansible.builtin.set_fact:
            _se5_helm_log_lines: "{{ (_se5_helm_log_raw.content | b64decode).split('\n') | select('!=', '') | list }}"

        - name: "(5) split by invocation kind"
          ansible.builtin.set_fact:
            _se5_metadata_lines: "{{ _se5_helm_log_lines | select('match', '^get metadata ') | list }}"
            _se5_values_lines: "{{ _se5_helm_log_lines | select('match', '^get values ') | list }}"
            _se5_pull_lines: "{{ _se5_helm_log_lines | select('match', '^pull ') | list }}"
            _se5_upgrade_lines: "{{ _se5_helm_log_lines | select('match', '^upgrade ') | reject('equalto', 'upgrade --help') | list }}"
            _se5_rollback_lines: "{{ _se5_helm_log_lines | select('match', '^rollback ') | list }}"

        - name: "(5) assert exactly one metadata read, one baseline values read (call #1 — before the fixtured failure), one pull, one (failed) upgrade attempt, one rollback attempt"
          ansible.builtin.assert:
            that:
              - _se5_metadata_lines | length == 1
              - _se5_values_lines | length >= 1
              - _se5_pull_lines | length == 1
              - _se5_upgrade_lines | length == 1
              - _se5_rollback_lines | length == 1
            fail_msg: "(5) FAIL — expected exactly one metadata/pull/upgrade/rollback call each and at least one values read. got={{ _se5_helm_log_lines }}"

        - name: "(5) extract the pulled tempdir path (random per run — read back from the pull argv itself, not hardcoded)"
          ansible.builtin.set_fact:
            _se5_chart_tmp: "{{ (_se5_pull_lines[0] | regex_search('--untardir (\\S+)', '\\1')) | first }}"

        - name: "(5) assert the failed upgrade attempt still carried the pulled tempdir chart path, --reuse-values, the target flow.id, and NONE of the removed wait/rollback flags"
          ansible.builtin.assert:
            that:
              - _se5_upgrade_lines[0] == ('upgrade mxl-videotest-view ' ~ _se5_chart_tmp ~ '/mxl-fabrics-demo -n mxl --reuse-values --set flow.id=b0ae9cba-a989-4568-ac96-8bd19272c966')
              - "'--wait' not in _se5_upgrade_lines[0]"
              - "'--timeout' not in _se5_upgrade_lines[0]"
              - "'--rollback-on-failure' not in _se5_upgrade_lines[0]"
              - "'--atomic' not in _se5_upgrade_lines[0]"
            fail_msg: >-
              (5) FAIL — expected the failed upgrade attempt to have
              requested the pulled tempdir chart path, --reuse-values, and
              the target flow.id, with NO wait/timeout/rollback-on-failure/
              atomic flags. Got: {{ _se5_upgrade_lines[0] }}

        - name: "(5) assert the rollback argv targeted the receiver's own baseline revision, WITHOUT --wait (rc is diagnostic only, verified via the poll — never trusted)"
          ansible.builtin.assert:
            that:
              - _se5_rollback_lines[0] is match('^rollback mxl-videotest-view [0-9]+ -n mxl$')
            fail_msg: "(5) FAIL — unexpected 'helm rollback' argv (expected no --wait/--timeout): {{ _se5_rollback_lines[0] }}"

        - name: "(5) ASSERT (via real HTTP against the stub): active-source was restored to the PREVIOUS source (source-a) — NEVER the switch target (source-b), proving the failed upgrade command never masqueraded as a bypass of PHASE 2 verify"
          ansible.builtin.uri:
            url: "{{ _se5_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: GET
            return_content: true
            validate_certs: false
          register: _se5_coordinator

        - name: "(5) assert active-source restored to source-a, never source-b"
          ansible.builtin.assert:
            that:
              - _se5_coordinator.json.data['active-source'] == 'source-a'
            fail_msg: "(5) FAIL — active-source={{ _se5_coordinator.json.data['active-source'] | default('<absent>') }}, expected source-a (restored) and NEVER source-b. got={{ _se5_coordinator.json.data }}"

        - name: "(5) ASSERT (via real HTTP against the stub): the facility lock was released"
          ansible.builtin.uri:
            url: "{{ _se5_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(5) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-5.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenario 6: the full, unfaulted happy path — proves the complete
    # sequence reaches the correct final state and releases the lock on
    # the SUCCESS path (not just on failure, which scenarios 1-5 already
    # cover).
    # ════════════════════════════════════════════════════════════════════
    - name: "(6) happy path — start fresh stubs, seed an already-running topology, run the REAL switch playbook to completion"
      vars:
        _se6_run_id: "66666666666666666666666666666666"
      block:
        - name: "(6) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-6.json]
          changed_when: false
          failed_when: false

        - name: "(6) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-se-6.json]
          register: _se6_start
          changed_when: false

        - name: "(6) parse stub URLs"
          ansible.builtin.set_fact:
            _se6_k8s_url: "{{ _se6_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"

        - name: "(6) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-se-6-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _se6_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(6) seed the coordinator ConfigMap with a live PRE-switch state (active-source=source-a)"
          ansible.builtin.uri:
            url: "{{ _se6_k8s_url }}/api/v1/namespaces/mxl/configmaps/"
            method: POST
            body_format: json
            body:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: mxl }
              data:
                active-source: source-a
                target-info: '{"pod_uid": "pre-switch-uid", "start_ts": "1000"}'
                epoch: "pre-switch-uid:1000"
            status_code: [201]

        - name: "(6) seed the receiver's target Deployment, ALREADY at rollout-status
            readiness (umbrella #306 design round #2 — PHASE 2 verify polls
            kubernetes.core.k8s_info for this exact resource;
            receiver_instance-target is the real chart's own Deployment
            name, dmf-media's charts/mxl-fabrics-demo/templates/target.yaml)"
          ansible.builtin.uri:
            url: "{{ _se6_k8s_url }}/apis/apps/v1/namespaces/mxl/deployments/"
            method: POST
            body_format: json
            body:
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: mxl-videotest-view-target, namespace: mxl, generation: 1 }
              spec:
                replicas: 1
                template:
                  spec:
                    containers:
                      - name: status
                        env:
                          - { name: MXL_FLOW_ID, value: b0ae9cba-a989-4568-ac96-8bd19272c966 }
              status:
                observedGeneration: 1
                replicas: 1
                updatedReplicas: 1
                readyReplicas: 1
                availableReplicas: 1
                unavailableReplicas: 0
            status_code: [201]

        - name: "(6) queue the coordinator's target-info/epoch republish (umbrella
            #306 design round #2 — simulates the restarted viewer pod's OWN
            runtime republish, which PHASE 1 clears and only an external
            actor — not this playbook — ever sets again. CONDITIONAL
            (when_absent) on data['target-info'], not a bare FIFO entry —
            switch_read_coordinator.yml's own PRE-quiesce read of this SAME
            ConfigMap sees target-info still SET (the pre-switch value), so
            a bare next-GET-consumes-it queue would let that unrelated
            earlier read silently steal this entry before PHASE 1 ever
            clears anything. The condition only fires once target-info is
            genuinely absent, which happens for the first time on PHASE 2
            verify's own first poll attempt."
          ansible.builtin.uri:
            url: "{{ _se6_k8s_url }}/test-only/get-patch-queue"
            method: POST
            body_format: json
            body:
              kind: ConfigMap
              namespace: mxl
              name: mxl-coordinator
              patches:
                - when_absent: "data.target-info"
                  patch:
                    data:
                      target-info: '{"pod_uid": "post-switch-uid", "start_ts": "2000"}'
                      epoch: "post-switch-uid:2000"
            status_code: [200]

        - name: "(6) create the helm PATH shim dir"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin
            state: directory

        - name: "(6) symlink helm -> stub_helm.sh"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin/helm
            src: "{{ l3_harness_dir }}/stub_helm.sh"
            state: link
            force: true

        - name: "(6) remove any stale helm invocation log from a prior run"
          ansible.builtin.file:
            path: /tmp/l3-se-6-helm.log
            state: absent

        - name: "(6) run the REAL switch playbook to completion (no faults, no
            failures) — l3_switch_quiesce_settle_seconds overridden small
            (still a REAL wait_for sleep, just not the full 10s default) to
            keep this scenario fast; the upgrade/rollback verify budgets
            are left at their real defaults since this run converges on
            PHASE 2 verify's own FIRST poll attempt (both fixtures above
            are already-ready)"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se6_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-b
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se_j1_topology_params_switched_to_b} | to_json }}"
              - -e
              - "l3_request_id={{ _se6_run_id }}"
              - -e
              - l3_switch_quiesce_settle_seconds=1
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-6-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-se-6-helm.log
          register: _se6_run
          changed_when: false
          failed_when: false

        - name: "(6) ASSERT: the REAL playbook run SUCCEEDED"
          ansible.builtin.assert:
            that:
              - _se6_run.rc == 0
            fail_msg: "(6) FAIL — expected a clean success. stdout={{ _se6_run.stdout }}"

        - name: "(6) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token success (umbrella #323 — proves the success emit is genuinely reached and fires exactly once on the happy path; a mutant that drops it, or that emits it BEFORE lock_release such that a later failure could still leave a stray success marker, fails this)"
          ansible.builtin.set_fact:
            _se6_markers: "{{ (_se6_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(6) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se6_markers | length == 1
            fail_msg: "(6) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se6_markers }}"

        - name: "(6) parse the marker's token out of the line — the EXACT fields, never a substring (umbrella #323 fix round, codex gate: `'success' in marker` is also satisfied by a mutant emitting 'not_success', by any kv VALUE containing that word, and by any longer token sharing the prefix — so the old check discriminated almost nothing). detail= is parsed as the FIRST such field, which is why the playbook always renders it immediately after the token: caller-supplied free text (receiver_instance) can only ever appear later in the line and can never splice this value."
          ansible.builtin.set_fact:
            _se6_token: "{{ (_se6_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"

        - name: "(6) ASSERT the parsed enum is EXACTLY token 'success'"
          ansible.builtin.assert:
            that:
              - _se6_token == 'success'
            fail_msg: "(6) FAIL — expected token 'success'. got token={{ _se6_token }} markers={{ _se6_markers }}"

        - name: "(6) ASSERT: chart resolution ran (umbrella #306 — get metadata
            + pull), the pre-switch baseline was captured (umbrella #306
            design round #2 — get values), and helm upgrade ran with the
            pulled tempdir chart arg, --reuse-values, the target source's
            own flow.id, and NONE of the removed wait/rollback flags
            (helm-as-oracle is gone — PHASE 2 verify, asserted below via
            real HTTP, is what actually decided readiness here)"
          ansible.builtin.slurp:
            src: /tmp/l3-se-6-helm.log
          register: _se6_helm_log_raw

        - name: "(6) parse + isolate the metadata/values/pull/upgrade invocation lines"
          ansible.builtin.set_fact:
            _se6_helm_log_lines: "{{ (_se6_helm_log_raw.content | b64decode).split('\n') | select('!=', '') | list }}"

        - name: "(6) split by invocation kind"
          ansible.builtin.set_fact:
            _se6_metadata_lines: "{{ _se6_helm_log_lines | select('match', '^get metadata ') | list }}"
            _se6_values_lines: "{{ _se6_helm_log_lines | select('match', '^get values ') | list }}"
            _se6_pull_lines: "{{ _se6_helm_log_lines | select('match', '^pull ') | list }}"
            _se6_upgrade_lines: "{{ _se6_helm_log_lines | select('match', '^upgrade ') | reject('equalto', 'upgrade --help') | list }}"

        - name: "(6) assert exactly one metadata read, one values read, one pull, one upgrade"
          ansible.builtin.assert:
            that:
              - _se6_metadata_lines | length == 1
              - _se6_values_lines | length == 1
              - _se6_pull_lines | length == 1
              - _se6_upgrade_lines | length == 1
            fail_msg: "(6) FAIL — expected exactly one metadata/values/pull/upgrade call each. got={{ _se6_helm_log_lines }}"

        - name: "(6) assert the metadata read targeted the receiver (never l3_chart_version)"
          ansible.builtin.assert:
            that:
              - _se6_metadata_lines[0] == 'get metadata mxl-videotest-view -n mxl -o json'
            fail_msg: "(6) FAIL — unexpected 'helm get metadata' argv: {{ _se6_metadata_lines[0] }}"

        - name: "(6) assert the pre-switch baseline values read targeted the receiver (umbrella #306 design round #2)"
          ansible.builtin.assert:
            that:
              - _se6_values_lines[0] == 'get values mxl-videotest-view -n mxl -o json'
            fail_msg: "(6) FAIL — unexpected 'helm get values' argv: {{ _se6_values_lines[0] }}"

        - name: "(6) assert the pull used the receiver's OWN installed version (the default stub fixture, 0.4.0)"
          ansible.builtin.assert:
            that:
              - _se6_pull_lines[0] is match('^pull oci://zot\.zot\.svc\.cluster\.local:5000/dmf/charts/mxl-fabrics-demo --version 0\.4\.0 --untar --untardir \S+ --plain-http$')
            fail_msg: "(6) FAIL — unexpected 'helm pull' argv: {{ _se6_pull_lines[0] }}"

        - name: "(6) extract the pulled tempdir path (random per run — read back from the pull argv itself, not hardcoded)"
          ansible.builtin.set_fact:
            _se6_chart_tmp: "{{ (_se6_pull_lines[0] | regex_search('--untardir (\\S+)', '\\1')) | first }}"

        - name: "(6) assert helm upgrade argv carries NONE of the removed wait/rollback flags"
          ansible.builtin.assert:
            that:
              - _se6_upgrade_lines[0] == ('upgrade mxl-videotest-view ' ~ _se6_chart_tmp ~ '/mxl-fabrics-demo -n mxl --reuse-values --set flow.id=b0ae9cba-a989-4568-ac96-8bd19272c966')
              - "'--wait' not in _se6_upgrade_lines[0]"
              - "'--timeout' not in _se6_upgrade_lines[0]"
              - "'--rollback-on-failure' not in _se6_upgrade_lines[0]"
              - "'--atomic' not in _se6_upgrade_lines[0]"
            fail_msg: >-
              (6) FAIL — expected the viewer's helm upgrade to carry the
              pulled tempdir chart path, --reuse-values, and the target
              flow.id, with NO wait/timeout/rollback-on-failure/atomic
              flags. Got: {{ _se6_upgrade_lines[0] }}

        - name: "(6) ASSERT: the pulled chart tempdir was removed after the run (the playbook's own outer always: cleanup, umbrella #306)"
          ansible.builtin.stat:
            path: "{{ _se6_chart_tmp }}"
          register: _se6_chart_tmp_stat

        - name: "(6) assert chart tempdir cleaned up"
          ansible.builtin.assert:
            that:
              - not _se6_chart_tmp_stat.stat.exists
            fail_msg: "(6) FAIL — expected the pulled chart tempdir to be removed after the run, still present at {{ _se6_chart_tmp }}"

        - name: "(6) ASSERT (via real HTTP against the stub): active-source now reflects the switch target, AND target-info/epoch are the FRESH (post-switch) values PHASE 2 verify polled for — never the stale pre-switch ones (umbrella #306 design round #2's own step 8 final readback, proved here via an independent HTTP read)"
          ansible.builtin.uri:
            url: "{{ _se6_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: GET
            return_content: true
            validate_certs: false
          register: _se6_coordinator

        - name: "(6) assert final coordinator state"
          ansible.builtin.assert:
            that:
              - _se6_coordinator.json.data['active-source'] == 'source-b'
              - "_se6_coordinator.json.data['target-info'] == '{\"pod_uid\": \"post-switch-uid\", \"start_ts\": \"2000\"}'"
              - _se6_coordinator.json.data['epoch'] == 'post-switch-uid:2000'
            fail_msg: "(6) FAIL — expected active-source=source-b with FRESH (post-switch) target-info/epoch, got {{ _se6_coordinator.json.data }}"

        - name: "(6) ASSERT (via real HTTP against the stub): the facility lock was released on the SUCCESS path"
          ansible.builtin.uri:
            url: "{{ _se6_k8s_url }}/api/v1/namespaces/nmos/configmaps/dmf-facility-lock"
            method: GET
            status_code: [404]
            validate_certs: false
      always:
        - name: "(6) stop stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-6.json]
          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenarios 7/8/9: umbrella #306 design round #2's own THREE
    # discriminating scenarios (frozen design, gate contract) — each
    # proves helm-as-oracle is genuinely gone: `helm upgrade` rc=0 no
    # longer means "ready", and `helm rollback` rc=0 no longer means
    # "restored". All three share the same receiver Deployment resource
    # name (mxl-videotest-view-target — dmf-media's own charts/
    # mxl-fabrics-demo/templates/target.yaml) and the SAME small budget
    # overrides (l3_switch_quiesce_settle_seconds=1,
    # l3_switch_upgrade_verify_timeout_seconds=1,
    # l3_switch_verify_poll_delay_seconds=1 — so PHASE 2 verify always
    # exhausts in exactly TWO fast attempts ((1 // 1) + 1 = 2 — see the
    # playbook's own TIMING CONTRACT comment for why +1), since none of
    # these three scenarios ever wants the UPGRADE itself to succeed) and
    # differ only
    # in l3_switch_rollback_verify_timeout_seconds and their Deployment/
    # coordinator GET-time patch-queue fixtures (STATE["get_patch_queues"]
    # — see stub_k8s_api.py's own _apply_get_patch_queue docstring).
    #
    # The Deployment queue is a BARE (unconditional) FIFO — this resource
    # has exactly two readers in a real run (switch_poll_upgrade_ready.yml,
    # then switch_poll_rollback_verify.yml, strictly in that order, never
    # interleaved with anything else) — so entries are queued in the EXACT
    # chronological order those two pollers will consume them: one
    # "still not ready" filler per PHASE 2 verify attempt (always exactly
    # 2, given the override above), then whatever the rollback side needs.
    # The coordinator ConfigMap queue, by contrast, uses the CONDITIONAL
    # (when_absent) form throughout — switch_read_coordinator.yml's own
    # PRE-quiesce read of the SAME ConfigMap would otherwise silently
    # steal a bare FIFO entry before PHASE 1 ever clears anything (the
    # exact bug scenario 6 caught live during this PR's own gate).
    # ════════════════════════════════════════════════════════════════════
    - name: "(7) helm upgrade rc=0 but the Deployment never converges — PHASE 2 verify must roll back (never select the target); rollback converges IMMEDIATELY, so the job fails rollback_verified previous_source_restored"
      vars:
        _se7_run_id: "77777777777777777777777777777777"
      block:
        - name: "(7) stop any stale stub servers"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/stop_stubs.py", --pidfile, /tmp/l3-se-7.json]
          changed_when: false
          failed_when: false

        - name: "(7) start stubs"
          ansible.builtin.command:
            argv: [python3, "{{ l3_harness_dir }}/start_stubs.py", --pidfile, /tmp/l3-se-7.json]
          register: _se7_start
          changed_when: false

        - name: "(7) parse stub URLs"
          ansible.builtin.set_fact:
            _se7_k8s_url: "{{ _se7_start.stdout_lines | select('match', '^K8S_STUB_URL=') | first | regex_replace('^K8S_STUB_URL=', '') }}"

        - name: "(7) write a minimal kubeconfig pointed at this scenario's own K8s stub"
          ansible.builtin.copy:
            dest: /tmp/l3-se-7-kubeconfig.yaml
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: {{ _se7_k8s_url }}
                  insecure-skip-tls-verify: true
                name: l3-stub
              contexts:
              - context:
                  cluster: l3-stub
                  user: l3-stub
                name: l3-stub
              current-context: l3-stub
              users:
              - name: l3-stub
                user:
                  token: fake-test-token

        - name: "(7) seed the coordinator ConfigMap with a live PRE-switch state (active-source=source-a)"
          ansible.builtin.uri:
            url: "{{ _se7_k8s_url }}/api/v1/namespaces/mxl/configmaps/"
            method: POST
            body_format: json
            body:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: mxl }
              data:
                active-source: source-a
                target-info: '{"pod_uid": "pre-switch-uid", "start_ts": "1000"}'
                epoch: "pre-switch-uid:1000"
            status_code: [201]

        - name: "(7) seed the receiver's target Deployment, NEVER reaching rollout-status readiness (helm upgrade rc=0'd, per the helm log below, but the pod never converges — exactly the job-413 shape this whole design round exists to catch)"
          ansible.builtin.uri:
            url: "{{ _se7_k8s_url }}/apis/apps/v1/namespaces/mxl/deployments/"
            method: POST
            body_format: json
            body:
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: mxl-videotest-view-target, namespace: mxl, generation: 2 }
              spec:
                replicas: 1
                template:
                  spec:
                    containers:
                      - name: status
                        env:
                          - { name: MXL_FLOW_ID, value: b0ae9cba-a989-4568-ac96-8bd19272c966 }
              status:
                observedGeneration: 1
                replicas: 1
                updatedReplicas: 0
                readyReplicas: 0
                availableReplicas: 0
                unavailableReplicas: 1
            status_code: [201]

        - name: "(7) queue the Deployment's OWN trajectory: still-not-ready for PHASE 2 verify's own attempts (2, per l3_switch_upgrade_verify_timeout_seconds=1 / l3_switch_verify_poll_delay_seconds=1 -> (1 // 1) + 1 = 2, the FULL documented window — see the playbook's own TIMING CONTRACT comment for why +1), THEN converged (rolled back to the pre-switch flow.id) for the rollback verify's FIRST attempt — proves rollback converging IMMEDIATELY still requires actual verification, not a bare rc=0"
          ansible.builtin.uri:
            url: "{{ _se7_k8s_url }}/test-only/get-patch-queue"
            method: POST
            body_format: json
            body:
              kind: Deployment
              namespace: mxl
              name: mxl-videotest-view-target
              patches:
                - status: { observedGeneration: 1, updatedReplicas: 0, readyReplicas: 0, availableReplicas: 0, unavailableReplicas: 1 }
                - status: { observedGeneration: 1, updatedReplicas: 0, readyReplicas: 0, availableReplicas: 0, unavailableReplicas: 1 }
                - status: { observedGeneration: 2, updatedReplicas: 1, readyReplicas: 1, availableReplicas: 1, unavailableReplicas: 0 }
                  spec:
                    template:
                      spec:
                        containers:
                          - name: status
                            env:
                              - { name: MXL_FLOW_ID, value: 5fbec3b1-1b0f-417d-9059-8b94a47197ed }
            status_code: [200]

        - name: "(7) queue the coordinator's target-info/epoch republish (conditional — see this file's own header for why bare FIFO would be wrong here)"
          ansible.builtin.uri:
            url: "{{ _se7_k8s_url }}/test-only/get-patch-queue"
            method: POST
            body_format: json
            body:
              kind: ConfigMap
              namespace: mxl
              name: mxl-coordinator
              patches:
                - when_absent: "data.target-info"
                  patch:
                    data:
                      target-info: '{"pod_uid": "rollback-restored-uid", "start_ts": "3000"}'
                      epoch: "rollback-restored-uid:3000"
            status_code: [200]

        - name: "(7) create the helm PATH shim dir"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin
            state: directory

        - name: "(7) symlink helm -> stub_helm.sh"
          ansible.builtin.file:
            path: /tmp/l3-harness-bin/helm
            src: "{{ l3_harness_dir }}/stub_helm.sh"
            state: link
            force: true

        - name: "(7) remove any stale helm invocation log from a prior run"
          ansible.builtin.file:
            path: /tmp/l3-se-7-helm.log
            state: absent

        - name: "(7) run the REAL switch playbook — helm upgrade succeeds (rc=0) but the Deployment fixture never converges within PHASE 2 verify's own (overridden, fast) budget"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - "{{ playbook_dir }}/../playbooks/switch-mxl-fabrics-demo.yml"
              - -e
              - "l3_kube_api_url={{ _se7_k8s_url }}"
              - -e
              - l3_kube_api_token=fake-test-token
              - -e
              - l3_kube_api_validate_certs=false
              - -e
              - receiver_instance=mxl-videotest-view
              - -e
              - source_instance=source-b
              - -e
              - reason=test switch
              - -e
              - "{{ {'topology_params': _se_j1_topology_params_switched_to_b} | to_json }}"
              - -e
              - "l3_request_id={{ _se7_run_id }}"
              - -e
              - l3_switch_quiesce_settle_seconds=1
              - -e
              - l3_switch_upgrade_verify_timeout_seconds=1
              - -e
              - l3_switch_verify_poll_delay_seconds=1
              - -e
              - l3_switch_rollback_verify_timeout_seconds=3
            chdir: "{{ playbook_dir }}/.."
          environment:
            L3_TESTMODE: "1"
            KUBECONFIG: /tmp/l3-se-7-kubeconfig.yaml
            PATH: "/tmp/l3-harness-bin:{{ lookup('env', 'PATH') }}"
            L3_STUB_HELM_LOG: /tmp/l3-se-7-helm.log
          register: _se7_run
          changed_when: false
          failed_when: false

        - name: "(7) ASSERT: the job FAILED with rollback_verified previous_source_restored (never a bare success, and never rollback_verification_failed — the rollback DID converge)"
          ansible.builtin.assert:
            that:
              - _se7_run.rc != 0
              - "'rollback_verified previous_source_restored:' in _se7_run.stdout"
              - "'rollback_verification_failed:' not in _se7_run.stdout"
            fail_msg: "(7) FAIL — expected rollback_verified previous_source_restored. stdout={{ _se7_run.stdout }}"

        - name: "(7) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker, token rollback_verified_previous_source_restored (umbrella #323 — this is the MINIMUM-coverage scenario named in the issue; asserts on the STRUCTURED event, not merely the legacy prefix above)"
          ansible.builtin.set_fact:
            _se7_markers: "{{ (_se7_run.stdout_lines | select('match', '.*DMF_L3_SWITCH_OUTCOME:.*') | list) }}"

        - name: "(7) assert exactly ONE marker was emitted (a terminal exit that emits none, or two, fails here)"
          ansible.builtin.assert:
            that:
              - _se7_markers | length == 1
            fail_msg: "(7) FAIL — expected exactly one DMF_L3_SWITCH_OUTCOME marker, got: {{ _se7_markers }}"

        - name: "(7) parse the marker's token out of the line — the EXACT fields, never a substring (umbrella #323 fix round, codex gate: `'rollback_verified_previous_source_restored' in marker` is also satisfied by a mutant emitting 'not_rollback_verified_previous_source_restored', by any kv VALUE containing that word, and by any longer token sharing the prefix — so the old check discriminated almost nothing). detail= is parsed as the FIRST such field, which is why the playbook always renders it immediately after the token: caller-supplied free text (receiver_instance) can only ever appear later in the line and can never splice this value."
          ansible.builtin.set_fact:
            _se7_token: "{{ (_se7_markers[0] | regex_search('DMF_L3_SWITCH_OUTCOME: [A-Za-z0-9_]+') | default('DMF_L3_SWITCH_OUTCOME: <unparsed>', true)) | regex_replace('^DMF_L3_SWITCH_OUTCOME: ', '') }}"

        - name: "(7) ASSERT the parsed enum is EXACTLY token 'rollback_verified_previous_source_restored'"
          ansible.builtin.assert:
            that:
              - _se7_token == 'rollback_verified_previous_source_restored'
              - "'restored_active_source=source-a' in _se7_markers[0]"
              - "'receiver_instance=mxl-videotest-view' in _se7_markers[0]"
            fail_msg: "(7) FAIL — expected token 'rollback_verified_previous_source_restored'. got token={{ _se7_token }} markers={{ _se7_markers }}"

        - name: "(7) ASSERT (via real HTTP against the stub): active-source was restored to the PREVIOUS source (source-a) — NEVER the switch target (source-b). This is the discriminating proof itself: the OLD (pre-#306-round-2) play never read the Deployment at all, so a helm rc=0 with a never-converging pod would have sailed straight to PHASE 3 and set active-source=source-b."
          ansible.builtin.uri:
            url: "{{ _se7_k8s_url }}/api/v1/namespaces/mxl/configmaps/mxl-coordinator"
            method: GET
            return_content: true
            validate_certs: false
          register: _se7_coordinator

        - name: "(7) assert active-source restored to source-a, never source-b"
          ansible.builtin.assert:
            that:
              - _se7_coordinator.json.data['active-source'] == 'source-a'
