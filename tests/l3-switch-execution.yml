            fail_msg: "(11) FAIL — expected the unchanged legacy rollback_verified message. stdout={{ _se11_run.stdout }}"

        - name: "(11) ASSERT: exactly ONE DMF_L3_SWITCH_OUTCOME marker (umbrella #323 fix round, codex gate P2a)"
