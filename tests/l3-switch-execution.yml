        - name: "(11) ASSERT the parsed enum is EXACTLY token 'rollback_verified_no_previous_source', carrying NO restored_active_source field — the pre-fix play emitted rollback_verified_previous_source_restored here with an EMPTY restored_active_source, which is the false claim this scenario exists to prevent"
          ansible.builtin.assert:
