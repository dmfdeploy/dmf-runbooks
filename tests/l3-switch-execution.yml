          (scenario 1) and a source_instance/viewer.source_selection mismatch
          (scenario 2) — both with the facility lock confirmed 404 via real HTTP.
          A missing coordinator ConfigMap (scenario 3) refuses AFTER a brief lock
          hold, proving the lock still releases for a post-lock, pre-mutation
          refusal. Scenario 4's three staged fault injections (post-switch-lock,
          post-switch-quiesce, post-switch-repoint) each assert the EXACT
          intermediate coordinator/helm state at that boundary — a reordered
          mutant (select-before-repoint, repoint-before-quiesce, or any
          skipped phase) fails at least one of these three assertions, and the
          facility lock is confirmed released after every one. Scenario 5
          proves the PHASE 2 helm upgrade COMMAND ITSELF failing outright
          (rc!=0) is diagnostic-only, not a bypass — it still flows into
          PHASE 2 verify exactly like a rc=0 upgrade whose Deployment never
          converges (scenario 7), so verification decides the outcome,
          never the bare rc: the play rolls back, verifies the rollback,
          restores the previous active-source (source-a, never the switch
          target), and still fails the job (rollback_verified
          previous_source_restored), with the facility lock released
          through the SAME generic rescue as any other failure. Scenario 6 proves the
          full, unfaulted sequence reaches the correct final state
          (active-source = the switch target, WITH fresh post-switch
          target-info/epoch, never the stale pre-switch values) and
          releases the lock on the SUCCESS path too. Scenarios 4c, 5, and 6
          (umbrella #306) also assert the FULL helm invocation sequence —
          get metadata (never the l3_chart_version pin), the pre-switch
          baseline's own get values (umbrella #306 design round #2), pull
          to a tempdir, then upgrade carrying that exact tempdir chart
          path, --reuse-values, and the target's flow.id — with NONE of
          --wait/--timeout/--rollback-on-failure/--atomic (helm-as-oracle
          is gone) — against stub_helm.sh's own hardened `[RELEASE]
          [CHART]` two-positional contract, the enforcement that was
          missing when AWX job 321 became this playbook's first, and first
          FAILED, live invocation. Scenario 4b additionally proves chart
          resolution + the pre-switch baseline capture now both run (and
          are visible in the helm log) BEFORE phase 1 quiesce, while phase
          2 has genuinely not run yet. Scenario 6 also proves the pulled
          chart tempdir is removed after the run.

          Scenarios 7/8/9 (umbrella #306 design round #2's own frozen gate
          contract) prove helm-as-oracle is genuinely gone, each via a
          REAL kubernetes.core.k8s_info Deployment fixture the OLD
          (pre-round-2) play never once queried: (7) helm upgrade rc=0 but
          the Deployment never reaches rollout-status readiness — PHASE 2
          verify (not helm's own --wait) catches this, rolls back, verifies
          the rollback via all four pass criteria on its very FIRST poll,
          restores the previous active-source (source-a), and STILL fails
          the job (rollback_verified previous_source_restored) — active-
          source is NEVER the switch target. (8) the same upgrade-never-
          converges shape, but the rollback itself needs a SECOND poll to
          confirm (the exact job-413 edge: helm's own rollback --wait
          window can expire a beat before the real convergence lands) —
          proves this playbook genuinely POLLS for verification rather than
          trusting a single read or helm's own rc, with the SAME
          rollback_verified outcome once confirmed. (9) the rollback itself
          never converges either — active-source stays absent (no restore
          attempted, and never the target), the lock still releases, and
          the job fails rollback_verification_failed, never
          rollback_verified. All three assert the coordinator's
          active-source directly via real HTTP, which is what actually
          discriminates: an old-play mutant that never learned to poll the
          Deployment would sail straight to PHASE 3 on scenario 7/8's
          fixtures and set active-source=source-b — these three scenarios
          exist specifically so that cannot happen silently again.

          Umbrella #323: EVERY scenario that runs the real playbook
          (1, 2, 3, 4a, 4b, 4c, 5, 6, 7, 8, 9, 10, 11, 12a, 12b, 12c —
          i.e. all of them except scenario 0, which probes stub_helm.sh
          directly and never starts a play) asserts on the
          DMF_L3_SWITCH_OUTCOME structured event, never merely the legacy
          stdout prefixes: exactly one marker per run, and the enum compared
          EXACTLY. The token is parsed out of the line with a regex capture
          and compared for equality — the fix round replaced the earlier
          `'refused' in marker` substring checks, which a mutant emitting
          'not_refused' (or any longer token sharing the prefix, or any kv
          VALUE containing the word) satisfied just as well. Coverage:
          refused for 1/2/3/4a/4b/4c's pre-PHASE-2 refusal paths, each ALSO
          asserting the exact detail= stage the run died in (pre-lock,
          pre-lock, coordinator-read, coordinator-read, quiesce, repoint) so
          the stage vocabulary is proven wired, not merely present; success
          for scenario 6's happy path;
          rollback_verified_previous_source_restored for 5/7/8;
          rollback_verified_no_previous_source for 11 (the fix round's own
          P2a split — 7 and 11 differ ONLY in whether the pre-switch
          coordinator had an active-source, and a substring check could not
          have told the two tokens apart at all, since one is a prefix of
          the other); rollback_verification_failed for 9 and 10. A mutant
          that drops the event, double-emits across the PHASE-2-verify-
          failed branch and the rescue's own catch-all, or reports the wrong
          enum fails here even though the legacy prefix text — kept
          byte-for-byte unchanged for dmf-cms's #320 bridge, and asserted
          unchanged on BOTH verified-rollback exits — still passes.

          Umbrella #323 fix round (codex adversarial gate P1): scenarios
          12a/12b/12c prove the structured event cannot be written by its
          own caller. Ansible extra_vars outrank task vars, set_fact and
          register alike, so before this round a dispatcher could either
          SILENCE the event (-e _switch_outcome_emitted=true skipped the
          only outcome task in the play, emitting nothing at all) or DICTATE
          it (-e l3_switch_outcome_token=... rendered "DMF_L3_SWITCH_OUTCOME:
          attacker_token attacker_detail=1" as the run's own outcome) — and
          could do so precisely BECAUSE the reserved-var refusal path ran
          through the shadowed names. Each scenario runs the real playbook
          with an otherwise perfectly valid switch request plus one spoof
          shape (12a the sentinel, 12b the emitter token/kv, 12c all three
          at once with the sentinel set FALSE and a forged _switch_stage —
          the shape that defeats a naive sentinel-setting fix and an
          unguarded detail= source), and each asserts the SAME outcome:
          exactly one event, token EXACTLY 'refused', detail EXACTLY
          'reserved-var', no attacker string anywhere in it, and no
          run_id/request_id/receiver_instance fields at all — that absence
          being the positive proof the event came from the hard-coded
          literal emitter rather than the caller-parameterised one. All
          three also confirm, over real HTTP, that the seeded coordinator
          ConfigMap is byte-identical afterwards and the facility lock was
          never created.
