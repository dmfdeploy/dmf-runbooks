          changed_when: false
          failed_when: false

    # ════════════════════════════════════════════════════════════════════
    # Scenarios 12a/12b/12c: umbrella #323 fix round, codex adversarial gate
    # P1 — OUTCOME-EVENT SPOOFING. The structured event exists so the console
    # can trust a machine-readable statement of what a run did. That is only
    # worth anything if the CALLER cannot write that statement themselves.
    #
    # The attack surface is Ansible's own precedence table: extra_vars sit at
    # the TOP of it, outranking play vars, block/task vars, an include_role's
    # own `vars:`, set_fact AND register alike. Every catalog job template
    # has ask_variables_on_launch=true (dmf-infra awx-integration), so any
    # name the emission path reads is a name a dispatcher can supply. This
    # was verified empirically for this fix round rather than taken from the
    # docs — a throwaway play confirmed `-e tok=X` beats both an include_role
    # `vars: tok:` and a set_fact of the same name, and that `-e sent=true`
    # turns `when: not (sent | default(false))` into a skip.
    #
    # The pre-fix play was therefore steerable two ways, and BOTH are
    # reproduced here against the REAL playbook:
    #   (12a) -e _switch_outcome_emitted=true  — the reserved-var assert
    #         fires, the run lands in the outer rescue, and the catch-all's
    #         own `when:` is now false: the ONLY outcome task in the play is
    #         SKIPPED. Pre-fix result: a terminal exit emitting NO event at
    #         all — the console's worst case, since silence is indistinguish-
    #         able from a marker it failed to read.
    #   (12b) -e l3_switch_outcome_token=... -e l3_switch_outcome_kv=... —
    #         same refusal, but the catch-all renders the ATTACKER's strings.
    #         Pre-fix result, verbatim: "DMF_L3_SWITCH_OUTCOME: attacker_token
    #         attacker_detail=1".
    #   (12c) all three names at once, with the sentinel set to FALSE and a
    #         forged _switch_stage — the shape that defeats a naive fix.
    #         Setting the sentinel false is what breaks any design that
    #         "just" makes the guard set the sentinel before failing (the
    #         extra_var still outranks that set_fact, so the outer rescue
    #         would fire a SECOND, forged marker on top of the honest one),
    #         and the forged stage is what breaks a detail= built from an
    #         unguarded stage fact.
    #
    # What all three must now produce is the SAME thing: exactly one event,
    # token EXACTLY `refused`, detail EXACTLY `reserved-var`, and — the
    # positive proof that it came from the hard-coded literal emitter rather
    # than the caller-parameterised one — NO run_id/request_id/
    # receiver_instance fields at all, since _emit_switch_refused_literal.yml
    # renders none. Each also proves nothing was touched: the coordinator
    # ConfigMap is byte-identical afterwards and the facility lock was never
    # created.
