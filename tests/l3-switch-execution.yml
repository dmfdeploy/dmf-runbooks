              - "'restored_active_source' not in _se11_markers[0]"
              - "'receiver_instance=mxl-videotest-view' in _se11_markers[0]"
            fail_msg: "(11) FAIL — expected token 'rollback_verified_no_previous_source'. got token={{ _se11_token }} markers={{ _se11_markers }}"

        - name: "(11) ASSERT (via real HTTP against the stub): active-source is still ABSENT — the restore task was correctly skipped, and it is NEVER the switch target"
          ansible.builtin.uri:
