        - name: "(11) assert active-source absent"
          ansible.builtin.assert:
            that:
              - "'active-source' not in (_se11_coordinator.json.data | default({}))"
            fail_msg: "(11) FAIL — active-source={{ _se11_coordinator.json.data['active-source'] | default('<absent>') }}, expected absent (there was no previous source to restore). got={{ _se11_coordinator.json.data }}"

        - name: "(11) ASSERT (via real HTTP against the stub): the facility lock was released"
