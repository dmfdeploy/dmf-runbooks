---
# MXL Hello demo - Configure: Launch single-node workload
# Simplified from mxl-fabrics-demo: no coordinator, no role/placement vars.
- name: MXL hello single-node configure - launch workload
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mxl_namespace: mxl
    mxl_release: mxl-hello
    mxl_chart_name: mxl-hello
    mxl_chart_version: "0.1.0"
    mxl_chart_ref: "oci://zot.zot.svc.cluster.local:5000/dmf/charts/mxl-hello"
    mxl_chart_local: ""
  tasks:
    - name: Ensure MXL namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ mxl_namespace }}"
        state: present

    - name: Deploy MXL Hello Helm chart from Zot or local path
      block:
        - name: Create temporary MXL chart directory
          ansible.builtin.tempfile:
            state: directory
            suffix: mxl-hello-chart
          register: _mxl_chart_tmp
          changed_when: false
          when: mxl_chart_local | trim == ""

        - name: Pull MXL Hello Helm chart from plain-HTTP Zot
          ansible.builtin.command:
            argv:
              - helm
              - pull
              - "{{ mxl_chart_ref }}"
              - --version
              - "{{ mxl_chart_version }}"
              - --untar
              - --untardir
              - "{{ _mxl_chart_tmp.path }}"
              - --plain-http
          changed_when: false
          when: mxl_chart_local | trim == ""

        - name: Install or upgrade MXL Hello Helm release
          ansible.builtin.command:
            argv:
              - helm
              - upgrade
              - --install
              - "{{ mxl_release }}"
              - "{{ mxl_chart_local | trim if (mxl_chart_local | trim) else _mxl_chart_tmp.path ~ '/' ~ mxl_chart_name }}"
              - -n
              - "{{ mxl_namespace }}"
              - --set
              - createNamespace=false
          changed_when: true

        - name: Wait for MXL Hello Deployment to be Ready
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: Deployment
            name: "{{ mxl_release }}"
            namespace: "{{ mxl_namespace }}"
          register: _mxl_workload
          until:
            - _mxl_workload.resources | length > 0
            - _mxl_workload.resources[0].status.readyReplicas | default(0) == (_mxl_workload.resources[0].spec.replicas | default(1))
          retries: 30
          delay: 10
      always:
        - name: Remove temporary MXL chart directory
          ansible.builtin.file:
            path: "{{ _mxl_chart_tmp.path | default('') }}"
            state: absent
          changed_when: false
          when: _mxl_chart_tmp.path is defined
