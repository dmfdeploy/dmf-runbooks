---
# MXL Fabrics demo - Configure: Launch workloads
# Generic source/view launcher for the split MXL demo functions.
- name: MXL fabrics demo configure - launch workloads
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # umbrella #202 WP3 R6a (codex round-5 P1-1/P1-2, replacing R5a-2's
    # broken post-hoc consistency assert): TRUE single source. ONE play-
    # scope definition per identity/render value below — the gate
    # (l3_run_guard's capacity.yml render + snapshot.yml, included
    # dynamically below with no vars: forwarding) sees these exact names
    # via ordinary play-var scope, and this playbook's own install step
    # further down reads the SAME names directly. See launch-nmos-cpp.yml's
    # own header comment for the full mechanism explanation.
    l3_release: mxl-videotestsrc
    l3_target_namespace: mxl
    l3_catalog_key: mxl-videotestsrc
    # Base chart repository — the pull task appends {{ l3_chart_name }}.
    # (Was the full chart ref, which doubled the name in the pull URL and
    # could never resolve — latent since the chart was never published.)
    l3_chart_ref: "oci://zot.zot.svc.cluster.local:5000/dmf/charts"
    # umbrella #201 WP3: bumped 0.2.1 -> 0.4.0 for the WP2 per-source
    # flow.id/pattern/sourceId values + active-source supervisor gate this
    # playbook's topology mode now depends on (charts/mxl-fabrics-demo,
    # dmf-media). dmf-infra's own JT extra_vars pin (0.3.1) and the 630 seed
    # digest are REPORT-ONLY — out of scope here, already reported.
    l3_chart_version: "0.4.0"
    l3_chart_local: ""
    l3_chart_name: mxl-fabrics-demo
    mxl_role: source
    mxl_interface: eth0
    mxl_image_tag: v1.0.3
    # single-node = colocated pair on one node over the pod network;
    # split-node = the original cross-host hostNetwork shape (chart default).
    # AWX JT extra_vars derive this from the env release profile.
    mxl_placement_mode: split-node
    # The chart's node-reader ClusterRole/Binding are cluster-scoped; the
    # namespaced catalog launcher cannot create them. Platform bootstrap
    # (awx-integration) pre-creates the equivalent, so the AWX lane launches
    # with false. Set true only for standalone out-of-cluster helm use.
    mxl_node_access_create: false
    # umbrella #202 WP3 R6b (codex round-6, umbrella #267): as of R6b,
    # roles/mxl/defaults/main.yml's own netbox_service_name / app:<> tag /
    # monitoring cluster_service+cluster_namespace read l3_catalog_key/
    # l3_release/l3_target_namespace DIRECTLY (falling back to
    # mxl_function_key/mxl_release/mxl_namespace only for a standalone,
    # non-L3-gated use of the role) — so these three aliases no longer
    # affect NetBox identity at all while the L3 gate is in play (R6a's
    # "R6a scope boundary" caveat that used to live in this comment is
    # CLOSED: forging mxl_function_key/mxl_release/mxl_namespace directly
    # via extra_vars now has NO effect on what gets mutated, since the role
    # doesn't read them for identity purposes anymore when l3_* is
    # defined). Kept here only because roles/mxl/tasks/*.yml still
    # reference mxl_function_key/mxl_release/mxl_namespace in task NAMES
    # and mxl_service_description (cosmetic labels, not identity) — these
    # aliases keep those labels accurate and in sync with the single
    # source, nothing more.
    mxl_function_key: "{{ l3_catalog_key }}"
    mxl_release: "{{ l3_release }}"
    mxl_namespace: "{{ l3_target_namespace }}"
    # umbrella #202 WP3-A: the SAME --set values the install task below
    # passes to `helm upgrade --install` — reused for the L3 capacity
    # preflight's `helm template` recompute so it evaluates the chart this
    # play is actually about to install, not a stale approximation.
    l3_chart_set_values:
      - "createNamespace=false"
      - "role={{ mxl_role }}"
      - "fabrics.interface={{ mxl_interface }}"
      - "image.tag={{ mxl_image_tag }}"
      - "placementMode={{ mxl_placement_mode }}"
      - "nodeAccess.create={{ mxl_node_access_create | bool | lower }}"
    # umbrella #201 WP3 — topology mode. l3_run_guard's topology_validate.yml
    # stage activates PURELY on whether a topology_params extra_var was
    # supplied (fix-round D1 — no separate required-flag; see that file's
    # own header for the forgery a computed mxl_role-based flag was
    # vulnerable to). By ratified design (umbrella #201) the VIEW-role
    # invocation is the one that carries topology_params end-to-end (spec
    # §3.2/§5): it stays the run's own scalar l3_release/l3_catalog_key
    # identity ("+1 viewer release unchanged", the settled decision) AND
    # additionally derives l3_release_group (the N source releases) from
    # topology_params.sources[]. mxl-videotestsrc's own JT/catalog entry
    # plays no further role once a topology launch is live (its sources are
    # provisioned BY the view-role run instead) — its own scalar path is
    # untouched regardless of what any extra_var claims, UNLESS the source
    # entry's own topology_ref is still live in the catalog, see
    # l3_topology_forbidden_for_this_entry below.
    # The common per-source chart values EVERY topology source release
    # needs (mirrors this play's own l3_chart_set_values, minus role/flow.id/
    # pattern/sourceId — l3_topology_release_group derives those four from
    # each sources[] entry itself, see roles/l3_run_guard/filter_plugins/
    # l3_topology.py).
    l3_topology_source_base_set_values:
      - "createNamespace=false"
      - "fabrics.interface={{ mxl_interface }}"
      - "image.tag={{ mxl_image_tag }}"
      - "placementMode={{ mxl_placement_mode }}"
      - "nodeAccess.create={{ mxl_node_access_create | bool | lower }}"
    # umbrella #201 WP3 fix-round D3 — scalar-source semantics: chart 0.4.0's
    # source-handshake.yaml gates the initiator on
    # `active-source == own sourceId` (WP2's new supervisor entry gate), so a
    # SCALAR (non-topology) source launch — the pre-topology demo's own
    # walked flow, runbook #203: deploy source, deploy viewer, preview works
    # — would now park forever with no topology_params in sight, unless THIS
    # release supplies its own sourceId and self-selects. sourceId=l3_release
    # is the only sensible identity a scalar source has (there is no
    # sources[].id to borrow from). Feeds l3_chart_extra_set_values, the
    # role's own generic extension point (l3_run_guard/defaults/main.yml) —
    # capacity.yml folds this into the SAME _l3_effective_chart_set_values
    # every other value rides (D2), so capacity's render and the install
    # step never diverge on this either. Empty (a no-op) for the view-role
    # invocation, topology or scalar — sourceId is meaningless for role=view
    # (chart values.yaml's own comment).
    l3_chart_extra_set_values: "{{ ['sourceId=' ~ l3_release] if mxl_role == 'source' else [] }}"
    # umbrella #201 WP3 fix-round D4: opts this launcher into
    # snapshot.yml's coordinator-state capture + rollback's own restore/
    # remove — l3_run_guard's role default is empty (a no-op); only mxl
    # sets this, to the SAME coordinator ConfigMap the launch tasks below
    # read/patch.
    l3_coordinator_configmap_name: mxl-coordinator
    # umbrella #201 WP3 fix-round addendum (codex cross-WP FAIL, superseding
    # the earlier WP3 pass): with topology_ref still attached to the SOURCE
    # catalog entry too (dmf-media#22, pending cleanup — the ratified design
    # is viewer-only), a source-role console deploy would ALSO carry
    # topology_params today, and D1's own presence-keyed gate would then
    # validate + derive a release group + patch active-source for it — a
    # HALF-topology mutation (no paired viewer install). This declares the
    # mxl-specific meaning of "wrong entry" for l3_run_guard's own GENERIC
    # coherence guard (l3_run_guard/defaults/main.yml,
    # l3_topology_forbidden_for_this_entry — false/no-op by default, this
    # is the only caller that sets it): a source-role invocation must NEVER
    # carry topology_params. MISCONFIGURATION protection, NOT a forgery
    # barrier — mxl_role is itself an ordinary, extra-vars-shadowable input
    # (same as l3_release/l3_catalog_key throughout this whole file), so
    # this guard cannot be the adversarial anchor against a deliberate
    # attacker; that anchor remains WP3a's own delivery guarantee (only a
    # genuine viewer-entry deploy's launch seam attaches topology_params)
    # plus the dmf-media#22 catalog cleanup that removes topology_ref from
    # the source entry entirely. This guard's job is narrower and more
    # honest: catch today's KNOWN stale catalog wiring before #22 lands,
    # loudly and safely, rather than silently mutating the wrong entry.
    l3_topology_forbidden_for_this_entry: "{{ mxl_role == 'source' }}"
  tasks:
    - name: "L3 gate through terminal — ONE outer block/rescue/always (R4a
        Backbone, codex round-3 P1-3/P1-11: main.yml's own stages
        (identity->preflight->lock->snapshot->capacity) used to run
        OUTSIDE any block — an exception there had nothing to catch it
        and leaked the lock to TTL. The gate include is now INSIDE this
        SAME outer block as the caller's own mutation, so gate_rescue.yml
        (rescue:) sees every failure in this whole span, and release.yml
        (always:) is the unconditional lock-release backstop)"
      block:
        - name: "Include l3_run_guard role (umbrella #202 WP3-A authoritative
            gate — identity/preflight/lock/snapshot/capacity). R6a: no
            vars: forwarding — l3_release/l3_target_namespace/
            l3_catalog_key/l3_chart_*/l3_chart_set_values are already
            play-scoped above and stay in scope for the rest of THIS play,
            including the install step below, which is exactly what makes
            this single-source (the old vars: forwarding here is what
            previously scoped those names to just this one task)."
          ansible.builtin.include_role:
            name: l3_run_guard

        - name: Assert single-node runs ride the pod interface
          ansible.builtin.assert:
            that:
              - mxl_placement_mode != 'single-node' or mxl_interface == 'eth0'
            fail_msg: >-
              single-node placement expects mxl_interface=eth0 (the pod NIC);
              override deliberately only if you know the CNI names it differently.

        - name: "L3: mark mutation as STARTED (everything from here on is a
            real mutating action; gate_rescue.yml reads this to decide
            superseded[pre-mutation] vs failed_rollback_required
            [post-mutation])"
          ansible.builtin.set_fact:
            l3_mutation_started: true

        - name: "L3: test-only fault injection boundary (R4a/P2-5 — no-op on every real run)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: fault_inject
          vars:
            l3_fault_inject_boundary: post-mutation-start

        - name: "L3 lock checkpoint before provision (R4a/P1-4 — the FIRST real mutation; no checkpoint existed here before this round)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint

        - name: Include mxl role (provision stage - NetBox catalog entry)
          ansible.builtin.include_role:
            name: mxl
          vars:
            mxl_stage: provision

        - name: "L3: test-only fault injection boundary (R4a/P2-5 — after the first real mutation)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: fault_inject
          vars:
            l3_fault_inject_boundary: post-first-mutation

        - name: "L3 lock checkpoint before topology release-group provision (umbrella #201 WP3)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint
          when: l3_release_group is defined

        - name: "Include mxl role (provision stage - NetBox catalog entry) for
            each topology release-group item (umbrella #201 WP3 — one
            NetBox service per topology source, identity overridden per
            item; a no-op loop over an undefined list on every non-topology
            launch, including this same playbook's own source-role
            invocation)"
          ansible.builtin.include_role:
            name: mxl
          vars:
            mxl_stage: provision
            # umbrella #201 WP3 fix-round: NOT l3_catalog_key/l3_release —
            # those are extra-var-pinned to the SCALAR viewer identity for
            # this whole play's duration, and extra_vars outrank an
            # include_role's own `vars:` identically to task vars, so
            # overriding them per loop iteration is silently a no-op (this
            # exact bug shipped once — an execution-harness scenario caught
            # it live, see roles/mxl/defaults/main.yml's own header).
            # mxl_group_item_identity is the role's OWN, dedicated
            # per-call override — the only mechanism that actually works.
            mxl_group_item_identity: "{{ item.netbox_service_name }}"
            # umbrella #401 — record this source's provenance as NetBox
            # tags (topology-parent:<key>/topology-source:<id>) so dmf-cms
            # can read the instance -> catalog relationship instead of
            # re-deriving it. l3_catalog_key is this play's own scalar
            # viewer identity (the topology-carrying entry itself);
            # item.source_id is the declared sources[].id
            # l3_topology_release_group already derived — never
            # reconstructed here.
            mxl_group_item_parent_key: "{{ l3_catalog_key }}"
            mxl_group_item_source_id: "{{ item.source_id }}"
          loop: "{{ l3_release_group | default([]) }}"
          loop_control:
            label: "{{ item.release }}"
          when: l3_release_group is defined

        # The mxl namespace (and the launcher's RBAC inside it) is pre-created by
        # dmf-infra awx-integration — namespaces are cluster-scoped and the
        # namespaced catalog launcher can neither create nor read them.

        - name: "L3 lock checkpoint before mxl-coordinator create (R4a/P1-4 — no checkpoint existed here before this round)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint

        - name: Ensure shared MXL coordinator ConfigMap exists
          kubernetes.core.k8s_info:
            api_version: v1
            kind: ConfigMap
            name: mxl-coordinator
            namespace: "{{ l3_target_namespace }}"
          register: _mxl_coordinator_cm

        - name: Create empty coordinator ConfigMap when absent
          kubernetes.core.k8s:
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: mxl-coordinator
                namespace: "{{ l3_target_namespace }}"
              data: {}
            state: present
          when: _mxl_coordinator_cm.resources | length == 0

        - name: "umbrella #201 WP3 fix-round D3/D4: this release's own
            active-source candidate write — the topology viewer's SELECTED
            source id (spec §5 step 3(a))"
          ansible.builtin.set_fact:
            _l3_coordinator_active_source_write: "{{ l3_topology_viewer_projection.active_source }}"
          when: l3_topology_viewer_projection is defined

        - name: "umbrella #201 WP3 fix-round D3: a scalar (non-topology)
            source launch self-selects its OWN identity so chart 0.4.0's
            new supervisor gate doesn't park it forever (runbook #203's
            pre-topology walked flow: deploy source, deploy viewer, preview
            works). Left UNDEFINED (no write at all, two tasks up above
            never having matched either) for a scalar VIEW launch —
            sourceId/active-source are meaningless for role=view."
          ansible.builtin.set_fact:
            _l3_coordinator_active_source_write: "{{ l3_release }}"
          when:
            - l3_topology_viewer_projection is not defined
            - mxl_role == 'source'

        - name: "umbrella #201 WP3 fix-round D4: cold-launch-only write
            discipline — read the coordinator's CURRENT active-source
            (captured by the read above, BEFORE this run's own mutation)
            and only ever patch when that key is genuinely ABSENT. A
            redeploy/relaunch after a live switch (WP4/WP5's
            SwitchSourceCommand) must never reset the operator's own
            selection back to this launch's default — the switch is the
            only place a live active-source value may change once set."
          ansible.builtin.set_fact:
            _l3_coordinator_active_source_already_set: >-
              {{
                (_mxl_coordinator_cm.resources | length > 0)
                and ((_mxl_coordinator_cm.resources[0].data['active-source'] | default('')) | trim != '')
              }}

        - name: "L3 lock checkpoint before mxl-coordinator active-source patch (umbrella #201 WP3)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint
          when: _l3_coordinator_active_source_write is defined

        - name: "Patch mxl-coordinator active-source (umbrella #201 WP3, spec §5
            step 3(a) — the coordinator's own switch-intent field, keyed by
            source id; a merge-patch of the SAME ConfigMap the viewer's own
            sidecar patches target-info/epoch into, so this never clobbers
            those fields. Only the initial COLD launch (D4 — never when the
            key is already set, see above): this is NOT the 3-phase
            quiesce/re-point/select sequencing spec §6.2 requires for a live
            RECONFIGURE — that is WP4/WP5's SwitchSourceCommand (dmf-cms), a
            separate concern. A cold launch has no prior selection to
            quiesce; the source supervisors themselves wait-loop until
            active-source/target-info/epoch are all present, regardless of
            the order these launch tasks run in.)"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: mxl-coordinator
                namespace: "{{ l3_target_namespace }}"
              data:
                active-source: "{{ _l3_coordinator_active_source_write }}"
          when:
            - _l3_coordinator_active_source_write is defined
            - not _l3_coordinator_active_source_already_set

        - name: "L3: test-only fault injection boundary (umbrella #201 WP3
            fix-round finding 7 — no-op on every real run; see
            fault_inject.yml's own header for post-topology-mutation)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: fault_inject
          vars:
            l3_fault_inject_boundary: post-topology-mutation

        - name: "L3 lock checkpoint before helm install (R3a-3b)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint

        - name: Deploy MXL Helm chart from Zot or local path
          block:
            - name: Create temporary MXL chart directory
              ansible.builtin.tempfile:
                state: directory
                suffix: mxl-fabrics-demo-chart
              register: _mxl_chart_tmp
              changed_when: false
              when: l3_chart_local | trim == ""

            - name: Pull MXL Helm chart from plain-HTTP Zot
              ansible.builtin.command:
                argv:
                  - helm
                  - pull
                  - "{{ l3_chart_ref }}/{{ l3_chart_name }}"
                  - --version
                  - "{{ l3_chart_version }}"
                  - --untar
                  - --untardir
                  - "{{ _mxl_chart_tmp.path }}"
                  - --plain-http
              changed_when: false
              when: l3_chart_local | trim == ""

            # R6a-1 (codex round-5): --set argv built via l3_set_flag_argv over
            # l3_chart_set_values — the EXACT SAME filter+source pair
            # capacity.yml's own render uses for its `helm template` call.
            # Previously this task hand-duplicated the --set list inline
            # (role=/fabrics.interface=/image.tag=/placementMode=/
            # nodeAccess.create=), a SEPARATE, independently-maintained copy
            # of what mxl_chart_set_values already assembled for the gate —
            # a latent divergence risk if the two lists were ever edited
            # out of step, beyond the l3_chart_set_values-not-checked gap
            # codex round-5 named explicitly.
            - name: "Install or upgrade MXL Helm release (umbrella #201 WP3 —
                _l3_effective_chart_set_values, not l3_chart_set_values
                directly: identical for every non-topology launch; on the
                view-role topology invocation it also carries this
                release's own overridden flow.id, see the set_fact above)"
              ansible.builtin.command:
                argv: >-
                  {{
                    ['helm', 'upgrade', '--install', l3_release,
                     (l3_chart_local | trim if (l3_chart_local | trim) else _mxl_chart_tmp.path ~ '/' ~ l3_chart_name),
                     '-n', l3_target_namespace]
                    + (_l3_effective_chart_set_values | l3_set_flag_argv)
                  }}
              changed_when: true

            - name: "Install or upgrade each topology release-group item's MXL
                Helm release (umbrella #201 WP3 — the SAME pulled/local
                chart path as the scalar install above, one `helm
                upgrade --install` per topology source; a no-op loop over
                an undefined list on every non-topology launch)"
              ansible.builtin.command:
                argv: >-
                  {{
                    ['helm', 'upgrade', '--install', item.release,
                     (l3_chart_local | trim if (l3_chart_local | trim) else _mxl_chart_tmp.path ~ '/' ~ l3_chart_name),
                     '-n', l3_target_namespace]
                    + (item.chart_set_values | l3_set_flag_argv)
                  }}
              loop: "{{ l3_release_group | default([]) }}"
              loop_control:
                label: "{{ item.release }}"
              when: l3_release_group is defined
              changed_when: true

            - name: Wait for MXL workload to be Ready
              kubernetes.core.k8s_info:
                api_version: apps/v1
                kind: Deployment
                name: "{{ l3_release }}-{{ 'initiator' if mxl_role == 'source' else 'target' }}"
                namespace: "{{ l3_target_namespace }}"
              register: _mxl_workload
              until:
                - _mxl_workload.resources | length > 0
                - _mxl_workload.resources[0].status.readyReplicas | default(0) == (_mxl_workload.resources[0].spec.replicas | default(1))
              retries: 30
              delay: 10

            - name: "Wait for each topology release-group item's MXL workload to
                be Ready (umbrella #201 WP3 — every group item is always
                role=source, so always an -initiator Deployment; a no-op
                loop over an undefined list on every non-topology launch)"
              kubernetes.core.k8s_info:
                api_version: apps/v1
                kind: Deployment
                name: "{{ item.release }}-initiator"
                namespace: "{{ l3_target_namespace }}"
              register: _mxl_group_workload
              until:
                - _mxl_group_workload.resources | length > 0
                - _mxl_group_workload.resources[0].status.readyReplicas | default(0) == (_mxl_group_workload.resources[0].spec.replicas | default(1))
              retries: 30
              delay: 10
              loop: "{{ l3_release_group | default([]) }}"
              loop_control:
                label: "{{ item.release }}"
              when: l3_release_group is defined
          always:
            - name: Remove temporary MXL chart directory
              ansible.builtin.file:
                path: "{{ _mxl_chart_tmp.path | default('') }}"
                state: absent
              changed_when: false
              when: _mxl_chart_tmp.path is defined

        - name: "L3 lock checkpoint before NetBox configure (R3a-3b)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint

        - name: Include mxl role (configure stage - flip NetBox to active)
          ansible.builtin.include_role:
            name: mxl
          vars:
            mxl_stage: configure

        - name: "L3 lock checkpoint before topology release-group configure (umbrella #201 WP3)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint
          when: l3_release_group is defined

        - name: "Include mxl role (configure stage - flip NetBox to active) for
            each topology release-group item (umbrella #201 WP3 — a no-op
            loop over an undefined list on every non-topology launch)"
          ansible.builtin.include_role:
            name: mxl
          vars:
            mxl_stage: configure
            # umbrella #201 WP3 fix-round: NOT l3_catalog_key/l3_release —
            # those are extra-var-pinned to the SCALAR viewer identity for
            # this whole play's duration, and extra_vars outrank an
            # include_role's own `vars:` identically to task vars, so
            # overriding them per loop iteration is silently a no-op (this
            # exact bug shipped once — an execution-harness scenario caught
            # it live, see roles/mxl/defaults/main.yml's own header).
            # mxl_group_item_identity is the role's OWN, dedicated
            # per-call override — the only mechanism that actually works.
            mxl_group_item_identity: "{{ item.netbox_service_name }}"
            # umbrella #401 — re-assert the same provenance tags configure
            # writes alongside lifecycle:active (see the provision
            # invocation above for the full rationale). Finalise/teardown
            # deliberately does NOT thread these two: teardown-mxl-fabrics-
            # demo.yml's own per-source loop only ever recovers the release
            # NAME (l3_topology_service_names), not its source_id/parent —
            # re-deriving either from that name here would be exactly the
            # string-parsing this design forbids, and a torn-down
            # (lifecycle:bootstrapped) instance carries no console-facing
            # resolution claim for this fix to protect. The next real
            # provision re-asserts both tags fresh, from declared data.
            mxl_group_item_parent_key: "{{ l3_catalog_key }}"
            mxl_group_item_source_id: "{{ item.source_id }}"
          loop: "{{ l3_release_group | default([]) }}"
          loop_control:
            label: "{{ item.release }}"
          when: l3_release_group is defined

        - name: L3 launch success — terminalize snapshot + release lock
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: launch_success
      rescue:
        - name: "L3 gate rescue — shared launch/teardown cleanup (R4a Backbone: mutation-state-aware
            snapshot terminalization + marker, unless a hand-written refusal already emitted its own)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: gate_rescue

        - name: Re-raise (gate_rescue.yml only does cleanup, never terminates the play itself)
          ansible.builtin.fail:
            msg: >-
              MXL fabrics-demo launch failed for run_id={{ l3_run_id | default('<unknown>') }}.
              See the task error above for the root cause; the L3 gate's
              own cleanup (snapshot terminalized, facility lock released)
              has already run.
      always:
        - name: "L3 release — idempotent lock-release backstop (R4a Backbone: catches anything
            gate_rescue.yml itself failed to release, or a case where rescue never even ran)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: release
