---
# NMOS Crosspoint - Finalise: Teardown (ADR-0012, ADR-0014, ADR-0025)
# Runs in-cluster via custom AWX EE (Container Group dmf-catalog-cg).
# Removes the crosspoint Helm release + flips NetBox tag back to bootstrapped.
- name: nmos-crosspoint finalise - teardown workload
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    nmos_namespace: nmos
  tasks:
    - name: Remove nmos-crosspoint Helm release
      kubernetes.core.helm:
        name: nmos-crosspoint
        release_namespace: "{{ nmos_namespace }}"
        state: absent
        wait: true
        wait_timeout: 5m

    - name: Include nmos-crosspoint role (finalise stage - flip NetBox tag to bootstrapped)
      ansible.builtin.include_role:
        name: nmos-crosspoint
      vars:
        crosspoint_stage: finalise
