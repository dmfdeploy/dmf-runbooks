---
# MXL Hello demo - Finalise: Teardown single-node workload
# Simplified from mxl-fabrics-demo: no coordinator, no role/placement vars.
- name: MXL hello single-node finalise - teardown workload
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mxl_namespace: mxl
    mxl_release: mxl-hello
  tasks:
    - name: Remove MXL Hello Helm release
      ansible.builtin.command:
        argv:
          - helm
          - uninstall
          - "{{ mxl_release }}"
          - -n
          - "{{ mxl_namespace }}"
      changed_when: true

    # The mxl namespace stays: dmf-infra awx-integration owns it (it carries
    # the launcher RBAC), and namespace deletion is cluster-scoped anyway.

    - name: Note flow-domain cleanup is handled by pod teardown
      ansible.builtin.debug:
        msg: "MXL flow domain cleanup is implicit: the pod emptyDir disappears with the Helm release."

    - name: Include mxl role (finalise stage - reset NetBox catalog entry)
      ansible.builtin.include_role:
        name: mxl
      vars:
        mxl_stage: finalise
        mxl_function_key: mxl-hello
        mxl_monitoring_enabled: false
