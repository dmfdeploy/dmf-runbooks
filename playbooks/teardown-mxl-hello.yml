---
# MXL Hello demo - Finalise: Teardown single-node workload
# Simplified from mxl-fabrics-demo: no coordinator, no role/placement vars.
- name: MXL hello single-node finalise - teardown workload
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mxl_namespace: mxl
    mxl_release: mxl-hello
  tasks:
    - name: Remove MXL Hello Helm release
      ansible.builtin.command:
        argv:
          - helm
          - uninstall
          - "{{ mxl_release }}"
          - -n
          - "{{ mxl_namespace }}"
      changed_when: true

    - name: Check if MXL namespace has remaining workloads
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ mxl_namespace }}"
      register: _mxl_deployments
      ignore_errors: true

    - name: Remove MXL namespace when empty
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ mxl_namespace }}"
        state: absent
      when:
        - _mxl_deployments.resources is defined
        - _mxl_deployments.resources | length == 0

    - name: Note flow-domain cleanup is handled by pod teardown
      ansible.builtin.debug:
        msg: "MXL flow domain cleanup is implicit: the pod emptyDir disappears with the Helm release."
