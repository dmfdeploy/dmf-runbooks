---
# NMOS Crosspoint - Configure: Launch (ADR-0012, ADR-0014, ADR-0025)
# Runs in-cluster via custom AWX EE (Container Group dmf-catalog-cg).
# Deploys the nmos-crosspoint Helm chart + flips the NetBox tag.
- name: nmos-crosspoint configure - launch workload
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # umbrella #202 WP3 R6a (codex round-5 P1-1/P1-2, replacing R5a-2's
    # broken post-hoc consistency assert): TRUE single source. ONE play-
    # scope definition per identity/render value below — the gate
    # (l3_run_guard's capacity.yml render + snapshot.yml, included
    # dynamically below with no vars: forwarding) sees these exact names
    # via ordinary play-var scope, and this playbook's own install step
    # further down reads the SAME names directly. See launch-nmos-cpp.yml's
    # own header comment for the full mechanism explanation.
    l3_release: nmos-crosspoint
    l3_target_namespace: nmos
    l3_catalog_key: nmos-crosspoint
    l3_chart_ref: "oci://zot.zot.svc.cluster.local:5000/dmf/charts"
    l3_chart_name: nmos-crosspoint
    l3_chart_version: "0.1.0"
    l3_chart_local: ""
    # IS-04 registry the crosspoint subscribes to (bare hostname; port separate).
    crosspoint_registry_ip: "nmos-cpp-registry.{{ l3_target_namespace }}.svc.cluster.local"
    crosspoint_registry_port: 80
    # Private-lane host for the IngressRoute. Override per env via extra_vars.
    crosspoint_ingress_host: "nmos-xp.dmf.example.com"
    # Admin password — sourced from OpenBao (AWX credential / extra_vars). The
    # SHA256 (not the plaintext) is what lands in the rendered users.json Secret.
    crosspoint_admin_password: "{{ vault_nmos_crosspoint_admin_password | default('', true) }}"
    # umbrella #202 WP3-A: single source of truth for the chart's install
    # values — used BOTH by the set_values install below AND (flattened
    # to --set-style strings via l3_flatten_set_values, R6a-1) by the L3
    # capacity preflight's `helm template` recompute. adminPasswordSha256 is
    # computed here so the plaintext never reaches the chart, git, OR the L3
    # preflight's helm template command.
    l3_release_values:
      createNamespace: false
      registry:
        ip: "{{ crosspoint_registry_ip }}"
        port: "{{ crosspoint_registry_port }}"
      ingress:
        host: "{{ crosspoint_ingress_host }}"
      auth:
        adminPasswordSha256: "{{ crosspoint_admin_password | hash('sha256') }}"
    l3_chart_set_values: "{{ l3_release_values | l3_flatten_set_values }}"
    # roles/nmos-crosspoint/defaults/main.yml's netbox_service_monitoring_custom_fields
    # stamps cluster_namespace from a variable named exactly nmos_namespace
    # (ADR-0038 §in-cluster probe — load-bearing for dmf-promsd probe
    # wiring, not cosmetic) — aliased here to l3_target_namespace for the
    # same reason and with the same R6a scope-boundary caveat as
    # launch-mxl-fabrics-demo.yml's mxl_release/mxl_namespace aliases.
    # nmos-crosspoint's netbox_service_name (cluster_service equivalent) is
    # a hardcoded literal in that same role file, no indirection, no
    # equivalent alias needed.
    nmos_namespace: "{{ l3_target_namespace }}"
  tasks:
    - name: "L3 gate through terminal — ONE outer block/rescue/always (R4a
        Backbone, codex round-3 P1-3/P1-11: main.yml's own stages
        (identity->preflight->lock->snapshot->capacity) used to run
        OUTSIDE any block — an exception there had nothing to catch it
        and leaked the lock to TTL. The gate include is now INSIDE this
        SAME outer block as the caller's own mutation, so gate_rescue.yml
        (rescue:) sees every failure in this whole span, and release.yml
        (always:) is the unconditional lock-release backstop)"
      block:
        - name: "Include l3_run_guard role (umbrella #202 WP3-A authoritative
            gate — identity/preflight/lock/snapshot/capacity). R6a: no
            vars: forwarding — l3_release/l3_target_namespace/
            l3_catalog_key/l3_chart_*/l3_chart_set_values are already
            play-scoped above and stay in scope for the rest of THIS play,
            including the install step below, which is exactly what makes
            this single-source (the old vars: forwarding here is what
            previously scoped those names to just this one task)."
          ansible.builtin.include_role:
            name: l3_run_guard

        - name: "Assert crosspoint admin password was provided (fail closed)
            — R5a/P1-3 (codex round-4): MOVED inside the outer block, after
            identity/gate, so a missing secret fails through gate_rescue.yml
            with an honest pre-mutation preflight-error token instead of a
            raw task-zero failure with no marker at all (the R4a draft's
            gate-wide rescue only covered the block below THIS assert used
            to sit before — a started AWX job with this exact configuration
            error had no pre-mutation token, and dmf-cms could misclassify
            it FAILED_ROLLBACK_REQUIRED and dispatch a pointless no-snapshot
            rollback — codex's exact executed repro)"
          ansible.builtin.assert:
            that:
              - crosspoint_admin_password | length > 0
            fail_msg: >-
              vault_nmos_crosspoint_admin_password is empty. AWX must supply the
              OpenBao-sourced crosspoint admin password; refusing to deploy with an
              empty/default credential.
          no_log: true

        - name: "L3: mark mutation as STARTED (everything from here on is a
            real mutating action; gate_rescue.yml reads this to decide
            superseded[pre-mutation] vs failed_rollback_required
            [post-mutation])"
          ansible.builtin.set_fact:
            l3_mutation_started: true

        - name: "L3: test-only fault injection boundary (R4a/P2-5 — no-op on every real run)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: fault_inject
          vars:
            l3_fault_inject_boundary: post-mutation-start

        - name: "L3 lock checkpoint before provision (R4a/P1-4 — the FIRST real mutation; no checkpoint existed here before this round)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint

        - name: Include nmos-crosspoint role (provision stage - NetBox catalog entry)
          ansible.builtin.include_role:
            name: nmos-crosspoint
          vars:
            crosspoint_stage: provision

        - name: "L3: test-only fault injection boundary (R4a/P2-5 — after the first real mutation)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: fault_inject
          vars:
            l3_fault_inject_boundary: post-first-mutation

        - name: "L3 lock checkpoint before helm install (R3a-3b)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint

        - name: Deploy nmos-crosspoint Helm chart from Zot
          block:
            - name: Create temporary crosspoint chart directory
              ansible.builtin.tempfile:
                state: directory
                suffix: nmos-crosspoint-chart
              register: _xp_chart_tmp
              changed_when: false

            - name: Pull crosspoint Helm chart from plain-HTTP Zot
              ansible.builtin.command:
                argv:
                  - helm
                  - pull
                  - "{{ l3_chart_ref }}/{{ l3_chart_name }}"
                  - --version
                  - "{{ l3_chart_version }}"
                  - --untar
                  - --untardir
                  - "{{ _xp_chart_tmp.path }}"
                  - --plain-http
              changed_when: false

            # R6a-1 (codex round-5): set_values built from l3_chart_set_values
            # via l3_set_values_dicts — the SAME flat list capacity.yml's
            # render already flattened l3_release_values into, and turned
            # into --set argv via l3_set_flag_argv. Retiring release_values:
            # (the nested-dict shape) here closes the exact gap codex named:
            # before R6a, l3_chart_set_values was consumed ONLY by the
            # gate's render, while this install task read
            # crosspoint_release_values directly — two different
            # names/shapes that happened to agree by construction, not by
            # single source.
            #
            # create_namespace: false — the namespace already exists
            # (nmos-cpp owns it). wait: false — replaced by an explicit
            # k8s_info readiness gate below (kubernetes.core.helm --wait
            # yields false-negative Unknown for these workloads).
            - name: Install or upgrade crosspoint Helm release
              kubernetes.core.helm:
                name: "{{ l3_release }}"
                chart_ref: "{{ _xp_chart_tmp.path }}/{{ l3_chart_name }}"
                release_namespace: "{{ l3_target_namespace }}"
                create_namespace: false
                set_values: "{{ l3_chart_set_values | l3_set_values_dicts }}"
                wait: false

            - name: Wait for nmos-crosspoint workload to be Ready
              # Explicit readiness gate replacing the broken helm --wait predicate.
              # 30 × 10s = 5min hard cap.
              kubernetes.core.k8s_info:
                api_version: apps/v1
                kind: Deployment
                name: "{{ l3_release }}"
                namespace: "{{ l3_target_namespace }}"
              register: _xp_workload
              until:
                - _xp_workload.resources | length > 0
                - _xp_workload.resources[0].status.readyReplicas | default(0) == (_xp_workload.resources[0].spec.replicas | default(1))
              retries: 30
              delay: 10
          always:
            - name: Remove temporary crosspoint chart directory
              ansible.builtin.file:
                path: "{{ _xp_chart_tmp.path | default('') }}"
                state: absent
              changed_when: false
              when: _xp_chart_tmp.path is defined

        - name: "L3 lock checkpoint before NetBox configure (R3a-3b)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_checkpoint

        - name: Include nmos-crosspoint role (configure stage - flip NetBox tag to active)
          ansible.builtin.include_role:
            name: nmos-crosspoint
          vars:
            crosspoint_stage: configure

        - name: L3 launch success — terminalize snapshot + release lock
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: launch_success
      rescue:
        - name: "L3 gate rescue — shared launch/teardown cleanup (R4a Backbone: mutation-state-aware
            snapshot terminalization + marker, unless a hand-written refusal already emitted its own)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: gate_rescue

        - name: Re-raise (gate_rescue.yml only does cleanup, never terminates the play itself)
          ansible.builtin.fail:
            msg: >-
              nmos-crosspoint launch failed for run_id={{ l3_run_id | default('<unknown>') }}.
              See the task error above for the root cause; the L3 gate's
              own cleanup (snapshot terminalized, facility lock released)
              has already run.
      always:
        - name: "L3 release — idempotent lock-release backstop (R4a Backbone: catches anything
            gate_rescue.yml itself failed to release, or a case where rescue never even ran)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: release
