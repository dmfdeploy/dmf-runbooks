---
# MXL Fabrics demo - Switch: reconfigure an already-running viewer's active
# source (umbrella #201 WP4b, spec §6.2's own quiesce -> re-point -> select
# sequencing, `DMF v0.2b Multi-Source Switch Spec 2026-07-15.md`).
#
# Consumes dmf-cms's ReconnectViaAwxActuator extra_vars contract VERBATIM
# (src/dmf_cms/switch_source.py's own "EXTRA_VARS PAYLOAD CONTRACT"
# docstring is this playbook's input contract — read it there before
# changing either side; a test asserts they stay in lock-step):
#   topology_params   — the receiver's own topology_params object, with
#                       viewer.source_selection ALREADY reassigned to the
#                       switch target by dmf-cms (this playbook does not
#                       repeat that reassignment, only re-derives from it).
#   receiver_instance — the viewer's concrete Helm release / NetBox
#                       identity (e.g. "mxl-videotest-view").
#   source_instance   — the switch target's sources[].id, redundant with
#                       topology_params.viewer.source_selection BY
#                       CONSTRUCTION — validated to match below (defense
#                       in depth, never trusted blindly from either side
#                       alone).
#   reason            — operator-supplied, for THIS job's own task
#                       naming/traceability inside AWX only — never a
#                       substitute for dmf-cms's own C5 audit.
#
# Unlike launch-mxl-fabrics-demo.yml / teardown-mxl-fabrics-demo.yml, this
# playbook touches NEITHER NetBox NOR a fresh Helm install/uninstall — it
# only reconfigures an ALREADY-DEPLOYED topology's coordinator ConfigMap +
# re-points the viewer's EXISTING Helm release. It therefore rides a
# deliberately narrower, SHORTER-held slice of the SAME shared facility
# lock (roles/l3_run_guard/tasks/switch_lock.yml — see that file's own
# header for the full design rationale) rather than main.yml's full launch
# gate or lock_only.yml's teardown entry point.
#
# Failure posture (spec §6.2, claude1/#201 WP4 addendum condition 4, REVISED
# by umbrella #306 design round #2, frozen 2026-07-30): a failure at ANY
# phase BEFORE PHASE 2's own upgrade verification leaves active-source
# cleared (or never advanced) — a clean, zero-transmitter quiesced state,
# no rollback needed because nothing was ever re-pointed. A failure OF
# PHASE 2's own verification is different: the viewer's Helm release WAS
# re-pointed, so this playbook now runs a bounded, VERIFIED `helm rollback`
# (never trusting helm's own wait verdict — job 413 proved it can be wrong)
# and, only once that rollback is independently confirmed via all four
# pass criteria (switch_poll_rollback_verify.yml), restores the pre-switch
# active-source IF one was set. Either way — verified-rollback-restore or
# rollback-verification-failure — the job STILL reports failure; a switch
# that did not reach its requested target never reports success (see the
# PHASE 2 verify block below for the exact two outcomes and their
# messages). dmf-cms's own ReconnectViaAwxActuator still expects operator
# retry/rollback on any failure — an automatically-restored previous
# source does not change that; it only means "recovered to a known-safe
# state" is stronger than the old "quiesced, nothing else" contract. This
# playbook's own rescue: is UNCHANGED as the unconditional lock-release
# backstop (see its own comments) — it never becomes the AUTOMATIC-rollback
# path (that is entirely in-block, below), only the final safety net for
# every phase (including a failed rollback-and-verify itself).
#
# STRUCTURED OUTCOME EVENT (umbrella #323, decided in the 2026-07-30
# console-truth design round recorded on #321, landed 2026-07-31): this
# playbook now DOES emit a marker on every terminal exit — but a SEPARATE,
# switch-owned vocabulary (DMF_L3_SWITCH_OUTCOME,
# roles/l3_run_guard/tasks/_emit_switch_outcome.yml), never DMF_L3_OUTCOME.
# The two are deliberately NOT unified: DMF_L3_OUTCOME's token set
# (preflight-error, post-mutation-failed, facility-busy, ...) is launch/
# teardown/rollback's own snapshot-based OperationState model — keyed off
# l3_snapshot_created/l3_mutation_started and the dmf-run-<id> ConfigMap's
# own lifecycle (superseded / failed_rollback_required), none of which a
# switch has (no snapshot is ever captured, l3_mutation_started is never
# set). Forcing a switch's own failure taxonomy — a clean pre-repoint
# refusal vs. a VERIFIED helm rollback that either restored the previous
# source or didn't (see the PHASE 2 verify block below for the exact two
# rollback outcomes and their existing, UNCHANGED fail messages) — through
# that model would be a misleading fit, not a real reuse. So
# DMF_L3_SWITCH_OUTCOME carries its own small, switch-specific enum
# instead: `success`, `rollback_verified_previous_source_restored`,
# `rollback_verified_no_previous_source`, `rollback_verification_failed`,
# and `refused` (the catch-all for every OTHER terminal failure — pre-lock,
# pre-mutation reads, PHASE 1 mutation, a PHASE 3 final-readback mismatch —
# every one of which this playbook's own rescue: header below already
# classifies as "leaves active-source cleared/absent, the same safe
# quiesced state"). EXACTLY ONE event fires per run: the PHASE-2-specific
# tokens are emitted in-block, immediately before their own
# ansible.builtin.fail task (a fail ends that branch, so the emit must
# precede it — the ordering is not interchangeable), and set
# _switch_outcome_emitted so the rescue:'s own generic `refused` emit — the
# catch-all for every failure that DIDN'T already go through one of those
# branches — skips firing a duplicate/misleading second marker on top
# (mirrors l3_pre_mutation_marker_emitted's identical role in
# gate_rescue.yml's own branch A, applied here since this playbook's
# control flow is simple enough to own the sentinel directly rather than
# factoring it into a shared role file). `success` is the LAST task in the
# block, after the lock-release include, so nothing later can still fail
# the run out from under an already-emitted success marker.
#
# THE TWO ROLLBACK-VERIFIED TOKENS (umbrella #323 fix round, codex gate
# P2a): a VERIFIED rollback has two genuinely different endings, because
# the restore task is deliberately skipped when the pre-switch coordinator
# had NO active-source set (`when: ... and (_switch_baseline.active_source
# | trim) != ''` — there is nothing to restore, and writing an empty
# active-source would be a mutation, not a restore). Emitting
# rollback_verified_previous_source_restored with an EMPTY
# restored_active_source on that exit told the console a factual untruth —
# "the previous source was restored", when the honest statement is "the
# rollback verified and there was no previous source to restore". So that
# exit now emits its own token, rollback_verified_no_previous_source. Both
# still fail the job, both still leave a coordinator whose active-source is
# exactly what it was pre-switch, and BOTH still share the ONE, unchanged,
# byte-identical `rollback_verified previous_source_restored:` legacy fail
# message — dmf-cms's #320 stdout bridge parses that prefix during the
# transition and must not be disturbed by a change that only concerns the
# structured event.
#
# detail= ON refused (umbrella #323 fix round, operator ruling): `refused`
# covers ~20 distinct terminal exits, from a pre-lock guard refusal
# (nothing whatsoever touched) to a PHASE 3 final-readback mismatch (the
# switch all but complete). The console cannot act on those the same way,
# so the refused event now also carries a detail= field naming the stage
# that was in flight — the same convention this playbook already uses one
# line away in "DMF_L3_SWITCH_REFUSED: detail=switch-final-readback-
# mismatch". It is deliberately a SMALL, stable vocabulary spanning the
# exits rather than one value per exit: reserved-var, pre-lock,
# coordinator-read, chart-resolve, baseline-capture, quiesce, repoint,
# select, and final-readback. detail=reserved-var is emitted only by the
# hard-coded guard marker; detail=pre-lock is the DEFAULT (see the
# no-pre-lock-set_fact comment inside the block for why that default is the
# correct value rather than a guess).
# detail= is always the FIRST kv field, immediately after the token, so a
# parser that takes the first detail= can never be confused by a
# caller-supplied free-text value (e.g. a receiver_instance containing
# "detail=") appearing later in the same line.
#
# CONSOLE-SIDE ASSUMPTION (fix round, codex round-2 gate NIT — flagged, not
# fixed here, this repo does not own the parser): run_id/request_id/
# receiver_instance below are rendered UNSANITIZED — a caller-supplied
# value could contain arbitrary characters, including a newline that makes
# the AWX job-event message look like it contains a SECOND
# "DMF_L3_SWITCH_OUTCOME:" line. Because the honest token+detail always
# render FIRST (same discipline as the detail= placement above), a
# dmf-cms-side parser that takes the FIRST "DMF_L3_SWITCH_OUTCOME:" match
# in the event message is not fooled by this; a global/last-match scan
# would be. This is a pre-existing property of the kv fields (unchanged by
# this fix round) — noted here as the one-line confirmation the gate asked
# for, not a change to this playbook.
#
# NON-FORGEABILITY OF ALL OF THE ABOVE (umbrella #323 fix round, codex gate
# P1 — read roles/l3_run_guard/tasks/switch_outcome_guard.yml's own header
# for the full story, it is the substance of this fix). Ansible extra_vars
# outrank task-level vars, set_fact and register alike, so a caller could
# previously either silence this play's only outcome task
# (-e _switch_outcome_emitted=true) or dictate its content
# (-e l3_switch_outcome_token=...) — and could do so precisely BECAUSE the
# reserved-var refusal path itself ran through the shadowed names. The
# first task of this play is now switch_outcome_guard, which proves every
# variable the outcome decision reads is caller-free and, on violation,
# emits a HARD-CODED literal refused marker
# (_emit_switch_refused_literal.yml) and ends the play before the outer
# block is ever entered. The stage fact that feeds detail= is covered by
# that same guard, so a caller cannot choose the detail string either; and
# the catch-all's skip decision is now a conjunction of the sentinel AND
# the real PHASE 2 verify verdict, so no single shadowed name can suppress
# the event even if the guard were somehow bypassed.
#
# This is layered ON TOP of dmf-cms's own short-term #320 bridge (which
# parses fixed allowlisted prefixes — including the two rollback fail
# messages' own unchanged text and DMF_L3_SWITCH_REFUSED — from failed AWX
# job stdout): the console accepts BOTH during the transition, so this
# release lands independently of any console change. The actuator still
# also reads the AWX job's own terminal status directly
# (successful/failed/...) — the marker adds STRUCTURE on top of that, it
# doesn't replace it.
#
# TIMING CONTRACT (umbrella #306 design round #2 — the console watch budget
# formula's own reference; DMF_CONSOLE_L3_SWITCH_SOURCE_TIMEOUT_SECONDS in
# dmf-cms is a SEPARATE change, not this PR, but its default (360s) is
# built directly from these four vars + AWX/poll slack — keep them in sync
# if either side's default ever moves):
#   l3_switch_quiesce_settle_seconds        (10)  — PHASE 1: fixed settle
#     wait after clearing active-source/target-info/epoch, before PHASE 2's
#     helm upgrade, so the outgoing supervisor has genuinely stopped
#     transmitting before the viewer restarts.
#   l3_switch_upgrade_verify_timeout_seconds (120) — PHASE 2 rollout
#     verification budget (kubernetes.core.k8s_info polling, NOT helm
#     --wait — see the PHASE 2 tasks below). Arithmetic (job 413
#     measurements): ~31s observed pod turnover + ~60s observed
#     convergence + ~30s slack. Kubernetes' own default 30s termination
#     grace applies (no terminationGracePeriodSeconds override in the
#     chart). Kept at 120s even on the #308-fixed image for attempt #3 —
#     turnover re-measurement against that image comes later, not here.
#   l3_switch_rollback_verify_timeout_seconds (120) — post-rollback
#     verification budget (same rationale/arithmetic as above — a rollback
#     is itself a pod turnover + convergence, not a shortcut).
#   l3_switch_verify_poll_delay_seconds      (10)  — poll interval for both
#     verification polls (reuses launch-mxl-fabrics-demo.yml's own existing
#     Deployment-wait delay: 10 idiom).
# All four are ordinary play vars (like l3_target_namespace) — override via
# -e for a faster test-mode poll; production runs take the defaults above.
# Each verification budget polls THROUGH t=timeout inclusive (attempt count
# = (timeout // delay) + 1 — see switch_verify_upgrade.yml /
# switch_rollback_and_verify.yml's own comments) — the FULL documented
# window, never one interval short of it.
- name: MXL fabrics demo switch - reconfigure viewer active source
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    l3_target_namespace: mxl
    l3_switch_quiesce_settle_seconds: 10
    l3_switch_upgrade_verify_timeout_seconds: 120
    l3_switch_rollback_verify_timeout_seconds: 120
    l3_switch_verify_poll_delay_seconds: 10
  tasks:
    # The ONE task that deliberately sits OUTSIDE the outer block below
    # (umbrella #323 fix round, codex gate P1). It proves that none of the
    # variables this play's own structured-outcome decision reads were
    # supplied as extra_vars, and on violation emits a hard-coded literal
    # `refused detail=reserved-var` marker and ends the play — before the
    # block, so its own failure can never be caught by a rescue whose
    # emission the caller may have just shadowed, and with genuinely
    # nothing to clean up (no lock, no chart tempdir, no coordinator
    # write). See roles/l3_run_guard/tasks/switch_outcome_guard.yml's own
    # header for why the reserved-var blocklist alone cannot close this and
    # why no variable-based fix is possible against extra_vars.
    - name: "L3 switch outcome-control guard (umbrella #323 fix round — MUST stay the first task of this play, and outside the outer block)"
      ansible.builtin.include_role:
        name: l3_run_guard
        tasks_from: switch_outcome_guard

    - name: "L3 switch gate through terminal — ONE outer block/rescue/always
        (mirrors launch/teardown's own R4a Backbone shape: this playbook's
        own rescue: sees every failure in the whole span, and the always:
        lock-release is an unconditional backstop)"
      block:
        # _switch_stage names the stage that is IN FLIGHT, so a failure
        # anywhere in it reports that stage as the refused event's detail=.
        # Each transition is set immediately BEFORE the stage it names
        # begins. The fact is proven caller-free by the outcome-control
        # guard above (and reserved in _assert_reserved_vars.yml, as the
        # R5a-1 scanner requires for any set_fact target), so the detail
        # string is this play's own statement about itself, never a
        # caller's.
        #
        # THERE IS DELIBERATELY NO `_switch_stage: pre-lock` TASK HERE, and
        # the rescue's kv defaults to pre-lock instead. A playbook-level
        # set_fact at this point would run BEFORE switch_lock -> identity.yml
        # -> _assert_reserved_vars.yml, which would then find _switch_stage
        # already "defined" and refuse EVERY legitimate switch run as a
        # forged reserved var — the exact trap switch_validate.yml's own
        # header documents (qwen1 gate fix round, caught live again here by
        # probing this fix against the stub harness before writing tests).
        # The default is not a fallback guess either: the only code that can
        # fail between this play's first task and the first transition below
        # is identity.yml's own reserved-var/request-id validation and the
        # facility-lock acquisition, all of which ARE pre-lock by definition.
        # That is also why the vocabulary has no `unexpected` member in
        # practice — there is no span it could describe.
        - name: "L3 switch-lock guard (identity -> switch_validate ->
            facility lock acquisition — umbrella #201 WP4b,
            roles/l3_run_guard/tasks/switch_lock.yml). qwen1 gate fix
            round: the topology_params structural check, the
            source_instance/receiver_instance checks, and the viewer
            projection all now live INSIDE this include (switch_validate.yml,
            run after identity's reserved-var assert but before lock.yml) —
            NOT as playbook-level set_fact tasks before this include, which
            would make those facts already 'defined' by the time the
            reserved-var assert runs and trip a forged-reserved-var
            refusal on every legitimate run (see switch_validate.yml's own
            header for the full story)."
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: switch_lock

        - name: "L3 switch stage -> coordinator-read (facility lock now HELD; every read from here to baseline-capture still leaves the coordinator untouched)"
          ansible.builtin.set_fact:
            _switch_stage: coordinator-read

        - name: "L3: test-only fault injection boundary (umbrella #201
            WP4b — no-op on every real run; proves a pre-mutation switch
            failure releases the lock with the coordinator untouched)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: fault_inject
          vars:
            l3_fault_inject_boundary: post-switch-lock

        - name: "Read + assert-exists the coordinator ConfigMap (umbrella
            #201 WP4b, roles/l3_run_guard/tasks/switch_read_coordinator.yml)
            — role-owned, but called HERE (after switch_lock, i.e. after
            the facility lock is held), not folded into switch_validate.yml's
            own pre-lock sequence: see that file's own header for why this
            read is deliberately POST-lock (a real race, not just a
            reserved-var technicality)."
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: switch_read_coordinator

        - name: "L3 switch stage -> chart-resolve (helm get metadata + helm pull, still pre-mutation)"
          ansible.builtin.set_fact:
            _switch_stage: chart-resolve

        - name: "L3 switch: resolve + pull the receiver's own installed chart
            (umbrella #306, roles/l3_run_guard/tasks/switch_resolve_chart.yml)
            — under the held facility lock, but BEFORE any coordinator
            mutation, so a metadata/pull failure fails through the rescue
            path below with the coordinator completely untouched. See that
            file's own header for why chart identity is read from the live
            release rather than the l3_chart_version pin."
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: switch_resolve_chart

        - name: "L3 switch stage -> baseline-capture (helm get values + the baseline bundle, the LAST pre-mutation stage)"
          ansible.builtin.set_fact:
            _switch_stage: baseline-capture

        - name: "L3 switch: capture the PRE-switch baseline (umbrella #306
            design round #2, roles/l3_run_guard/tasks/switch_capture_baseline.yml)
            — revision/chart identity/flow.id/coordinator pre-state, read
            under the held facility lock but BEFORE any mutation, exactly
            like switch_resolve_chart.yml above. This is what PHASE 2's own
            post-rollback verification compares against, and the source of
            the previous active-source a verified rollback restores."
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: switch_capture_baseline

        # ── PHASE 1: QUIESCE — de-select ──────────────────────────────
        - name: "L3 switch stage -> quiesce (PHASE 1 — the FIRST stage that mutates anything; a failure from here leaves active-source cleared, the safe zero-transmitter state)"
          ansible.builtin.set_fact:
            _switch_stage: quiesce

        - name: "PHASE 1 (quiesce): clear active-source — the WP2
            supervisor's own continuous re-check sees this mismatch and
            stops+parks the outgoing initiator (spec §6.2 step 1); THIS
            field-clear is what an operator can observe, the actual halt
            is the supervisor's own re-check, not this write itself"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: "{{ l3_target_namespace }}" }
              data:
                active-source: null

        - name: "PHASE 1 (quiesce): clear target-info/epoch — secondary
            newcomer-block (spec §6.2 step 1); holds any not-yet-started
            supervisor at wait_for_target_info until phase 2 republishes
            a FRESH endpoint"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: "{{ l3_target_namespace }}" }
              data:
                target-info: null
                epoch: null

        - name: "L3: test-only fault injection boundary (umbrella #201
            WP4b — no-op on every real run; proves a quiesce-only failure
            leaves zero transmitters — active-source cleared, viewer NOT
            yet re-pointed — and releases the lock)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: fault_inject
          vars:
            l3_fault_inject_boundary: post-switch-quiesce

        - name: "PHASE 1 (quiesce): fixed settle wait (umbrella #306 design
            round #2) — l3_switch_quiesce_settle_seconds, standard Ansible
            sleep idiom (wait_for with only timeout:). Gives the outgoing
            supervisor's own continuous re-check (spec §6.2 step 1) time to
            genuinely stop transmitting before PHASE 2 restarts the viewer
            at the new flow.id — a fixed wait, not a poll, because there is
            no observable external signal for 'the supervisor has stopped'
            short of the coordinator fields this step already cleared."
          ansible.builtin.wait_for:
            timeout: "{{ l3_switch_quiesce_settle_seconds }}"

        # ── PHASE 2: RE-POINT — restart the viewer at the new flow.id ──
        - name: "L3 switch stage -> repoint (PHASE 2 — from here the viewer's Helm release has been re-pointed, so a `refused detail=repoint` tells the console something materially different from `detail=quiesce`)"
          ansible.builtin.set_fact:
            _switch_stage: repoint

        - name: "PHASE 2 (re-point): re-point + restart the viewer (umbrella
            #201 WP4b condition 1, chart arg fixed by umbrella #306,
            WAIT MODEL REPLACED by umbrella #306 design round #2 —
            job 413 proved helm's own --wait/rollback-wait verdict can be
            WRONG: its 90s upgrade wait expired during genuine pod
            turnover, then its rollback wait ALSO expired even though the
            rollback had verifiably converged seconds later. Helm-as-oracle
            is gone: NO --wait, NO --timeout, NO --rollback-on-failure, NO
            --atomic — this command's own rc is DIAGNOSTIC ONLY, exactly
            like the rollback command in switch_rollback_and_verify.yml
            (failed_when: false, same reasoning): a non-zero rc here does
            NOT jump to rescue on its own — PHASE 2 verify (next task, via
            kubernetes.core.k8s_info polling, switch_verify_upgrade.yml)
            always runs and decides readiness directly, regardless of
            whether this command itself reported success. A verify failure
            (whether triggered by this command's own rc!=0, or by a rc=0
            upgrade whose Deployment never actually converges — job 413's
            own shape) runs the SAME verified helm rollback (never trusting
            helm's own wait/rc verdict either way). active-source is
            ALREADY cleared (phase 1), so however PHASE 2 verify concludes,
            the coordinator never sees a half-switched state. The chart
            positional is the LOCAL path switch_resolve_chart.yml already
            pulled (same installed version the release is on, never
            l3_chart_version) — Helm's own `[RELEASE] [CHART]` contract
            requires it; omitting it was umbrella #306's ORIGINAL bug.
            --reuse-values (never --reset-values/--reset-then-reuse-values)
            preserves every value the L3 launcher injected at install
            time; only flow.id is overridden here."
          ansible.builtin.command:
            argv:
              - helm
              - upgrade
              - "{{ receiver_instance }}"
              - "{{ _switch_chart_tmp.path }}/{{ _switch_chart_name }}"
              - -n
              - "{{ l3_target_namespace }}"
              - --reuse-values
              - --set
              - "flow.id={{ _switch_target_projection.flow_id }}"
          changed_when: true
          failed_when: false

        - name: "L3: test-only fault injection boundary (umbrella #201
            WP4b — no-op on every real run; proves a re-point failure
            leaves active-source cleared and releases the lock even though
            the viewer's own Helm release already re-pointed)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: fault_inject
          vars:
            l3_fault_inject_boundary: post-switch-repoint

        - name: "PHASE 2 verify (umbrella #306 design round #2) — poll
            kubernetes.core.k8s_info until the target Deployment reaches
            rollout-status readiness AND the coordinator's target-info/
            epoch are fresh, or l3_switch_upgrade_verify_timeout_seconds is
            exhausted. Sets _switch_upgrade_verify_ready — see
            roles/l3_run_guard/tasks/switch_verify_upgrade.yml for the full
            rationale (this replaces helm's own --wait entirely)."
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: switch_verify_upgrade

        - name: "PHASE 2 verify FAILED (umbrella #306 design round #2) —
            never trust helm's own rc or wait verdict; the facility lock,
            the cleared active-source, and target-info/epoch ALL stay
            exactly as PHASE 1 left them while this runs. Rolls back to the
            pre-switch revision, verifies the rollback via ALL FOUR pass
            criteria (switch_poll_rollback_verify.yml), and EITHER restores
            the pre-switch active-source (only if one was set) and fails
            with rollback_verified previous_source_restored, OR — if
            rollback verification itself fails — leaves active-source
            absent and fails with rollback_verification_failed. A switch
            that did not reach its requested target NEVER reports success
            either way."
          when: not _switch_upgrade_verify_ready
          block:
            - name: "L3 switch: roll back the receiver + verify all four pass criteria (umbrella #306 design round #2)"
              ansible.builtin.include_role:
                name: l3_run_guard
                tasks_from: switch_rollback_and_verify

            - name: "L3 switch: rollback verified — restore the pre-switch active-source (ONLY IF one was set pre-quiesce; criterion 4 of switch_rollback_verified already proves fresh target-info/epoch)"
              kubernetes.core.k8s:
                state: present
                definition:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata: { name: mxl-coordinator, namespace: "{{ l3_target_namespace }}" }
                  data:
                    active-source: "{{ _switch_baseline.active_source }}"
              when: _switch_rollback_verified and (_switch_baseline.active_source | trim) != ''

            - name: "L3 switch outcome: mark emitted + emit rollback_verified_previous_source_restored
                (umbrella #323) — BEFORE the fail task below: an
                ansible.builtin.fail ends this branch immediately, so the
                event has to be rendered first or it would never fire.
                Setting _switch_outcome_emitted here (not inside
                _emit_switch_outcome.yml itself — see that file's own
                header for why the sentinel stays playbook-owned) is what
                lets the rescue: below tell 'this branch already reported
                its own honest outcome' apart from every other failure and
                skip a second, redundant `refused` marker."
              ansible.builtin.set_fact:
                _switch_outcome_emitted: true
              when: _switch_rollback_verified

            - name: "L3 switch outcome: emit rollback_verified_previous_source_restored
                (umbrella #323) — ONLY on the exit where the restore task
                above genuinely RAN, i.e. the pre-switch coordinator
                actually had an active-source. The `when:` here is the
                SAME conjunction that gates the restore itself, on purpose:
                the two must never disagree, because this token is a claim
                ABOUT that task having run."
              ansible.builtin.include_role:
                name: l3_run_guard
                tasks_from: _emit_switch_outcome
              vars:
                l3_switch_outcome_token: rollback_verified_previous_source_restored
                l3_switch_outcome_kv: >-
                  run_id={{ l3_run_id | default('') }}
                  request_id={{ l3_request_id | default('') }}
                  receiver_instance={{ receiver_instance }}
                  restored_active_source={{ _switch_baseline.active_source | default('') }}
                  baseline_revision={{ _switch_baseline.revision }}
              when: _switch_rollback_verified and (_switch_baseline.active_source | trim) != ''

            - name: "L3 switch outcome: emit rollback_verified_no_previous_source
                (umbrella #323 fix round, codex gate P2a) — the OTHER
                verified-rollback exit: the restore task above was skipped
                because the pre-switch coordinator had active-source ABSENT,
                so there was nothing to restore. The old code emitted
                rollback_verified_previous_source_restored here too, with
                restored_active_source rendering EMPTY — a factually false
                enum on a perfectly valid exit, which is exactly the kind of
                thing a console acts on wrongly. Carries NO
                restored_active_source kv, because none was restored. The
                legacy stdout fail message for this branch is deliberately
                UNCHANGED and shared with the sibling exit (see the fail
                task below) — dmf-cms's #320 bridge parses it byte-for-byte
                during the transition; only the structured enum splits."
              ansible.builtin.include_role:
                name: l3_run_guard
                tasks_from: _emit_switch_outcome
              vars:
                l3_switch_outcome_token: rollback_verified_no_previous_source
                l3_switch_outcome_kv: >-
                  run_id={{ l3_run_id | default('') }}
                  request_id={{ l3_request_id | default('') }}
                  receiver_instance={{ receiver_instance }}
                  baseline_revision={{ _switch_baseline.revision }}
              when: _switch_rollback_verified and (_switch_baseline.active_source | trim) == ''

            - name: "L3 switch: rollback verified — still a failed switch (never silently succeed on a restore). ONE fail task for BOTH verified-rollback exits: this msg is dmf-cms's #320 stdout bridge contract and stays byte-identical; the restored-vs-no-previous-source distinction lives in the structured event above, never here (umbrella #323 fix round, codex gate P2a)"
              ansible.builtin.fail:
                msg: >-
                  rollback_verified previous_source_restored:
                  receiver_instance={{ receiver_instance }}
                  request_id={{ l3_request_id | default('') }}
                  restored_active_source={{ _switch_baseline.active_source | default('') }}.
                  PHASE 2's upgrade did not verify within
                  {{ l3_switch_upgrade_verify_timeout_seconds }}s; the
                  receiver was rolled back to revision
                  {{ _switch_baseline.revision }} and independently
                  verified (values, Deployment rollout-status, pod
                  flow.id, coordinator freshness). The pre-switch
                  active-source was restored where one was set. This
                  switch did NOT reach its requested target — operator
                  retry required.
              when: _switch_rollback_verified

            - name: "L3 switch outcome: mark emitted + emit rollback_verification_failed
                (umbrella #323) — same BEFORE-the-fail-task ordering as
                the sibling branch above, see its own comment."
              ansible.builtin.set_fact:
                _switch_outcome_emitted: true
              when: not _switch_rollback_verified

            - name: "L3 switch outcome: emit rollback_verification_failed (umbrella #323)"
              ansible.builtin.include_role:
                name: l3_run_guard
                tasks_from: _emit_switch_outcome
              vars:
                l3_switch_outcome_token: rollback_verification_failed
                l3_switch_outcome_kv: >-
                  run_id={{ l3_run_id | default('') }}
                  request_id={{ l3_request_id | default('') }}
                  receiver_instance={{ receiver_instance }}
                  baseline_revision={{ _switch_baseline.revision }}
              when: not _switch_rollback_verified

            - name: "L3 switch: rollback verification FAILED — active-source stays absent, no restore attempted"
              ansible.builtin.fail:
                msg: >-
                  rollback_verification_failed:
                  receiver_instance={{ receiver_instance }}
                  request_id={{ l3_request_id | default('') }}.
                  PHASE 2's upgrade did not verify within
                  {{ l3_switch_upgrade_verify_timeout_seconds }}s; a helm
                  rollback to revision {{ _switch_baseline.revision }} was
                  attempted but did NOT verify within
                  {{ l3_switch_rollback_verify_timeout_seconds }}s either
                  (values/rollout-status/pod-flow-id/coordinator-freshness
                  not all confirmed). active-source is left absent
                  (zero-transmitter, the spec's own safe state) — the lock
                  is about to be released; OPERATOR INTERVENTION REQUIRED,
                  this is not a state a retry alone is guaranteed to fix.
              when: not _switch_rollback_verified

        # ── PHASE 3: SELECT — set active-source ───────────────────────
        - name: "L3 switch stage -> select (PHASE 3 — the switch is all but complete; a refusal here is the closest-to-done exit the catch-all reports)"
          ansible.builtin.set_fact:
            _switch_stage: select

        - name: "PHASE 3 (select): set active-source = the switch target —
            only the matching supervisor un-parks, and because phase 1
            cleared the endpoint it can ONLY start against phase 2's fresh
            target-info/epoch (spec §6.2 step 3)"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata: { name: mxl-coordinator, namespace: "{{ l3_target_namespace }}" }
              data:
                active-source: "{{ _switch_target_projection.active_source }}"

        # `final-readback`, NOT `final-readback-mismatch`: this stage covers
        # BOTH the k8s_info read and the conjunction assert below, and a
        # failure of the read itself is not a mismatch. Naming the stage
        # after only one of its two failure modes would reintroduce exactly
        # the false-enum class this fix round closed for
        # rollback_verified_no_previous_source (P2a). The assert's own
        # legacy stdout line keeps its more specific, unchanged
        # "detail=switch-final-readback-mismatch" wording.
        - name: "L3 switch stage -> final-readback (PHASE 3 verification: the readback read AND its conjunction assert)"
          ansible.builtin.set_fact:
            _switch_stage: final-readback

        - name: "PHASE 3 final readback (umbrella #306 design round #2) —
            re-read the coordinator ConfigMap and assert the FULL
            conjunction for the target: the PATCH above genuinely landed
            (never trust a k8s module's own reported success — the same
            'call-success never equals clean' discipline
            rollback_helm_surface.yml already applies to helm), and
            target-info/epoch are STILL fresh (defense in depth against a
            race between PHASE 2 verify's own read and this patch)."
          kubernetes.core.k8s_info:
            api_version: v1
            kind: ConfigMap
            name: mxl-coordinator
            namespace: "{{ l3_target_namespace }}"
          register: _switch_final_readback

        - name: "PHASE 3 final readback: assert the full conjunction"
          ansible.builtin.assert:
            that:
              - _switch_final_readback.resources | length > 0
              - _switch_final_readback.resources[0].data['active-source'] | default('') == _switch_target_projection.active_source
              - (_switch_final_readback.resources[0].data['target-info'] | default('') | trim) != ''
              - (_switch_final_readback.resources[0].data['epoch'] | default('') | trim) != ''
            fail_msg: >-
              DMF_L3_SWITCH_REFUSED: detail=switch-final-readback-mismatch
              request_id={{ l3_request_id | default('') }}
              receiver_instance={{ receiver_instance }}
              got={{ _switch_final_readback.resources[0].data | default({}) }}

        - name: "L3 switch success — release the lock (see this playbook's
            own header for the DMF_L3_SWITCH_OUTCOME decision — a switch
            still never emits DMF_L3_OUTCOME, that remains launch/teardown/
            rollback's own snapshot-based vocabulary)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_release

        - name: "L3 switch outcome: emit success (umbrella #323) — the LAST
            task in this block, deliberately AFTER lock_release above: if
            anything from here down could still fail the run, this stays
            unreached and the failure is reported honestly through rescue:
            instead — never a success marker followed by a FAILED AWX job."
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: _emit_switch_outcome
          vars:
            l3_switch_outcome_token: success
            l3_switch_outcome_kv: >-
              run_id={{ l3_run_id | default('') }}
              request_id={{ l3_request_id | default('') }}
              receiver_instance={{ receiver_instance }}
              active_source={{ _switch_target_projection.active_source }}
      rescue:
        - name: "L3 switch outcome: emit refused (umbrella #323) — the
            generic catch-all for every failure that DIDN'T already emit
            its own specific marker in-block (pre-lock refusals, the
            shared identity.yml/lock.yml reserved-var/lock-unavailable/
            facility-busy paths, switch_read_coordinator/
            switch_resolve_chart/switch_capture_baseline read failures,
            PHASE 1 mutation failures, a PHASE 3 final-readback mismatch,
            or any genuinely unexpected exception) — see this playbook's
            own header for why all of these share one token: they are
            exactly the set this rescue's own next task already
            classifies as 'leaves active-source cleared/absent, the safe
            quiesced state'. Guarded on _switch_outcome_emitted so a
            PHASE-2 verify-failed branch's own more specific marker
            (rollback_verified_previous_source_restored /
            rollback_verified_no_previous_source /
            rollback_verification_failed, set BEFORE its own fail task —
            see that block's own comments) is never followed by a second,
            redundant one here — mirrors l3_pre_mutation_marker_emitted /
            gate_rescue.yml's own branch A. Runs FIRST in this rescue,
            before the lock-release backstop below, matching
            gate_rescue.yml's own emit-then-release ordering."
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: _emit_switch_outcome
          vars:
            l3_switch_outcome_token: refused
            # detail= FIRST, immediately after the token: every field after
            # it may carry caller-supplied free text (receiver_instance is a
            # caller extra_var), so a parser that reads the FIRST detail=
            # can never be spliced by a value planted later in the line.
            # _switch_stage is proven caller-free by this play's own first
            # task (switch_outcome_guard) — see this playbook's header and
            # that file's own for why reserving the name was necessary but
            # NOT sufficient on its own.
            l3_switch_outcome_kv: >-
              detail={{ _switch_stage | default('pre-lock') }}
              run_id={{ l3_run_id | default('<unknown>') }}
              request_id={{ l3_request_id | default('<unknown>') }}
              receiver_instance={{ receiver_instance | default('<unknown>') }}
          # Skip ONLY when the sentinel says a specific marker already fired
          # AND the trusted failure state that is the sole legitimate reason
          # for one agrees: PHASE 2 verify genuinely ran and concluded
          # not-ready. Defense in depth for the umbrella #323 fix round's
          # own P1 — the guard at the top of this play already proves both
          # names caller-free, and this conjunction means that even if that
          # guard were bypassed, no SINGLE shadowed extra_var could suppress
          # this event: `-e _switch_outcome_emitted=true` alone still emits,
          # because _switch_upgrade_verify_ready is undefined on every
          # pre-PHASE-2 refusal (which is every exit the old, sentinel-only
          # condition silently swallowed).
          when: >-
            not (_switch_outcome_emitted | default(false))
            or (_switch_upgrade_verify_ready is not defined)
            or (_switch_upgrade_verify_ready | default(false) | bool)

        - name: "L3 switch rescue — UNCONDITIONAL lock release (umbrella
            #201 WP4b condition 3, REVISED by umbrella #306 design round
            #2): this is still the FINAL backstop, unconditionally
            releasing the facility lock no matter which phase failed —
            including a failed PHASE 2 verify-rollback-and-verify sequence
            above, whose own ansible.builtin.fail tasks land here exactly
            like any other failure. It is deliberately NOT where any
            rollback/restore logic lives — that machinery is entirely
            in-block (the 'PHASE 2 verify FAILED' block above), scoped
            specifically to 'the upgrade was applied but didn't verify';
            every OTHER failure this rescue catches (pre-lock refusals,
            switch_resolve_chart/switch_capture_baseline read failures,
            PHASE 1 mutation failures, a PHASE 3 final-readback mismatch)
            still leaves active-source cleared/absent — the spec's own
            safe quiesced state, no rollback needed because nothing
            further to restore. Note PHASE 2's own helm upgrade command no
            longer fails outright on rc!=0 (failed_when: false — its rc is
            diagnostic only, exactly like the rollback command): every
            PHASE-2-onward failure now flows through the verify-rollback-
            and-verify sequence above instead, never straight to this
            rescue."
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: lock_release

        - name: Re-raise (this rescue only releases the lock, never terminates the play itself)
          ansible.builtin.fail:
            msg: >-
              MXL fabrics-demo switch failed for
              receiver_instance={{ receiver_instance | default('<unknown>') }}
              request_id={{ l3_request_id | default('<unknown>') }}. See the
              task error above for the root cause — if an automatic rollback
              ran, its own outcome is reported in a separate error just
              above this one; the facility lock has already been released.
              Operator retry/rollback required.
      always:
        - name: "L3 switch: remove the temporary chart directory (umbrella
            #306) — idempotent, a no-op when switch_resolve_chart.yml never
            ran (e.g. a pre-lock refusal in scenarios 1-3). Lives in this
            outer always:, not switch_resolve_chart.yml's own task file,
            because the pulled chart's lifetime spans PHASE 2's re-point,
            well past that file — removing it any earlier would delete the
            chart PHASE 2 still needs (umbrella #296's own lesson, applied
            here).

            failed_when: false (umbrella #323 fix round, codex gate P2b):
            this is HOUSEKEEPING — a tempdir this play created, in a
            directory nothing else depends on. It used to be able to fail
            the job, and because it lives in the outer always: it runs AFTER
            the block has already emitted `success`: an unwritable/vanished
            tempdir therefore produced a FAILED AWX job carrying a success
            event, i.e. the exact contradiction the success-emit ordering
            comment above exists to prevent. A cleanup failure must never
            change this run's outcome — it is not evidence about the switch.
            The residue is a stale directory under the controller's own
            tempdir, self-clearing on reboot and harmless in the ephemeral
            AWX EE pod this actually runs in. The sibling lock-release
            backstop below is NOT the same exposure: release.yml already
            wraps its own work in a block/rescue that logs and swallows
            (its own R4a/P1-3 header) — it cannot fail the play today, so
            there is nothing to fix there."
          ansible.builtin.file:
            path: "{{ _switch_chart_tmp.path | default('') }}"
            state: absent
          changed_when: false
          failed_when: false
          when: _switch_chart_tmp is defined

        - name: "L3 switch release — idempotent lock-release backstop
            (mirrors launch/teardown's own release.yml backstop; a no-op
            if the block or rescue above already released it)"
          ansible.builtin.include_role:
            name: l3_run_guard
            tasks_from: release
